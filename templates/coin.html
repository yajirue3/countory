<!-- templates/coin.html -->
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Solana (SOL) トレード</title>
    <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Black+Ops+One&family=M+PLUS+1p:wght@900&display=swap');

        :root {
            --neon-pink: #ff007f; --neon-cyan: #00f3ff; --neon-yellow: #ffe600;
            --neon-green: #00ff66; --neon-red: #ff003c;
        }

        * { box-sizing: border-box; }

        body { 
            font-family: 'M PLUS 1p', 'Black Ops One', sans-serif; 
            background: #000;
            background-image: 
                radial-gradient(circle at 50% 50%, #1a1a2e 0%, #000000 90%),
                linear-gradient(0deg, rgba(0, 243, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 0, 127, 0.05) 1px, transparent 1px);
            background-size: 100% 100%, 30px 30px, 30px 30px;
            color: #fff; display: flex; justify-content: center; align-items: center;
            margin: 0; min-height: 100vh; padding: 10px;
        }

        .container { width: 100%; max-width: 500px; display: flex; flex-direction: column; gap: 10px; }
        .card { 
            background: rgba(10, 2, 18, 0.95); border: 2px solid var(--neon-cyan); 
            border-radius: 14px; padding: 15px; box-shadow: 0 0 25px rgba(0, 243, 255, 0.4); 
            display: flex; flex-direction: column; gap: 12px;
        }
        .header { 
            font-size: 1.3rem; font-weight: 900; color: var(--neon-yellow); 
            text-align: center; border-bottom: 2px solid var(--neon-pink); 
            padding-bottom: 5px; text-shadow: 0 0 10px var(--neon-yellow);
        }

        #chart-container { width: 100%; height: 260px; border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 8px; overflow: hidden; background: #050510; }

        .status-display { display: flex; justify-content: space-between; background: #000; border: 1px solid var(--neon-cyan); border-radius: 8px; padding: 10px; }
        .stat-box { text-align: center; width: 48%; }
        .stat-label { font-size: 0.75rem; color: #aaa; margin-bottom: 3px; }
        .stat-val { font-size: 1.2rem; font-weight: 900; font-family: 'Black Ops One', monospace; transition: color 0.3s;}
        .val-up { color: var(--neon-green); text-shadow: 0 0 10px var(--neon-green); }
        .val-down { color: var(--neon-red); text-shadow: 0 0 10px var(--neon-red); }
        .val-neutral { color: #fff; }
        
        #position-info { font-size: 0.8rem; color: var(--neon-cyan); text-align: center; min-height: 1.2rem; }

        .inputs-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .input-group { display: flex; flex-direction: column; }
        .label { font-size: 0.75rem; color: var(--neon-cyan); margin-bottom: 4px; }
        input, select { 
            width: 100%; padding: 8px; border-radius: 6px; border: 1.5px solid var(--neon-cyan); 
            background: rgba(10, 10, 20, 0.9); color: #fff; font-weight: bold; outline: none;
        }

        .btn-group { display: flex; gap: 10px; margin-top: 5px; }
        button { flex: 1; padding: 12px; border: none; border-radius: 8px; font-weight: 900; font-size: 1rem; cursor: pointer; transition: transform 0.1s; }
        button:active:not(:disabled) { transform: scale(0.95); }
        button:disabled { filter: grayscale(1); cursor: not-allowed; opacity: 0.5; }
        .btn-buy { background: linear-gradient(135deg, #00f3ff 0%, #0066ff 100%); color: #fff; box-shadow: 0 0 15px var(--neon-cyan); }
        .btn-sell { background: linear-gradient(135deg, #ff007f 0%, #990000 100%); color: #fff; box-shadow: 0 0 15px var(--neon-pink); }
        
        .footer { text-align: center; margin-top: 5px; }
        .btn-back { background: transparent; color: #888; border: 1px solid #555; padding: 5px 15px; font-size: 0.85rem;}
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <div class="header">📈 SOL トレード</div>
        
        <div id="chart-container"></div>
        <div id="position-info">データを読み込み中...</div>

        <div class="status-display">
            <div class="stat-box">
                <div class="stat-label">現在価格 (USDT)</div>
                <div id="current-price" class="stat-val val-neutral">---</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">評価額 (Gold)</div>
                <div id="my-value" class="stat-val val-neutral">未保有</div>
            </div>
        </div>

        <div class="inputs-grid">
            <div class="input-group">
                <div class="label">💳 支払/受取口座</div>
                <select id="wallet-select"></select>
            </div>
            <div class="input-group">
                <div class="label">💎 投資額 (Gold)</div>
                <input type="number" id="bet-amount" min="10" value="1000">
            </div>
        </div>

        <div class="btn-group">
            <button id="btn-buy" class="btn-buy" disabled>📈 買い (Buy)</button>
            <button id="btn-sell" class="btn-sell" disabled>📉 決済 (Sell)</button>
        </div>
        
        <div class="footer">
            <button class="btn-back" onclick="location.href='/casino'">◀ 戻る</button>
        </div>
    </div>
</div>

<script>
    const token = localStorage.getItem("access_token");
    if (!token) window.location.href = "/";

    let currentPrice = 0;
    let isHolding = false;
    let entryPrice = 0;
    let entryAmountSol = 0;
    let entryGold = 0;
    let ws;
    
    // データ保持数（画面枠に収まる最大数）
    const MAX_POINTS = 20; 
    let chartData = []; 

    const chartProperties = {
        width: document.getElementById('chart-container').clientWidth,
        height: 260,
        layout: { background: { type: 'solid', color: 'transparent' }, textColor: '#d1d4dc' },
        grid: { vertLines: { visible: false }, horzLines: { color: 'rgba(42, 46, 57, 0.2)' } },
        crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
        timeScale: { timeVisible: true, secondsVisible: false, fixLeftEdge: true, rightOffset: 2 },
    };
    
    const chart = LightweightCharts.createChart(document.getElementById('chart-container'), chartProperties);
    const lineSeries = chart.addLineSeries({ color: '#00f3ff', lineWidth: 3 });

    // 1. 口座とポジションの取得（エラーが起きてもUIを止めない設計）
    async function loadUserState() {
        const infoEl = document.getElementById("position-info");
        try {
            const [wRes, pRes] = await Promise.all([
                fetch("/api/wallets", { headers: { "Authorization": `Bearer ${token}` } }),
                fetch("/api/coin/position", { headers: { "Authorization": `Bearer ${token}` } })
            ]);

            if (wRes.ok) {
                const wallets = await wRes.json();
                const selectEl = document.getElementById("wallet-select");
                if (selectEl && wallets.length > 0) {
                    selectEl.innerHTML = wallets.map(w => 
                        `<option value="${w.wallet_id}">${w.wallet_name} - ${w.balance}G</option>`
                    ).join('');
                }
            }

            if (pRes.ok) {
                const pos = await pRes.json();
                if (pos && pos.wallet_id) {
                    isHolding = true;
                    entryPrice = parseFloat(pos.entry_price);
                    entryAmountSol = parseFloat(pos.sol_amount);
                    entryGold = parseInt(pos.bet_gold);
                    const selectEl = document.getElementById('wallet-select');
                    if (selectEl) selectEl.value = pos.wallet_id;
                }
            }
            if (infoEl) infoEl.innerText = "接続完了 - リアルタイム更新中";
        } catch (e) {
            if (infoEl) infoEl.innerText = "口座情報の取得に失敗しました。";
        } finally {
            updateUI();
        }
    }

    // 2. 過去データの取得（awaitなしの非同期。直近20件のみ）
    async function fetchHistoricalData() {
        try {
            const res = await fetch(`https://api.binance.com/api/v3/klines?symbol=SOLUSDT&interval=1m&limit=${MAX_POINTS}`);
            if (!res.ok) return;
            
            const data = await res.json();
            chartData = data.map(d => ({
                time: Math.floor(d[0] / 1000), 
                value: parseFloat(d[4])
            }));
            lineSeries.setData(chartData);
            chart.timeScale().fitContent();
        } catch (e) {
            // ブロックされている場合は無視（リアルタイムのみで稼働）
        }
    }

    // 3. WebSocket（リアルタイム＆古いデータを消去するリングバッファ構造）
    function connectWebSocket() {
        if (ws) ws.close();
        try {
            ws = new WebSocket('wss://stream.binance.com:9443/ws/solusdt@miniTicker');
            
            ws.onmessage = (event) => {
                try {
                    const msg = JSON.parse(event.data);
                    if (!msg.c) return;

                    currentPrice = parseFloat(msg.c);
                    const t = Math.floor(msg.E / 1000);
                    
                    // 古いデータを消して最新を保つ
                    chartData.push({ time: t, value: currentPrice });
                    if (chartData.length > MAX_POINTS) {
                        chartData.shift(); 
                    }
                    lineSeries.setData(chartData);
                    chart.timeScale().fitContent();
                    
                    const priceEl = document.getElementById('current-price');
                    if (priceEl) priceEl.innerText = currentPrice.toFixed(2);
                    
                    updateUI();
                } catch(e) {}
            };
            ws.onclose = () => setTimeout(connectWebSocket, 3000);
        } catch(e) {
            setTimeout(connectWebSocket, 3000);
        }
    }

    function updateUI() {
        const btnBuy = document.getElementById('btn-buy');
        const btnSell = document.getElementById('btn-sell');
        const walletSelect = document.getElementById('wallet-select');
        const betInput = document.getElementById('bet-amount');
        const valEl = document.getElementById('my-value');
        const infoEl = document.getElementById('position-info');

        if (!btnBuy || !valEl) return;

        if (isHolding) {
            btnBuy.disabled = true;
            btnSell.disabled = false;
            walletSelect.disabled = true;
            betInput.disabled = true;

            const currentGold = Math.floor(entryAmountSol * currentPrice);
            const pnl = currentGold - entryGold;
            const sign = pnl >= 0 ? "+" : "";
            
            valEl.innerText = `${currentGold} Gold`;
            valEl.className = `stat-val ${pnl > 0 ? 'val-up' : (pnl < 0 ? 'val-down' : 'val-neutral')}`;
            if(infoEl) infoEl.innerText = `購入: ${entryPrice.toFixed(2)} USDT | 損益: ${sign}${pnl} G`;
        } else {
            btnBuy.disabled = (currentPrice === 0 || walletSelect.options.length === 0);
            btnSell.disabled = true;
            walletSelect.disabled = false;
            betInput.disabled = false;
            
            valEl.innerText = "未保有";
            valEl.className = "stat-val val-neutral";
            if (infoEl && currentPrice > 0 && infoEl.innerText.includes("接続完了")) {
                infoEl.innerText = "投資額を入力して購入してください";
            }
        }
    }

    document.getElementById('btn-buy').addEventListener('click', async () => {
        const wallet_id = document.getElementById("wallet-select").value;
        const amount = parseInt(document.getElementById("bet-amount").value);

        if (!wallet_id || isNaN(amount) || amount < 10) return alert("10 Gold以上を指定してください");
        
        document.getElementById('btn-buy').disabled = true;
        document.getElementById('position-info').innerText = "購入処理中...";

        try {
            const res = await fetch("/api/coin/buy", {
                method: "POST",
                headers: { "Content-Type": "application/json", "Authorization": `Bearer ${token}` },
                body: JSON.stringify({ wallet_id, amount })
            });
            const data = await res.json();
            
            if (!res.ok) throw new Error(data.detail || "購入エラー");

            isHolding = true;
            entryPrice = data.entry_price;
            entryAmountSol = data.sol_amount;
            entryGold = amount;
            alert(`購入完了！\n約定価格: ${data.entry_price} USDT`);
        } catch (e) {
            alert(e.message);
        }
        updateUI();
    });

    document.getElementById('btn-sell').addEventListener('click', async () => {
        const wallet_id = document.getElementById("wallet-select").value;
        
        document.getElementById('btn-sell').disabled = true;
        document.getElementById('position-info').innerText = "決済処理中...";

        try {
            const res = await fetch("/api/coin/sell", {
                method: "POST",
                headers: { "Content-Type": "application/json", "Authorization": `Bearer ${token}` },
                body: JSON.stringify({ wallet_id })
            });
            const data = await res.json();
            
            if (!res.ok) throw new Error(data.detail || "決済エラー");

            isHolding = false;
            const sign = data.pnl_gold >= 0 ? "+" : "";
            alert(`決済完了！\n決済価格: ${data.exit_price} USDT\n損益: ${sign}${data.pnl_gold} Gold`);
            
            await loadUserState();
        } catch (e) {
            alert(e.message);
        }
        updateUI();
    });

    window.addEventListener('resize', () => {
        const container = document.getElementById('chart-container');
        if (container) chart.applyOptions({ width: container.clientWidth });
    });

    // 初期化シーケンス（必ず自サーバーのデータ取得を優先させ、描画ブロックを防ぐ）
    (async () => {
        await loadUserState();
        connectWebSocket();
        fetchHistoricalData(); // 背景で実行（awaitしない）
    })();
</script>
</body>
</html>
