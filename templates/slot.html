<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>村岡王国 - 脳汁スロット</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Black+Ops+One&family=M+PLUS+1p:wght@900&family=Share+Tech+Mono&display=swap');

        :root {
            --neon-magenta: #ff007f;
            --neon-cyan: #00f3ff;
            --neon-green: #00ff66;
            --neon-yellow: #ffe600;
            --gold-gradient: linear-gradient(180deg, #ffd700 0%, #ff8c00 100%);
            --alert-red: #ff0000;
        }

        * { box-sizing: border-box; touch-action: manipulation; }
        
        body { 
            font-family: 'M PLUS 1p', 'Black Ops One', sans-serif; 
            background: #000;
            color: #fff; 
            display: flex; 
            justify-content: center; 
            align-items: center;
            margin: 0; 
            min-height: 100vh;
            user-select: none;
            overflow: hidden;
            /* 背景のサイバーパンクグリッド */
            background-image: 
                linear-gradient(rgba(255, 0, 127, 0.1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 243, 255, 0.1) 1px, transparent 1px);
            background-size: 30px 30px;
            animation: bg-scroll 10s linear infinite;
        }

        @keyframes bg-scroll { 0% { background-position: 0 0; } 100% { background-position: 30px 30px; } }

        /* 📱 レスポンシブコンテナ */
        .arcade-cabinet {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: env(safe-area-inset-top, 10px) 10px env(safe-area-inset-bottom, 10px) 10px;
        }

        /* 💻 デスクトップ向けオーバーライド */
        @media (min-width: 768px) {
            .arcade-cabinet {
                max-width: 600px;
                height: auto;
                aspect-ratio: 9/16;
                background: linear-gradient(180deg, #111 0%, #000 100%);
                border: 8px solid #222;
                border-radius: 20px;
                box-shadow: 0 0 50px rgba(255, 0, 127, 0.2), inset 0 0 20px rgba(0,0,0,0.8);
                padding: 20px;
                gap: 15px;
            }
        }

        /* 👑 超発光ヘッダー */
        .marquee {
            text-align: center;
            font-family: 'Black Ops One', sans-serif;
            font-size: clamp(1.5rem, 6vw, 2.5rem);
            color: var(--neon-cyan);
            background: #050505;
            border: 3px solid #222;
            border-radius: 12px;
            padding: 10px;
            text-shadow: 0 0 10px var(--neon-cyan);
            box-shadow: inset 0 0 15px rgba(0, 243, 255, 0.2);
            transition: all 0.1s;
        }
        .marquee.rgb-mode {
            animation: text-rgb 0.1s linear infinite, shake-hard 0.05s infinite;
            border-color: #fff;
            box-shadow: 0 0 50px var(--neon-magenta);
        }
        @keyframes text-rgb {
            0% { color: #ff0000; text-shadow: 0 0 20px #ff0000; }
            33% { color: #00ff00; text-shadow: 0 0 20px #00ff00; }
            66% { color: #0000ff; text-shadow: 0 0 20px #0000ff; }
            100% { color: #ff0000; text-shadow: 0 0 20px #ff0000; }
        }

        /* 🎛️ HUD (設定・メーター類) */
        .hud-panel {
            display: flex;
            flex-direction: column;
            gap: 8px;
            background: rgba(10, 10, 15, 0.9);
            border: 2px solid #333;
            border-radius: 10px;
            padding: 10px;
        }
        .inputs-row { display: flex; gap: 10px; }
        .input-group { flex: 1; display: flex; flex-direction: column; }
        .input-group label { font-size: 0.6rem; color: #888; font-weight: 900; letter-spacing: 1px; }
        .input-group select, .input-group input { 
            width: 100%; padding: 8px; background: #000; border: 1px solid var(--neon-magenta); 
            color: #fff; font-size: 1rem; font-weight: 900; outline: none; border-radius: 6px;
            box-shadow: inset 0 0 10px rgba(255,0,127,0.2);
        }
        
        .meters-row { display: flex; gap: 10px; margin-top: 5px; }
        .meter {
            flex: 1; background: #000; border: 2px solid #444; border-radius: 8px;
            padding: 8px; text-align: center;
        }
        .meter-label { font-size: 0.6rem; color: #aaa; font-weight: 900; margin-bottom: 2px; }
        .meter-val { 
            font-family: 'Share Tech Mono', monospace; font-size: clamp(1.2rem, 5vw, 1.8rem); 
            color: var(--neon-red); text-shadow: 0 0 10px var(--neon-red); line-height: 1;
        }
        .meter-val.green { color: var(--neon-green); text-shadow: 0 0 15px var(--neon-green); }

        /* 🎰 メインステージ (リール & ランプ) */
        .stage-area {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: radial-gradient(circle, #222 0%, #000 100%);
            border: 4px solid #555;
            border-radius: 12px;
            padding: 10px 5px;
            box-shadow: inset 0 0 50px #000;
            position: relative;
        }

        /* 🚨 GOGOランプ (左側) */
        .gogo-lamp {
            width: 22%;
            aspect-ratio: 1;
            background: #111;
            border-radius: 50%;
            border: 4px solid #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Black Ops One', sans-serif;
            font-size: clamp(0.7rem, 2.5vw, 1rem);
            color: #111;
            line-height: 1.1;
            box-shadow: inset 0 0 20px #000;
            transition: all 0.1s;
        }
        .gogo-lamp span { font-size: clamp(0.9rem, 3.5vw, 1.4rem); color: #111; }
        .gogo-lamp.peka {
            background: #fff;
            color: var(--neon-magenta);
            border-color: #fff;
            box-shadow: 0 0 60px #fff, 0 0 120px var(--neon-magenta), inset 0 0 20px #fff;
            text-shadow: 0 0 10px var(--neon-magenta);
            animation: strobe-flash 0.05s infinite;
        }
        .gogo-lamp.peka span { color: var(--neon-magenta); text-shadow: 0 0 10px var(--neon-magenta); }
        @keyframes strobe-flash { 0% { opacity: 1; filter: invert(0); } 100% { opacity: 0.8; filter: invert(1); } }

        /* リールコンテナ */
        .reels-wrapper {
            width: 75%;
            display: flex;
            gap: 4px;
            background: #000;
            padding: 6px;
            border: 4px solid #444;
            border-radius: 8px;
            position: relative;
        }
        /* 有効ライン・レーザー */
        .reels-wrapper::after {
            content: ""; position: absolute;
            top: 50%; left: 0; right: 0; height: 3px;
            background: var(--alert-red);
            box-shadow: 0 0 15px var(--alert-red), 0 0 30px #ff0000;
            transform: translateY(-50%);
            z-index: 10; pointer-events: none;
            mix-blend-mode: screen;
        }
        .reel-window {
            flex: 1;
            aspect-ratio: 1 / 2.5;
            background: #e6e6e6;
            overflow: hidden;
            position: relative;
            border-radius: 4px;
            box-shadow: inset 0 30px 20px -20px #000, inset 0 -30px 20px -20px #000;
        }
        .reel-strip {
            position: absolute; top: 0; left: 0; width: 100%;
            display: flex; flex-direction: column; will-change: transform;
        }
        .symbol {
            width: 100%; height: 33.333%;
            display: flex; align-items: center; justify-content: center;
            font-size: clamp(2rem, 7vw, 3rem); font-weight: 900;
            border-bottom: 1px solid rgba(0,0,0,0.1);
        }
        /* 図柄デザイン */
        .sym-7 { color: #ff0000; text-shadow: 2px 2px 0 #550000, -1px -1px 0 #fff; font-size: 1.2em; }
        .sym-bar { 
            color: #fff; background: #222; border: 4px solid #888; 
            width: 90%; height: 60%; font-size: 0.5em; 
            display: flex; align-items: center; justify-content: center; 
            border-radius: 6px; box-shadow: inset 0 5px 10px rgba(255,255,255,0.4); 
            letter-spacing: 2px;
        }
        .sym-bell { font-size: 0.9em; filter: drop-shadow(2px 2px 0px #000); }
        .sym-grape { font-size: 0.9em; filter: drop-shadow(2px 2px 0px #000); }
        .sym-cherry { font-size: 0.9em; filter: drop-shadow(2px 2px 0px #000); }
        .sym-replay { font-size: 0.8em; filter: drop-shadow(0 0 8px #00f3ff); }
        
        .spin-blur { filter: blur(3px) brightness(1.2); }

        /* 🔘 アクションボタン群 */
        .controls-area {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .stop-buttons {
            display: flex;
            justify-content: flex-end;
            width: 100%;
            gap: 8px;
            padding-left: 25%; /* ランプの右側に配置 */
        }
        .btn-stop {
            flex: 1; aspect-ratio: 1.5;
            background: linear-gradient(180deg, #ff4444 0%, #aa0000 100%);
            border: 2px solid #ffaaaa; border-radius: 10px;
            box-shadow: 0 8px 0 #550000, 0 10px 20px rgba(0,0,0,0.8);
            color: #fff; font-size: clamp(0.8rem, 3vw, 1.2rem); font-weight: 900;
            cursor: pointer; transition: all 0.05s;
        }
        .btn-stop:active:not(:disabled) {
            transform: translateY(8px); box-shadow: 0 0 0 #550000; background: #ff0000;
        }
        .btn-stop:disabled {
            background: #333; border-color: #444; color: transparent;
            box-shadow: 0 8px 0 #111; cursor: not-allowed;
        }

        .btn-start {
            width: 100%; padding: 20px 0;
            background: var(--gold-gradient);
            border: 4px solid #fff; border-radius: 16px;
            color: #000; font-size: clamp(1.5rem, 6vw, 2.2rem); font-weight: 900; font-family: 'Black Ops One', sans-serif;
            text-transform: uppercase; letter-spacing: 2px;
            box-shadow: 0 10px 0 #a65c00, 0 20px 40px rgba(0,0,0,0.9);
            text-shadow: 0 2px 2px rgba(255,255,255,0.8);
            cursor: pointer; transition: all 0.05s;
        }
        .btn-start:active:not(:disabled) {
            transform: translateY(10px); box-shadow: 0 0 0 #a65c00;
        }
        .btn-start:disabled {
            background: #222; border-color: #444; color: #555;
            box-shadow: 0 10px 0 #111; text-shadow: none; cursor: not-allowed;
        }

        .footer-link { text-align: center; margin-top: 5px; }
        .footer-link a { color: var(--neon-cyan); text-decoration: none; font-size: 0.8rem; font-weight: bold; }

        /* 💥 脳汁オーバーロード演出 */
        #flash-bang {
            position: fixed; top:0; left:0; width:100%; height:100%;
            background: #fff; opacity: 0; pointer-events: none; z-index: 9999; mix-blend-mode: overlay;
        }
        body.mega-flash #flash-bang { animation: bang-anim 0.3s ease-out; }
        .shake-hard { animation: shake-hard 0.05s infinite; }
        .num-pop { animation: mega-pop 0.1s alternate 2; color: #fff !important; text-shadow: 0 0 20px #fff, 0 0 40px var(--neon-yellow) !important; }

        @keyframes bang-anim { 0% { opacity: 1; background: #fff; } 50% { background: var(--neon-magenta); } 100% { opacity: 0; } }
        @keyframes shake-hard {
            0% { transform: translate(4px, 4px) rotate(1deg); }
            50% { transform: translate(-4px, -4px) rotate(-1deg); }
            100% { transform: translate(4px, -4px) rotate(1deg); }
        }
        @keyframes mega-pop { 0% { transform: scale(1); } 100% { transform: scale(1.4); } }
    </style>
</head>
<body>

<div id="flash-bang"></div>

<div class="arcade-cabinet" id="cabinet">
    <div class="marquee" id="marquee">MURAOKA CHANCE</div>

    <div class="hud-panel">
        <div class="inputs-row">
            <div class="input-group">
                <label>ACCOUNT</label>
                <select id="wallet-select"></select>
            </div>
            <div class="input-group">
                <label>BET</label>
                <input type="number" id="bet-amount" min="1" value="3">
            </div>
        </div>
        <div class="meters-row">
            <div class="meter">
                <div class="meter-label">CREDIT</div>
                <div class="meter-val" id="credit-display">---</div>
            </div>
            <div class="meter">
                <div class="meter-label">WIN</div>
                <div class="meter-val green" id="payout-display">0</div>
            </div>
        </div>
    </div>

    <div class="stage-area">
        <div class="gogo-lamp" id="gogo-lamp">GOGO!<br><span>CHANCE</span></div>
        <div class="reels-wrapper">
            <div class="reel-window"><div class="reel-strip" id="reel-0"></div></div>
            <div class="reel-window"><div class="reel-strip" id="reel-1"></div></div>
            <div class="reel-window"><div class="reel-strip" id="reel-2"></div></div>
        </div>
    </div>

    <div class="controls-area">
        <div class="stop-buttons">
            <button class="btn-stop" id="btn-stop-0" disabled>1</button>
            <button class="btn-stop" id="btn-stop-1" disabled>2</button>
            <button class="btn-stop" id="btn-stop-2" disabled>3</button>
        </div>
        <button class="btn-start" id="btn-start">SPIN</button>
        <div class="footer-link"><a href="/casino">◀ BACK TO CASINO</a></div>
    </div>
</div>

<script>
    const token = localStorage.getItem("access_token");
    if (!token) window.location.href = "/";

    const SYMBOLS = {
        "7": '<div class="symbol"><div class="sym-7">7</div></div>',
        "BAR": '<div class="symbol"><div class="sym-bar">BAR</div></div>',
        "BELL": '<div class="symbol sym-bell">🔔</div>',
        "GRAPE": '<div class="symbol sym-grape">🍇</div>',
        "CHERRY": '<div class="symbol sym-cherry">🍒</div>',
        "REPLAY": '<div class="symbol sym-replay">💎</div>'
    };
    
    // --- ドーパミン Web Audio API (過激化) ---
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx = new AudioContext();

    function playSound(type) {
        if(audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        const now = audioCtx.currentTime;

        if (type === 'SPIN') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(400, now);
            osc.frequency.exponentialRampToValueAtTime(1200, now + 0.2);
            gain.gain.setValueAtTime(0.15, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
            osc.start(now); osc.stop(now + 0.2);
        } else if (type === 'STOP') {
            osc.type = 'square';
            osc.frequency.setValueAtTime(80, now);
            osc.frequency.exponentialRampToValueAtTime(20, now + 0.1);
            gain.gain.setValueAtTime(0.6, now);
            gain.gain.linearRampToValueAtTime(0.01, now + 0.1);
            osc.start(now); osc.stop(now + 0.1);
        } else if (type === 'PEKA') { 
            // 脳を焼くキュイン音
            osc.type = 'square';
            osc.frequency.setValueAtTime(800, now);
            osc.frequency.linearRampToValueAtTime(3000, now + 0.3);
            
            const lfo = audioCtx.createOscillator();
            lfo.type = 'sine'; lfo.frequency.value = 20; // 激しいビブラート
            const lfoGain = audioCtx.createGain();
            lfoGain.gain.value = 1000;
            lfo.connect(lfoGain); lfoGain.connect(osc.frequency);
            lfo.start(now); lfo.stop(now + 1.5);

            gain.gain.setValueAtTime(0, now);
            gain.gain.linearRampToValueAtTime(0.4, now + 0.05);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 1.5);
            osc.start(now); osc.stop(now + 1.5);
        } else if (type === 'COIN') {
            // 超高速払い出し音
            osc.type = 'sine';
            osc.frequency.setValueAtTime(1500 + Math.random()*500, now);
            gain.gain.setValueAtTime(0.2, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
            osc.start(now); osc.stop(now + 0.05);
        }
    }

    // --- ロジック ---
    let myWalletsData = [];
    let reelEls = [document.getElementById('reel-0'), document.getElementById('reel-1'), document.getElementById('reel-2')];
    let rPos = [0, 0, 0];
    let rState = [0, 0, 0]; // 0:止, 1:回転中, 2:停止中
    let symbolHeight = 0;
    let reqAnim;
    
    let isSpinning = false;
    let stoppedCount = 0;
    let serverRes = null;

    init();

    async function init() {
        await loadWallets();
        setupReels(true);
        requestAnimationFrame(animate);
        
        document.getElementById("btn-start").addEventListener("click", () => {
            if(audioCtx.state === 'suspended') audioCtx.resume();
            startSpin();
        });
        document.getElementById("btn-stop-0").addEventListener("click", () => stopReel(0));
        document.getElementById("btn-stop-1").addEventListener("click", () => stopReel(1));
        document.getElementById("btn-stop-2").addEventListener("click", () => stopReel(2));
        
        document.getElementById("wallet-select").addEventListener("change", (e) => {
            const w = myWalletsData.find(w => w.wallet_id === e.target.value);
            if(w) updateCredit(w.balance);
        });

        // リサイズ時に図柄の高さを再計算
        window.addEventListener('resize', () => { setupReels(true); });
    }

    async function loadWallets() {
        try {
            const res = await fetch("/api/wallets", { headers: { "Authorization": `Bearer ${token}` } });
            myWalletsData = await res.json();
            const select = document.getElementById("wallet-select");
            const cur = select.value;
            select.innerHTML = myWalletsData.map(w => `<option value="${w.wallet_id}">${w.wallet_name}</option>`).join('');
            if (cur && myWalletsData.some(w => w.wallet_id === cur)) select.value = cur;
            const w = myWalletsData.find(w => w.wallet_id === select.value);
            if(w) updateCredit(w.balance);
        } catch (e) {}
    }

    function updateCredit(val) { document.getElementById("credit-display").innerText = val; }
    function updateWin(val) { document.getElementById("payout-display").innerText = val; }

    function fireDopamine(type) {
        if(type === "PEKA") {
            playSound("PEKA");
            document.body.classList.add("mega-flash");
            setTimeout(() => document.body.classList.remove("mega-flash"), 300);
            document.getElementById("gogo-lamp").classList.add("peka");
        } else if (type === "BIG") {
            document.getElementById("cabinet").classList.add("shake-hard");
            const mq = document.getElementById("marquee");
            mq.innerText = "!!! JACKPOT !!!";
            mq.classList.add("rgb-mode");
            setTimeout(() => {
                document.getElementById("cabinet").classList.remove("shake-hard");
            }, 2000);
        } else if (type === "REG") {
            document.getElementById("marquee").innerText = "BONUS WIN!";
        }
    }

    function resetUI() {
        document.getElementById("gogo-lamp").classList.remove("peka");
        const mq = document.getElementById("marquee");
        mq.innerText = "MURAOKA CHANCE";
        mq.classList.remove("rgb-mode");
        updateWin(0);
    }

    function setupReels(isInit = false, resSyms = ["7","7","7"]) {
        symbolHeight = reelEls[0].offsetHeight / 3;
        for(let i=0; i<3; i++) {
            let html = "";
            const totalSyms = 32;
            for(let j=0; j<totalSyms; j++) {
                const pool = ["7", "BAR", "BELL", "GRAPE", "CHERRY", "REPLAY"];
                html += SYMBOLS[pool[Math.floor(Math.random() * pool.length)]];
            }
            // ターゲット（下から3番目）
            if(!isInit && serverRes) html += SYMBOLS[resSyms[i]];
            else html += SYMBOLS["7"];
            // パディング2個
            html += SYMBOLS["GRAPE"];
            html += SYMBOLS["REPLAY"];
            
            reelEls[i].innerHTML = html;
            rPos[i] = 0;
            reelEls[i].style.transform = `translateY(0px)`;
        }
    }

    function animate() {
        const speed = symbolHeight * 0.8; // 超高速
        const maxScroll = -(32 * symbolHeight);
        
        for(let i=0; i<3; i++) {
            if(rState[i] === 1) {
                rPos[i] -= speed;
                if(rPos[i] <= maxScroll) rPos[i] += Math.abs(maxScroll);
                reelEls[i].style.transform = `translateY(${rPos[i]}px)`;
            } else if (rState[i] === 2) {
                // 中央揃え (ターゲットはインデックス32。 32 * H - H)
                rPos[i] = -(32 * symbolHeight) + symbolHeight;
                reelEls[i].style.transform = `translateY(${rPos[i]}px)`;
                reelEls[i].classList.remove("spin-blur");
                rState[i] = 0;
                playSound("STOP");
            }
        }
        reqAnim = requestAnimationFrame(animate);
    }

    async function startSpin() {
        if (isSpinning) return;
        const wid = document.getElementById("wallet-select").value;
        const bet = parseInt(document.getElementById("bet-amount").value, 10);
        
        if(!wid || isNaN(bet) || bet < 1) return;

        isSpinning = true;
        stoppedCount = 0;
        serverRes = null;
        resetUI();
        playSound("SPIN");
        
        document.getElementById("btn-start").disabled = true;
        
        try {
            const res = await fetch("/api/slot/spin", {
                method: "POST",
                headers: { "Content-Type": "application/json", "Authorization": `Bearer ${token}` },
                body: JSON.stringify({ wallet_id: wid, bet_amount: bet })
            });
            if (!res.ok) throw new Error();
            
            serverRes = await res.json();
            
            const w = myWalletsData.find(w => w.wallet_id === wid);
            if(w) { w.balance = serverRes.new_balance - serverRes.payout; updateCredit(w.balance); }

            setupReels(false, serverRes.result_symbols);

            for (let i = 0; i < 3; i++) {
                document.getElementById(`btn-stop-${i}`).disabled = false;
                reelEls[i].classList.add("spin-blur");
                rState[i] = 1;
            }

            if (serverRes.is_early_pekari) fireDopamine("PEKA");

        } catch (e) {
            isSpinning = false; document.getElementById("btn-start").disabled = false;
        }
    }

    function stopReel(idx) {
        if (rState[idx] !== 1) return;
        document.getElementById(`btn-stop-${idx}`).disabled = true;
        rState[idx] = 2; 
        stoppedCount++;
        
        if (stoppedCount === 3) {
            setTimeout(finishGame, 150);
        }
    }

    async function finishGame() {
        isSpinning = false;
        document.getElementById("btn-start").disabled = false;
        
        if (serverRes.is_pekari && !serverRes.is_early_pekari) fireDopamine("PEKA");

        if (serverRes.prize === "BIG") fireDopamine("BIG");
        else if (serverRes.prize === "REG") fireDopamine("REG");

        // 超高速脳汁払い出し演出
        if (serverRes.payout > 0) {
            let cur = 0;
            const tgt = serverRes.payout;
            const step = Math.ceil(tgt / 30); // 30フレームで爆速カウント
            
            const countTimer = setInterval(() => {
                cur += step;
                if(cur >= tgt) {
                    cur = tgt;
                    clearInterval(countTimer);
                    const w = myWalletsData.find(w => w.wallet_id === document.getElementById("wallet-select").value);
                    if(w) { w.balance = serverRes.new_balance; updateCredit(w.balance); }
                }
                updateWin(cur);
                const pEl = document.getElementById("payout-display");
                pEl.classList.remove("num-pop");
                void pEl.offsetWidth;
                pEl.classList.add("num-pop");
                playSound("COIN");
            }, 30);
        }
        loadWallets();
    }
</script>
</body>
</html>
