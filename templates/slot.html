<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>村岡王国 - IMPERIAL JUGGLER VIP</title>
    <style>
        /* ==========================================================================
           HYPER DOPAMINE UI FONTS
           ========================================================================== */
        @import url('https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=M+PLUS+1p:wght@400;700;900&family=Playfair+Display:ital,wght@1,900&family=Righteous&family=Share+Tech+Mono&display=swap');

        /* ==========================================================================
           OVERDOSE VARIABLES
           ========================================================================== */
        :root {
            --vip-bg: #050010;
            --vip-panel: rgba(10, 5, 20, 0.95);
            --gold-light: #ffff00;
            --gold-base: #ff007f;
            --gold-dark: #cc00ff;
            --neon-magenta: #ff0055;
            --neon-cyan: #00ffff;
            --alert-red: #ff0000;
            --gold-gradient: linear-gradient(135deg, #ff00ff 0%, #00ffff 25%, #ffff00 50%, #ff00ff 75%, #00ffff 100%);
            --glass-border: #00ffff;
            --sym-h: 100px; 
        }

        /* ==========================================================================
           RESET & BASE
           ========================================================================== */
        * { box-sizing: border-box; touch-action: manipulation; }
        
        body { 
            font-family: 'M PLUS 1p', sans-serif; 
            margin: 0; 
            min-height: 100vh;
            user-select: none;
            overflow: hidden;
            background: linear-gradient(45deg, #110022, #001133, #220011, #002211);
            background-size: 400% 400%;
            animation: bg-rush 4s infinite linear;
            color: #fff; 
            display: flex; 
            justify-content: center; 
            align-items: center;
            position: relative;
        }

        body.jackpot-mode {
            animation: hyper-jackpot 0.2s infinite alternate linear;
        }

        /* ==========================================================================
           CABINET (HYPER NEON CASING)
           ========================================================================== */
        .arcade-cabinet {
            width: 100%;
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: max(env(safe-area-inset-top), 15px) 15px max(env(safe-area-inset-bottom), 15px) 15px;
            max-width: 600px;
            position: relative;
            z-index: 10;
        }

        @media (min-width: 768px) {
            .arcade-cabinet {
                max-width: 800px;
                height: 94vh;
                background: linear-gradient(to bottom, #1a0025 0%, #0d0014 100%);
                border-radius: 20px;
                padding: 30px 40px;
                gap: 20px;
                border: 2px solid var(--neon-cyan);
                box-shadow: 
                    0 0 50px rgba(0, 255, 255, 0.4),
                    inset 0 0 30px rgba(255, 0, 255, 0.4);
            }
        }

        /* ==========================================================================
           MARQUEE (OVERDRIVE HEADER)
           ========================================================================== */
        .marquee {
            text-align: center;
            font-family: 'Righteous', cursive;
            font-size: clamp(2rem, 6vw, 3.5rem);
            font-weight: 900;
            color: #fff;
            background: linear-gradient(90deg, #ff00ff, #00ffff, #ffff00, #ff00ff);
            background-size: 300% 100%;
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            padding: 15px 10px;
            letter-spacing: 4px;
            text-shadow: 0 0 20px rgba(255, 0, 255, 0.8);
            position: relative;
            animation: marquee-rush 1.5s infinite linear;
        }

        .marquee.active {
            text-shadow: 0 0 30px #00ffff, 0 0 10px #fff;
            transform: scale(1.05);
            animation: marquee-rush 0.8s infinite linear;
        }

        .marquee.jackpot {
            background: linear-gradient(90deg, #ff0000, #00ff00, #0000ff, #ff0000);
            background-size: 300% 100%;
            background-clip: text;
            -webkit-background-clip: text;
            text-shadow: 0 0 40px #ff00ff, 0 0 20px #fff;
            animation: marquee-rush 0.3s infinite linear, text-shake 0.1s infinite;
            letter-spacing: 6px;
            transform: scale(1.1);
        }

        /* ==========================================================================
           HUD PANEL (NEON BORDERS)
           ========================================================================== */
        .hud-panel {
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: var(--vip-panel);
            border: 2px solid var(--neon-magenta);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 0 20px rgba(255, 0, 85, 0.5), inset 0 0 15px rgba(255, 0, 85, 0.3);
        }
        
        .inputs-row { display: flex; gap: 15px; }
        .input-group { flex: 1; display: flex; flex-direction: column; }
        .input-group label { 
            font-family: 'Share Tech Mono', monospace; font-size: 0.9rem; color: var(--neon-cyan); 
            font-weight: 900; letter-spacing: 2px; margin-bottom: 6px; text-shadow: 0 0 5px var(--neon-cyan);
        }
        .input-group select, .input-group input { 
            width: 100%; padding: 12px; 
            background: rgba(0,0,0,0.8);
            border: 2px solid var(--neon-cyan); 
            border-radius: 6px;
            color: #fff; 
            font-family: 'Share Tech Mono', monospace; font-size: 1.2rem; font-weight: bold;
            outline: none;
            transition: all 0.1s;
        }
        .input-group select:focus, .input-group input:focus { 
            border-color: var(--gold-light);
            box-shadow: 0 0 20px var(--gold-light); 
            background: #111;
        }
        
        .meters-row { display: flex; gap: 15px; margin-top: 10px; }
        .meter {
            flex: 1; 
            background: #000; 
            border: 2px solid var(--gold-dark);
            border-radius: 8px;
            padding: 12px 15px; text-align: right; position: relative;
            box-shadow: inset 0 0 15px rgba(204, 0, 255, 0.5);
        }
        .meter-label { 
            position: absolute; left: 12px; top: 12px; font-family: 'Share Tech Mono', monospace;
            font-size: 0.85rem; color: #fff; font-weight: 900; letter-spacing: 1px;
            text-shadow: 0 0 5px var(--gold-dark);
        }
        .meter-val { 
            font-family: 'Share Tech Mono', monospace; font-size: clamp(1.4rem, 4vw, 2.2rem); font-weight: 900;
            color: #fff; 
            line-height: 1; margin-top: 20px; 
            text-shadow: 0 0 10px #fff, 0 0 20px var(--neon-cyan);
        }
        .meter-val.green { 
            color: var(--gold-light); 
            text-shadow: 0 0 15px var(--gold-light), 0 0 30px #ffaa00; 
        }

        /* ==========================================================================
           STAGE AREA & GOGO LAMP
           ========================================================================== */
        .stage-area {
            flex: 1; display: flex; align-items: center; justify-content: space-between;
            background: radial-gradient(circle at center, #220033 0%, #000 100%);
            border: 3px solid #ff00ff;
            border-radius: 12px;
            padding: 20px 15px;
            box-shadow: inset 0 0 40px rgba(255, 0, 255, 0.5), 0 0 20px rgba(255, 0, 255, 0.4);
            position: relative; min-height: 240px;
        }

        @media (min-width: 768px) { .stage-area { min-height: 350px; padding: 40px 30px; } }

        .gogo-lamp {
            width: 24%; aspect-ratio: 1;
            background: #111;
            border-radius: 50%;
            border: 4px solid #333;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            font-family: 'Righteous', cursive;
            font-size: clamp(0.9rem, 2.5vw, 1.5rem);
            color: #222; line-height: 1.1;
            box-shadow: inset 0 0 20px #000;
            position: relative; z-index: 20;
            transition: none; /* 即座に反応させるためトランジション削除 */
        }
        .gogo-lamp span { font-size: clamp(1.2rem, 3.5vw, 2.2rem); margin-top: -2px; color: #222; }
        
        /* HYPER PEKA STATE */
        .gogo-lamp.peka {
            animation: hyper-peka 0.1s infinite alternate;
            border-color: #fff;
        }
        .gogo-lamp.peka span { color: #fff; text-shadow: 0 0 10px #fff; }

        /* ==========================================================================
           REELS
           ========================================================================== */
        .reels-wrapper {
            width: 72%; display: flex; gap: 10px;
            background: #000; padding: 10px;
            border-radius: 8px;
            border: 3px solid var(--neon-cyan);
            position: relative;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.5);
        }
        /* ギラつく有効ライン */
        .reels-wrapper::after {
            content: ""; position: absolute; top: 50%; left: -2%; right: -2%; height: 4px;
            background: #fff;
            box-shadow: 0 0 15px var(--neon-cyan), 0 0 30px var(--neon-cyan);
            transform: translateY(-50%); z-index: 30; pointer-events: none;
            mix-blend-mode: screen;
        }
        
        .reel-window {
            flex: 1; aspect-ratio: 1 / 2.4;
            background: #fff; 
            border-radius: 4px;
            overflow: hidden; position: relative;
            box-shadow: inset 0 20px 20px -10px rgba(0,0,0,0.8), inset 0 -20px 20px -10px rgba(0,0,0,0.8);
        }
        .reel-window.bounce { animation: reel-hyper-bounce 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275); }

        .reel-strip {
            position: absolute; top: 0; left: 0; width: 100%;
            display: flex; flex-direction: column; will-change: transform;
        }
        .symbol {
            width: 100%; height: var(--sym-h); 
            display: flex; align-items: center; justify-content: center;
            font-size: clamp(3rem, 9vw, 5rem); font-weight: 900;
            background: transparent; font-family: 'Righteous', cursive;
            position: relative; z-index: 1;
        }
        
        .sym-7 { color: var(--alert-red); text-shadow: 3px 3px 0px #000, 0 0 15px #ff0000; transform: scale(1.15); }
        .sym-bar { 
            color: #fff; background: #000; 
            border: 4px solid #fff; border-radius: 4px;
            width: 85%; height: 45%; font-size: 0.35em; 
            display: flex; align-items: center; justify-content: center; 
            letter-spacing: 4px; box-shadow: 0 0 10px #fff;
        }
        
        /* 高速スピン時の錯覚効果（不透明度のみで軽量） */
        .spin-blur { opacity: 0.8; filter: brightness(1.2); } 

        /* ==========================================================================
           CONTROLS (SMASH BUTTONS)
           ========================================================================== */
        .controls-area { display: flex; flex-direction: column; gap: 15px; margin-top: 10px; }
        .stop-buttons { display: flex; justify-content: flex-end; width: 100%; gap: 12px; padding-left: 28%; }
        
        .btn-stop {
            flex: 1; aspect-ratio: 1.4;
            background: #ff0000;
            border: 2px solid #ffaaaa; border-radius: 8px;
            box-shadow: 0 8px 0 #880000, 0 15px 20px rgba(255,0,0,0.6);
            color: #fff; font-family: 'Share Tech Mono', monospace;
            font-size: clamp(1.5rem, 5vw, 2.2rem); font-weight: 900;
            cursor: pointer; transition: transform 0.05s, box-shadow 0.05s; 
        }
        .btn-stop:active:not(:disabled) {
            transform: translateY(8px); 
            box-shadow: 0 0 0 #880000, 0 0 30px #ff0000;
            background: #ff3333;
        }
        .btn-stop:disabled { 
            background: #333; border-color: #555; color: #777;
            box-shadow: 0 8px 0 #111; cursor: not-allowed; 
        }

        .btn-start {
            width: 100%; padding: 20px 0;
            background: var(--gold-gradient);
            background-size: 300% 100%;
            border: 2px solid #fff; border-radius: 12px;
            color: #000; font-size: clamp(1.8rem, 6vw, 2.5rem); font-weight: 900; 
            font-family: 'Righteous', cursive;
            letter-spacing: 8px;
            text-shadow: 0 2px 0 #fff;
            box-shadow: 0 10px 0 #aa00aa, 0 0 40px rgba(255, 0, 255, 0.8);
            cursor: pointer; transition: transform 0.05s, box-shadow 0.05s;
            animation: marquee-rush 2s infinite linear;
        }
        .btn-start:active:not(:disabled) {
            transform: translateY(10px); 
            box-shadow: 0 0 0 #aa00aa, 0 0 50px #ffff00;
        }
        .btn-start:disabled { 
            background: #222; color: #555; border-color: #444; text-shadow: none;
            box-shadow: 0 10px 0 #000; cursor: not-allowed; animation: none;
        }

        /* ==========================================================================
           FOOTER
           ========================================================================== */
        .footer-link { text-align: center; margin-top: 5px; padding-bottom: 10px; }
        .footer-link a { 
            color: var(--neon-cyan); text-decoration: none; font-family: 'Righteous', cursive;
            font-size: 1.2rem; font-weight: 900; letter-spacing: 2px;
        }
        .footer-link a:hover { color: #fff; text-shadow: 0 0 20px var(--neon-cyan); }

        /* ==========================================================================
           HYPER EFFECTS (DOM MINIMAL)
           ========================================================================== */
        #flash-bang {
            position: fixed; top:0; left:0; width:100%; height:100%;
            background: #fff; opacity: 0; pointer-events: none; z-index: 99999; 
            mix-blend-mode: screen;
        }
        body.mega-flash #flash-bang { animation: hyper-flash 0.3s ease-out forwards; }
        
        .num-pop { 
            animation: overdrive-pop 0.15s ease-out; 
            color: #fff !important; 
            text-shadow: 0 0 30px #ffff00, 0 0 10px #ff00ff !important; 
        }

        /* ==========================================================================
           OVERDOSE KEYFRAMES
           ========================================================================== */
        @keyframes bg-rush {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        @keyframes hyper-jackpot {
            0% { background-color: #ff0000; }
            33% { background-color: #00ff00; }
            66% { background-color: #0000ff; }
            100% { background-color: #ff00ff; }
        }
        @keyframes marquee-rush { 
            0% { background-position: 0% 50%; } 
            100% { background-position: 300% 50%; } 
        }
        @keyframes text-shake {
            0% { transform: translate(2px, 2px) scale(1.1); }
            50% { transform: translate(-2px, -2px) scale(1.1); }
            100% { transform: translate(2px, -2px) scale(1.1); }
        }
        @keyframes hyper-peka { 
            0% { background: radial-gradient(circle, #fff, #ff00ff); color: #fff; box-shadow: 0 0 50px #ff00ff, inset 0 0 20px #fff; transform: scale(1); } 
            50% { background: radial-gradient(circle, #fff, #00ffff); color: #fff; box-shadow: 0 0 100px #00ffff, inset 0 0 50px #fff; transform: scale(1.15); } 
            100% { background: radial-gradient(circle, #fff, #ffff00); color: #fff; box-shadow: 0 0 50px #ffff00, inset 0 0 20px #fff; transform: scale(1); } 
        }
        @keyframes reel-hyper-bounce { 
            0% { transform: translateY(0); } 
            40% { transform: translateY(30px); } 
            100% { transform: translateY(0); } 
        }
        @keyframes hyper-flash { 
            0% { opacity: 1; } 
            100% { opacity: 0; } 
        }
        @keyframes overdrive-pop { 
            0% { transform: scale(1) rotate(0deg); } 
            50% { transform: scale(1.5) rotate(5deg); } 
            100% { transform: scale(1) rotate(0deg); } 
        }
    </style>
</head>
<body>

<div id="flash-bang"></div>

<div class="arcade-cabinet" id="cabinet">
    <div class="marquee" id="marquee">INSERT MEDAL</div>

    <div class="hud-panel">
        <div class="inputs-row">
            <div class="input-group">
                <label>ACCOUNT</label>
                <select id="wallet-select"></select>
            </div>
            <div class="input-group">
                <label>BET</label>
                <input type="number" id="bet-amount" min="1" value="3">
            </div>
        </div>
        <div class="meters-row">
            <div class="meter">
                <div class="meter-label">CREDIT</div>
                <div class="meter-val" id="credit-display">---</div>
            </div>
            <div class="meter">
                <div class="meter-label">PAYOUT</div>
                <div class="meter-val green" id="payout-display">0</div>
            </div>
        </div>
    </div>

    <div class="stage-area">
        <div class="gogo-lamp" id="gogo-lamp">GOGO!<br><span>CHANCE</span></div>
        <div class="reels-wrapper">
            <div class="reel-window" id="window-0"><div class="reel-strip" id="reel-0"></div></div>
            <div class="reel-window" id="window-1"><div class="reel-strip" id="reel-1"></div></div>
            <div class="reel-window" id="window-2"><div class="reel-strip" id="reel-2"></div></div>
        </div>
    </div>

    <div class="controls-area">
        <div class="stop-buttons">
            <button class="btn-stop" id="btn-stop-0" disabled>1</button>
            <button class="btn-stop" id="btn-stop-1" disabled>2</button>
            <button class="btn-stop" id="btn-stop-2" disabled>3</button>
        </div>
        <button class="btn-start" id="btn-start">LEVER ON</button>
        <div class="footer-link"><a href="/casino">◀ BACK TO CASINO</a></div>
    </div>
</div>

<script>
    const token = localStorage.getItem("access_token");
    if (!token) window.location.href = "/";

    const SYMBOLS = {
        "7": '<div class="symbol"><div class="sym-7">7</div></div>',
        "BAR": '<div class="symbol"><div class="sym-bar">BAR</div></div>',
        "BELL": '<div class="symbol"><span class="sym-bell">🔔</span></div>',
        "GRAPE": '<div class="symbol"><span class="sym-grape">🍇</span></div>',
        "CHERRY": '<div class="symbol"><span class="sym-cherry">🍒</span></div>',
        "REPLAY": '<div class="symbol"><span class="sym-replay">💎</span></div>'
    };

    const getSymbolHtml = (key) => SYMBOLS[key] || SYMBOLS["7"];

    const FIXED_STRIP_PATTERN = [
        "7", "CHERRY", "GRAPE", "BELL", "BAR", "REPLAY", 
        "GRAPE", "BAR", "CHERRY", "BELL", "7", "REPLAY",
        "GRAPE", "BELL", "7", "REPLAY", "BAR", "GRAPE"
    ];
    const TOTAL_SPIN_SYMS = 32; 
    
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx = new AudioContext();

    function playSound(type) {
        if(audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        const now = audioCtx.currentTime;

        if (type === 'SPIN') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(400, now);
            osc.frequency.exponentialRampToValueAtTime(900, now + 0.3);
            gain.gain.setValueAtTime(0.15, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
            osc.start(now); osc.stop(now + 0.3);
        } else if (type === 'STOP') {
            osc.type = 'square';
            osc.frequency.setValueAtTime(150, now);
            osc.frequency.exponentialRampToValueAtTime(30, now + 0.1);
            gain.gain.setValueAtTime(1, now);
            gain.gain.linearRampToValueAtTime(0.01, now + 0.1);
            osc.start(now); osc.stop(now + 0.1);
        } else if (type === 'PEKA') { 
            osc.type = 'square';
            osc.frequency.setValueAtTime(1500, now);
            osc.frequency.linearRampToValueAtTime(4500, now + 0.1);
            
            const lfo = audioCtx.createOscillator();
            lfo.type = 'sine'; lfo.frequency.value = 35;
            const lfoGain = audioCtx.createGain();
            lfoGain.gain.value = 1200;
            lfo.connect(lfoGain); lfoGain.connect(osc.frequency);
            lfo.start(now); lfo.stop(now + 1.5);

            gain.gain.setValueAtTime(0, now);
            gain.gain.linearRampToValueAtTime(0.5, now + 0.05);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 1.5);
            osc.start(now); osc.stop(now + 1.5);
        } else if (type === 'COIN') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(2500 + Math.random()*500, now);
            gain.gain.setValueAtTime(0.3, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
            osc.start(now); osc.stop(now + 0.08);
        }
    }

    let myWalletsData = [];
    let reelEls = [document.getElementById('reel-0'), document.getElementById('reel-1'), document.getElementById('reel-2')];
    let winEls = [document.getElementById('window-0'), document.getElementById('window-1'), document.getElementById('window-2')];
    let rPos = [0, 0, 0];
    let rState = [0, 0, 0];
    let symbolHeight = 0;
    let reqAnim;
    
    let isSpinning = false;
    let stoppedCount = 0;
    let serverRes = null;

    init();

    async function init() {
        await loadWallets();
        setupReels(true);
        requestAnimationFrame(animate);
        
        document.getElementById("btn-start").addEventListener("click", () => {
            if(audioCtx.state === 'suspended') audioCtx.resume();
            startSpin();
        });
        document.getElementById("btn-stop-0").addEventListener("click", () => stopReel(0));
        document.getElementById("btn-stop-1").addEventListener("click", () => stopReel(1));
        document.getElementById("btn-stop-2").addEventListener("click", () => stopReel(2));
        
        document.getElementById("wallet-select").addEventListener("change", (e) => {
            const w = myWalletsData.find(w => w.wallet_id === e.target.value);
            if(w) updateCredit(w.balance);
        });

        window.addEventListener('resize', () => { setupReels(true); });
    }

    async function loadWallets() {
        try {
            const res = await fetch("/api/wallets", { headers: { "Authorization": `Bearer ${token}` } });
            myWalletsData = await res.json();
            const select = document.getElementById("wallet-select");
            const cur = select.value;
            select.innerHTML = myWalletsData.map(w => `<option value="${w.wallet_id}">${w.wallet_name}</option>`).join('');
            if (cur && myWalletsData.some(w => w.wallet_id === cur)) select.value = cur;
            const w = myWalletsData.find(w => w.wallet_id === select.value);
            if(w) updateCredit(w.balance);
        } catch (e) {}
    }

    function updateCredit(val) { document.getElementById("credit-display").innerText = val; }
    function updateWin(val) { document.getElementById("payout-display").innerText = val; }

    function fireFeedback(type) {
        const mq = document.getElementById("marquee");
        if(type === "PEKA") {
            playSound("PEKA");
            document.body.classList.remove("mega-flash");
            void document.body.offsetWidth;
            document.body.classList.add("mega-flash");
            document.getElementById("gogo-lamp").classList.add("peka");
        } else if (type === "BIG") {
            document.body.classList.add("jackpot-mode");
            mq.innerText = "SUPER JACKPOT";
            mq.classList.add("jackpot");
        } else if (type === "REG") {
            mq.innerText = "REGULAR BONUS";
            mq.classList.add("active");
        }
    }

    function resetUI() {
        document.getElementById("gogo-lamp").classList.remove("peka");
        document.body.classList.remove("jackpot-mode", "mega-flash");
        const mq = document.getElementById("marquee");
        mq.innerText = "GOOD LUCK";
        mq.className = "marquee";
        updateWin(0);
        winEls.forEach(el => el.classList.remove("bounce"));
    }

    function setupReels(isInit = false, resSyms = ["7","7","7"]) {
        const windowHeight = winEls[0].offsetHeight;
        symbolHeight = windowHeight / 3;
        
        document.documentElement.style.setProperty('--sym-h', `${symbolHeight}px`);
        
        for(let i=0; i<3; i++) {
            let html = "";
            for(let j=0; j<TOTAL_SPIN_SYMS; j++) {
                html += getSymbolHtml(FIXED_STRIP_PATTERN[j % FIXED_STRIP_PATTERN.length]);
            }
            if(!isInit && serverRes) html += getSymbolHtml(resSyms[i]);
            else html += getSymbolHtml("7");
            
            html += getSymbolHtml("GRAPE");
            html += getSymbolHtml("REPLAY");
            
            reelEls[i].innerHTML = html;
            rPos[i] = 0;
            reelEls[i].style.transform = `translateY(0px)`;
        }
    }

    function animate() {
        const speed = symbolHeight * 0.9; 
        const maxScroll = -(TOTAL_SPIN_SYMS * symbolHeight);
        
        for(let i=0; i<3; i++) {
            if(rState[i] === 1) {
                rPos[i] -= speed;
                if(rPos[i] <= maxScroll) rPos[i] += Math.abs(maxScroll);
                reelEls[i].style.transform = `translateY(${rPos[i]}px)`;
            } else if (rState[i] === 2) {
                rPos[i] = -(TOTAL_SPIN_SYMS * symbolHeight) + symbolHeight;
                reelEls[i].style.transform = `translateY(${rPos[i]}px)`;
                reelEls[i].classList.remove("spin-blur");
                
                winEls[i].classList.remove("bounce");
                void winEls[i].offsetWidth;
                winEls[i].classList.add("bounce");

                rState[i] = 0;
                playSound("STOP");
            }
        }
        reqAnim = requestAnimationFrame(animate);
    }

    async function startSpin() {
        if (isSpinning) return;
        const wid = document.getElementById("wallet-select").value;
        const bet = parseInt(document.getElementById("bet-amount").value, 10);
        
        if(!wid || isNaN(bet) || bet < 1) {
            alert("口座またはベット額が正しくありません。");
            return;
        }

        isSpinning = true;
        stoppedCount = 0;
        serverRes = null;
        resetUI();
        playSound("SPIN");
        
        document.getElementById("btn-start").disabled = true;
        
        try {
            const res = await fetch("/api/slot/spin", {
                method: "POST",
                headers: { "Content-Type": "application/json", "Authorization": `Bearer ${token}` },
                body: JSON.stringify({ wallet_id: wid, bet_amount: bet })
            });
            
            const data = await res.json();
            if (!res.ok) throw new Error(data.detail || "通信エラー");
            serverRes = data;
            
            const w = myWalletsData.find(w => w.wallet_id === wid);
            if(w) { w.balance = serverRes.new_balance - serverRes.payout; updateCredit(w.balance); }

            setupReels(false, serverRes.result_symbols);

            for (let i = 0; i < 3; i++) {
                document.getElementById(`btn-stop-${i}`).disabled = false;
                reelEls[i].classList.add("spin-blur");
                rState[i] = 1;
            }

            if (serverRes.is_early_pekari) fireFeedback("PEKA");

        } catch (e) {
            alert(e.message);
            isSpinning = false; document.getElementById("btn-start").disabled = false;
        }
    }

    function stopReel(idx) {
        if (rState[idx] !== 1) return;
        document.getElementById(`btn-stop-${idx}`).disabled = true;
        rState[idx] = 2; 
        stoppedCount++;
        
        if (stoppedCount === 3) setTimeout(finishGame, 200);
    }

    async function finishGame() {
        isSpinning = false;
        document.getElementById("btn-start").disabled = false;
        document.getElementById("marquee").innerText = "INSERT MEDAL";
        
        if (serverRes.is_pekari && !serverRes.is_early_pekari) fireFeedback("PEKA");

        if (serverRes.prize === "BIG") fireFeedback("BIG");
        else if (serverRes.prize === "REG") fireFeedback("REG");
        else if (serverRes.payout > 0) document.getElementById("marquee").innerText = "WINNER";

        if (serverRes.payout > 0) {
            let cur = 0;
            const tgt = serverRes.payout;
            const step = Math.ceil(tgt / 40); 
            
            const countTimer = setInterval(() => {
                cur += step;
                if(cur >= tgt) {
                    cur = tgt;
                    clearInterval(countTimer);
                    const w = myWalletsData.find(w => w.wallet_id === document.getElementById("wallet-select").value);
                    if(w) { w.balance = serverRes.new_balance; updateCredit(w.balance); }
                }
                updateWin(cur);
                const pEl = document.getElementById("payout-display");
                pEl.classList.remove("num-pop");
                void pEl.offsetWidth; 
                pEl.classList.add("num-pop");
                playSound("COIN");
            }, 16); 
        }
        loadWallets();
    }
</script>
</body>
</html>
