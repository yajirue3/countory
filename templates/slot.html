<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>村岡王国 - IMPERIAL JUGGLER</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Black+Ops+One&family=M+PLUS+1p:wght@900&family=Share+Tech+Mono&display=swap');

        :root {
            --neon-magenta: #ff007f;
            --neon-cyan: #00f3ff;
            --neon-green: #00ff66;
            --neon-yellow: #ffe600;
            --alert-red: #ff0000;
        }

        * { box-sizing: border-box; touch-action: manipulation; }
        
        body { 
            font-family: 'M PLUS 1p', 'Black Ops One', sans-serif; 
            background: #000;
            color: #fff; 
            display: flex; 
            justify-content: center; 
            align-items: center;
            margin: 0; 
            min-height: 100vh;
            user-select: none;
            overflow: hidden;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            transition: background-color 0.5s;
        }

        body.jackpot-mode {
            background-color: #2a1b00;
            animation: gold-pulse 1s infinite alternate;
        }

        /* 📱 スマホ・ベースレイアウト（画面いっぱいに最適化） */
        .arcade-cabinet {
            width: 100%;
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: max(env(safe-area-inset-top), 10px) 12px max(env(safe-area-inset-bottom), 10px) 12px;
            max-width: 500px;
        }

        /* 💻 パソコン向け（サイズを大きく迫力のある筐体に刷新） */
        @media (min-width: 768px) {
            .arcade-cabinet {
                max-width: 680px;
                height: auto;
                aspect-ratio: 10/16;
                background: linear-gradient(180deg, #161616 0%, #050505 100%);
                border: 6px solid #444;
                border-radius: 20px;
                box-shadow: 0 0 80px rgba(0, 0, 0, 0.9), inset 0 0 20px rgba(255,255,255,0.1);
                padding: 24px;
                gap: 16px;
            }
        }

        /* 👑 メインパネル */
        .marquee {
            text-align: center;
            font-family: 'Black Ops One', sans-serif;
            font-size: clamp(1.5rem, 5vw, 2.4rem);
            color: #555;
            background: #050505;
            border: 2px solid #333;
            border-radius: 8px;
            padding: 12px;
            letter-spacing: 4px;
            transition: all 0.2s;
        }
        .marquee.active {
            color: var(--neon-cyan);
            border-color: var(--neon-cyan);
            text-shadow: 0 0 15px var(--neon-cyan);
            box-shadow: inset 0 0 15px rgba(0, 243, 255, 0.2);
        }
        .marquee.jackpot {
            color: #fff;
            border-color: var(--neon-yellow);
            background: linear-gradient(90deg, #330000 0%, #660000 50%, #330000 100%);
            text-shadow: 0 0 20px var(--neon-yellow), 0 0 40px #ff0000;
            box-shadow: 0 0 30px #ff0000;
            animation: text-flicker 0.1s infinite;
        }

        /* 🎛️ HUD */
        .hud-panel {
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: #0a0a0a;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 12px;
        }
        .inputs-row { display: flex; gap: 12px; }
        .input-group { flex: 1; display: flex; flex-direction: column; }
        .input-group label { font-size: 0.7rem; color: #888; font-weight: 900; letter-spacing: 1px; margin-bottom: 4px; }
        .input-group select, .input-group input { 
            width: 100%; padding: 10px; background: #000; border: 1px solid #555; 
            color: #fff; font-size: 1.1rem; font-weight: 900; outline: none; border-radius: 6px;
            box-shadow: inset 0 2px 5px rgba(0,0,0,1);
        }
        .input-group select:focus, .input-group input:focus { border-color: var(--neon-cyan); }
        
        .meters-row { display: flex; gap: 12px; margin-top: 4px; }
        .meter {
            flex: 1; background: #050505; border: 2px solid #222; border-radius: 6px;
            padding: 8px 12px; text-align: right; position: relative;
        }
        .meter-label { position: absolute; left: 10px; top: 12px; font-size: 0.65rem; color: #777; font-weight: 900; letter-spacing: 1px; }
        .meter-val { 
            font-family: 'Share Tech Mono', monospace; font-size: clamp(1.5rem, 5vw, 2.2rem); 
            color: var(--neon-red); text-shadow: 0 0 10px var(--neon-red); line-height: 1;
        }
        .meter-val.green { color: var(--neon-green); text-shadow: 0 0 15px var(--neon-green); }

        /* 🎰 メインステージ（リールとランプのバランス最適化） */
        .stage-area {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #111;
            border: 2px solid #333;
            border-radius: 10px;
            padding: 15px 12px;
            box-shadow: inset 0 20px 30px rgba(0,0,0,1);
            position: relative;
            min-height: 180px;
        }

        /* 🚨 GOGOランプ */
        .gogo-lamp {
            width: 24%;
            aspect-ratio: 1;
            background: #050505;
            border-radius: 50%;
            border: 4px solid #1a1a1a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Black Ops One', sans-serif;
            font-size: clamp(0.7rem, 2.5vw, 1rem);
            color: #222;
            line-height: 1.1;
            box-shadow: inset 0 0 20px #000;
            transition: all 0.1s;
            position: relative;
        }
        .gogo-lamp span { font-size: clamp(0.9rem, 3.5vw, 1.4rem); color: #222; margin-top: -2px; }
        .gogo-lamp.peka {
            background: #fff;
            color: var(--neon-magenta);
            border-color: #fff;
            box-shadow: 0 0 40px #fff, 0 0 80px var(--neon-magenta), inset 0 0 20px #fff;
            text-shadow: 0 0 10px var(--neon-magenta);
            animation: strobe-flash 0.08s infinite alternate;
        }
        .gogo-lamp.peka span { color: var(--neon-magenta); text-shadow: 0 0 10px var(--neon-magenta); }

        /* リールコンテナ（隙間・空白の完全排除） */
        .reels-wrapper {
            width: 72%;
            display: flex;
            gap: 6px;
            background: #000;
            padding: 6px;
            border: 3px solid #555;
            border-top-color: #222;
            border-bottom-color: #777;
            border-radius: 8px;
            position: relative;
        }
        .reels-wrapper::after {
            content: ""; position: absolute;
            top: 50%; left: 0; right: 0; height: 3px;
            background: rgba(255,0,0,0.6);
            box-shadow: 0 0 12px red;
            transform: translateY(-50%);
            z-index: 10; pointer-events: none;
        }
        .reel-window {
            flex: 1;
            aspect-ratio: 1 / 2.4;
            background: #ffffff;
            overflow: hidden;
            position: relative;
            border-radius: 4px;
            box-shadow: inset 0 35px 20px -15px rgba(0,0,0,0.85), inset 0 -35px 20px -15px rgba(0,0,0,0.85);
            transform: translateY(0);
        }
        .reel-window.bounce { animation: reel-stop-bounce 0.15s cubic-bezier(0.25, 1, 0.5, 1); }

        .reel-strip {
            position: absolute; top: 0; left: 0; width: 100%;
            display: flex; flex-direction: column; will-change: transform;
        }
        .symbol {
            width: 100%; height: 33.333%;
            display: flex; align-items: center; justify-content: center;
            font-size: clamp(2.2rem, 8vw, 3.5rem); font-weight: 900;
            border-bottom: 1px solid rgba(0,0,0,0.08);
            background: #ffffff;
        }
        
        .sym-7 { color: #e60000; text-shadow: 2px 2px 0 #222, -1px -1px 0 #fff; }
        .sym-bar { 
            color: #fff; background: linear-gradient(180deg, #333 0%, #111 100%); border: 3px solid #777; 
            width: 88%; height: 55%; font-size: 0.45em; 
            display: flex; align-items: center; justify-content: center; 
            border-radius: 4px; box-shadow: 0 4px 6px rgba(0,0,0,0.5); 
            letter-spacing: 2px;
        }
        .sym-bell { filter: drop-shadow(2px 2px 1px rgba(0,0,0,0.4)); }
        .sym-grape { filter: drop-shadow(2px 2px 1px rgba(0,0,0,0.4)); }
        .sym-cherry { filter: drop-shadow(2px 2px 1px rgba(0,0,0,0.4)); }
        .sym-replay { filter: drop-shadow(0 0 6px rgba(0,243,255,0.8)); }
        
        .spin-blur { filter: blur(3px); }

        /* 🔘 操作パネル */
        .controls-area {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .stop-buttons {
            display: flex;
            justify-content: flex-end;
            width: 100%;
            gap: 10px;
            padding-left: 26%; 
        }
        .btn-stop {
            flex: 1; aspect-ratio: 1.5;
            background: linear-gradient(180deg, #e60000 0%, #800000 100%);
            border: 2px solid #ff9999; border-radius: 10px;
            box-shadow: 0 8px 0 #4d0000, 0 10px 15px rgba(0,0,0,0.7), inset 0 2px 5px rgba(255,255,255,0.3);
            color: #fff; font-size: clamp(0.8rem, 3vw, 1.1rem); font-weight: 900;
            cursor: pointer; transition: all 0.05s;
        }
        .btn-stop:active:not(:disabled) {
            transform: translateY(8px); box-shadow: 0 0 0 #4d0000, inset 0 4px 8px rgba(0,0,0,0.6);
        }
        .btn-stop:disabled {
            background: #2a2a2a; border-color: #444; color: transparent;
            box-shadow: 0 8px 0 #111; cursor: not-allowed;
        }

        .btn-start {
            width: 100%; padding: 18px 0;
            background: linear-gradient(180deg, #ffffff 0%, #cccccc 100%);
            border: 3px solid #fff; border-radius: 14px;
            color: #111; font-size: clamp(1.5rem, 6vw, 2.2rem); font-weight: 900; font-family: 'Black Ops One', sans-serif;
            text-transform: uppercase; letter-spacing: 4px;
            box-shadow: 0 10px 0 #555, 0 15px 25px rgba(0,0,0,0.8), inset 0 2px 10px #fff;
            cursor: pointer; transition: all 0.05s;
        }
        .btn-start:active:not(:disabled) {
            transform: translateY(10px); box-shadow: 0 0 0 #555, inset 0 5px 15px rgba(0,0,0,0.5);
        }
        .btn-start:disabled {
            background: #222; border-color: #444; color: #666;
            box-shadow: 0 10px 0 #111; cursor: not-allowed;
        }

        .footer-link { text-align: center; margin-bottom: 2px; }
        .footer-link a { color: #777; text-decoration: none; font-size: 0.85rem; font-weight: bold; transition: color 0.2s; }
        .footer-link a:hover { color: #fff; }

        /* 💥 エフェクト類 */
        #flash-bang {
            position: fixed; top:0; left:0; width:100%; height:100%;
            background: #fff; opacity: 0; pointer-events: none; z-index: 9999; mix-blend-mode: overlay;
        }
        body.mega-flash #flash-bang { animation: bang-anim 0.4s ease-out; }
        .shake-hard { animation: shake-hard 0.06s infinite alternate; }
        .num-pop { animation: mega-pop 0.15s alternate 2; color: #fff !important; text-shadow: 0 0 20px #fff, 0 0 40px var(--neon-yellow) !important; }

        @keyframes gold-pulse { 0% { background-color: #1a1000; } 100% { background-color: #332000; } }
        @keyframes text-flicker { 0%, 100% { opacity: 1; } 50% { opacity: 0.8; } }
        @keyframes strobe-flash { 0% { filter: brightness(1); } 100% { filter: brightness(1.5); } }
        @keyframes bang-anim { 0% { opacity: 1; background: #fff; } 30% { background: var(--neon-magenta); } 100% { opacity: 0; } }
        @keyframes shake-hard { 0% { transform: translate(3px, 3px); } 100% { transform: translate(-3px, -3px); } }
        @keyframes mega-pop { 0% { transform: scale(1); } 100% { transform: scale(1.3); } }
        @keyframes reel-stop-bounce { 0% { transform: translateY(0); } 40% { transform: translateY(12px); } 100% { transform: translateY(0); } }
    </style>
</head>
<body>

<div id="flash-bang"></div>

<div class="arcade-cabinet" id="cabinet">
    <div class="marquee" id="marquee">INSERT MEDAL</div>

    <div class="hud-panel">
        <div class="inputs-row">
            <div class="input-group">
                <label>ACCOUNT</label>
                <select id="wallet-select"></select>
            </div>
            <div class="input-group">
                <label>BET</label>
                <input type="number" id="bet-amount" min="1" value="3">
            </div>
        </div>
        <div class="meters-row">
            <div class="meter">
                <div class="meter-label">CREDIT</div>
                <div class="meter-val" id="credit-display">---</div>
            </div>
            <div class="meter">
                <div class="meter-label">PAYOUT</div>
                <div class="meter-val green" id="payout-display">0</div>
            </div>
        </div>
    </div>

    <div class="stage-area">
        <div class="gogo-lamp" id="gogo-lamp">GOGO!<br><span>CHANCE</span></div>
        <div class="reels-wrapper">
            <div class="reel-window" id="window-0"><div class="reel-strip" id="reel-0"></div></div>
            <div class="reel-window" id="window-1"><div class="reel-strip" id="reel-1"></div></div>
            <div class="reel-window" id="window-2"><div class="reel-strip" id="reel-2"></div></div>
        </div>
    </div>

    <div class="controls-area">
        <div class="stop-buttons">
            <button class="btn-stop" id="btn-stop-0" disabled>1</button>
            <button class="btn-stop" id="btn-stop-1" disabled>2</button>
            <button class="btn-stop" id="btn-stop-2" disabled>3</button>
        </div>
        <button class="btn-start" id="btn-start">LEVER ON</button>
        <div class="footer-link"><a href="/casino">◀ BACK TO CASINO</a></div>
    </div>
</div>

<script>
    const token = localStorage.getItem("access_token");
    if (!token) window.location.href = "/";

    const SYMBOLS = {
        "7": '<div class="symbol"><div class="sym-7">7</div></div>',
        "BAR": '<div class="symbol"><div class="sym-bar">BAR</div></div>',
        "BELL": '<div class="symbol sym-bell">🔔</div>',
        "GRAPE": '<div class="symbol sym-grape">🍇</div>',
        "CHERRY": '<div class="symbol sym-cherry">🍒</div>',
        "REPLAY": '<div class="symbol sym-replay">💎</div>'
    };
    
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx = new AudioContext();

    function playSound(type) {
        if(audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        const now = audioCtx.currentTime;

        if (type === 'SPIN') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(300, now);
            osc.frequency.exponentialRampToValueAtTime(800, now + 0.3);
            gain.gain.setValueAtTime(0.1, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
            osc.start(now); osc.stop(now + 0.3);
        } else if (type === 'STOP') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(100, now);
            osc.frequency.exponentialRampToValueAtTime(20, now + 0.15);
            gain.gain.setValueAtTime(0.8, now);
            gain.gain.linearRampToValueAtTime(0.01, now + 0.15);
            osc.start(now); osc.stop(now + 0.15);
        } else if (type === 'PEKA') { 
            osc.type = 'square';
            osc.frequency.setValueAtTime(1000, now);
            osc.frequency.linearRampToValueAtTime(3500, now + 0.2);
            
            const lfo = audioCtx.createOscillator();
            lfo.type = 'sine'; lfo.frequency.value = 25;
            const lfoGain = audioCtx.createGain();
            lfoGain.gain.value = 800;
            lfo.connect(lfoGain); lfoGain.connect(osc.frequency);
            lfo.start(now); lfo.stop(now + 1.2);

            gain.gain.setValueAtTime(0, now);
            gain.gain.linearRampToValueAtTime(0.3, now + 0.05);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 1.2);
            osc.start(now); osc.stop(now + 1.2);
        } else if (type === 'COIN') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(2000 + Math.random()*200, now);
            gain.gain.setValueAtTime(0.15, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
            osc.start(now); osc.stop(now + 0.05);
        }
    }

    let myWalletsData = [];
    let reelEls = [document.getElementById('reel-0'), document.getElementById('reel-1'), document.getElementById('reel-2')];
    let winEls = [document.getElementById('window-0'), document.getElementById('window-1'), document.getElementById('window-2')];
    let rPos = [0, 0, 0];
    let rState = [0, 0, 0];
    let symbolHeight = 0;
    let reqAnim;
    
    let isSpinning = false;
    let stoppedCount = 0;
    let serverRes = null;

    init();

    async function init() {
        await loadWallets();
        setupReels(true);
        requestAnimationFrame(animate);
        
        document.getElementById("btn-start").addEventListener("click", () => {
            if(audioCtx.state === 'suspended') audioCtx.resume();
            startSpin();
        });
        document.getElementById("btn-stop-0").addEventListener("click", () => stopReel(0));
        document.getElementById("btn-stop-1").addEventListener("click", () => stopReel(1));
        document.getElementById("btn-stop-2").addEventListener("click", () => stopReel(2));
        
        document.getElementById("wallet-select").addEventListener("change", (e) => {
            const w = myWalletsData.find(w => w.wallet_id === e.target.value);
            if(w) updateCredit(w.balance);
        });

        window.addEventListener('resize', () => { setupReels(true); });
    }

    async function loadWallets() {
        try {
            const res = await fetch("/api/wallets", { headers: { "Authorization": `Bearer ${token}` } });
            myWalletsData = await res.json();
            const select = document.getElementById("wallet-select");
            const cur = select.value;
            select.innerHTML = myWalletsData.map(w => `<option value="${w.wallet_id}">${w.wallet_name}</option>`).join('');
            if (cur && myWalletsData.some(w => w.wallet_id === cur)) select.value = cur;
            const w = myWalletsData.find(w => w.wallet_id === select.value);
            if(w) updateCredit(w.balance);
        } catch (e) {}
    }

    function updateCredit(val) { document.getElementById("credit-display").innerText = val; }
    function updateWin(val) { document.getElementById("payout-display").innerText = val; }

    function fireFeedback(type) {
        const mq = document.getElementById("marquee");
        if(type === "PEKA") {
            playSound("PEKA");
            document.body.classList.add("mega-flash");
            setTimeout(() => document.body.classList.remove("mega-flash"), 400);
            document.getElementById("gogo-lamp").classList.add("peka");
        } else if (type === "BIG") {
            document.getElementById("cabinet").classList.add("shake-hard");
            document.body.classList.add("jackpot-mode");
            mq.innerText = "SUPER JACKPOT";
            mq.classList.add("jackpot");
            setTimeout(() => { document.getElementById("cabinet").classList.remove("shake-hard"); }, 2000);
        } else if (type === "REG") {
            mq.innerText = "REGULAR BONUS";
            mq.classList.add("active");
        }
    }

    function resetUI() {
        document.getElementById("gogo-lamp").classList.remove("peka");
        document.body.classList.remove("jackpot-mode");
        const mq = document.getElementById("marquee");
        mq.innerText = "GOOD LUCK";
        mq.className = "marquee";
        updateWin(0);
        winEls.forEach(el => el.classList.remove("bounce"));
    }

    function setupReels(isInit = false, resSyms = ["7","7","7"]) {
        const windowHeight = winEls[0].offsetHeight;
        symbolHeight = windowHeight / 3;
        
        for(let i=0; i<3; i++) {
            let html = "";
            const totalSyms = 32;
            for(let j=0; j<totalSyms; j++) {
                const pool = ["7", "BAR", "BELL", "GRAPE", "CHERRY", "REPLAY"];
                html += SYMBOLS[pool[Math.floor(Math.random() * pool.length)]];
            }
            if(!isInit && serverRes) html += SYMBOLS[resSyms[i]];
            else html += SYMBOLS["7"];
            html += SYMBOLS["GRAPE"];
            html += SYMBOLS["REPLAY"];
            
            reelEls[i].innerHTML = html;
            rPos[i] = 0;
            reelEls[i].style.transform = `translateY(0px)`;
        }
    }

    function animate() {
        const speed = symbolHeight * 0.85; 
        const maxScroll = -(32 * symbolHeight);
        
        for(let i=0; i<3; i++) {
            if(rState[i] === 1) {
                rPos[i] -= speed;
                if(rPos[i] <= maxScroll) rPos[i] += Math.abs(maxScroll);
                reelEls[i].style.transform = `translateY(${rPos[i]}px)`;
            } else if (rState[i] === 2) {
                rPos[i] = -(32 * symbolHeight) + symbolHeight;
                reelEls[i].style.transform = `translateY(${rPos[i]}px)`;
                reelEls[i].classList.remove("spin-blur");
                
                winEls[i].classList.remove("bounce");
                void winEls[i].offsetWidth;
                winEls[i].classList.add("bounce");

                rState[i] = 0;
                playSound("STOP");
            }
        }
        reqAnim = requestAnimationFrame(animate);
    }

    async function startSpin() {
        if (isSpinning) return;
        const wid = document.getElementById("wallet-select").value;
        const bet = parseInt(document.getElementById("bet-amount").value, 10);
        
        if(!wid || isNaN(bet) || bet < 1) {
            alert("口座またはベット額が正しくありません。");
            return;
        }

        isSpinning = true;
        stoppedCount = 0;
        serverRes = null;
        resetUI();
        playSound("SPIN");
        
        document.getElementById("btn-start").disabled = true;
        
        try {
            const res = await fetch("/api/slot/spin", {
                method: "POST",
                headers: { "Content-Type": "application/json", "Authorization": `Bearer ${token}` },
                body: JSON.stringify({ wallet_id: wid, bet_amount: bet })
            });
            
            const data = await res.json();
            if (!res.ok) {
                alert(data.detail || "通信エラー");
                throw new Error(data.detail);
            }
            serverRes = data;
            
            const w = myWalletsData.find(w => w.wallet_id === wid);
            if(w) { w.balance = serverRes.new_balance - serverRes.payout; updateCredit(w.balance); }

            setupReels(false, serverRes.result_symbols);

            for (let i = 0; i < 3; i++) {
                document.getElementById(`btn-stop-${i}`).disabled = false;
                reelEls[i].classList.add("spin-blur");
                rState[i] = 1;
            }

            if (serverRes.is_early_pekari) fireFeedback("PEKA");

        } catch (e) {
            isSpinning = false; document.getElementById("btn-start").disabled = false;
        }
    }

    function stopReel(idx) {
        if (rState[idx] !== 1) return;
        document.getElementById(`btn-stop-${idx}`).disabled = true;
        rState[idx] = 2; 
        stoppedCount++;
        
        if (stoppedCount === 3) {
            setTimeout(finishGame, 200);
        }
    }

    async function finishGame() {
        isSpinning = false;
        document.getElementById("btn-start").disabled = false;
        document.getElementById("marquee").innerText = "INSERT MEDAL";
        
        if (serverRes.is_pekari && !serverRes.is_early_pekari) fireFeedback("PEKA");

        if (serverRes.prize === "BIG") fireFeedback("BIG");
        else if (serverRes.prize === "REG") fireFeedback("REG");
        else if (serverRes.payout > 0) document.getElementById("marquee").innerText = "WINNER";

        if (serverRes.payout > 0) {
            let cur = 0;
            const tgt = serverRes.payout;
            const step = Math.ceil(tgt / 30); 
            
            const countTimer = setInterval(() => {
                cur += step;
                if(cur >= tgt) {
                    cur = tgt;
                    clearInterval(countTimer);
                    const w = myWalletsData.find(w => w.wallet_id === document.getElementById("wallet-select").value);
                    if(w) { w.balance = serverRes.new_balance; updateCredit(w.balance); }
                }
                updateWin(cur);
                const pEl = document.getElementById("payout-display");
                pEl.classList.remove("num-pop");
                void pEl.offsetWidth;
                pEl.classList.add("num-pop");
                playSound("COIN");
            }, 30);
        }
        loadWallets();
    }
</script>
</body>
</html>
