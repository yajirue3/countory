<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>村岡王国 - IMPERIAL JUGGLER</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Black+Ops+One&family=M+PLUS+1p:wght@900&family=Share+Tech+Mono&display=swap');

        :root {
            --neon-magenta: #ff00ff;
            --neon-cyan: #00f3ff;
            --neon-green: #00ff66;
            --neon-yellow: #ffe600;
            --alert-red: #ff0000;
            --gold-light: #ffd700;
            /* 💡 追加: 図柄の高さをJSから絶対値で注入し、透明化（高さ0）を防ぐ */
            --sym-h: 100px; 
        }

        * { box-sizing: border-box; touch-action: manipulation; }
        
        body { 
            font-family: 'M PLUS 1p', 'Black Ops One', sans-serif; 
            background: #000;
            color: #fff; 
            display: flex; 
            justify-content: center; 
            align-items: center;
            margin: 0; 
            min-height: 100vh;
            user-select: none;
            overflow: hidden;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.04) 1px, transparent 1px);
            background-size: 40px 40px;
            transition: background-color 0.1s, box-shadow 0.1s;
        }

        body.jackpot-mode {
            animation: insane-jackpot-bg 0.3s infinite alternate;
        }

        .arcade-cabinet {
            width: 100%;
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: max(env(safe-area-inset-top), 10px) 12px max(env(safe-area-inset-bottom), 10px) 12px;
            max-width: 500px;
            transition: transform 0.05s;
        }

        @media (min-width: 768px) {
            .arcade-cabinet {
                max-width: 850px;
                height: auto;
                aspect-ratio: 10/15;
                background: linear-gradient(180deg, #111 0%, #000 100%);
                border: 10px solid #333;
                border-radius: 24px;
                box-shadow: 0 0 100px rgba(0, 0, 0, 1), inset 0 0 40px rgba(255,255,255,0.1);
                padding: 32px;
                gap: 20px;
            }
        }

        .marquee {
            text-align: center;
            font-family: 'Black Ops One', sans-serif;
            font-size: clamp(1.8rem, 6vw, 3rem);
            color: #555;
            background: #050505;
            border: 2px solid #333;
            border-radius: 8px;
            padding: 15px;
            letter-spacing: 6px;
            transition: all 0.2s;
            text-shadow: 0 0 5px #000;
        }
        .marquee.active {
            color: var(--neon-cyan);
            border-color: var(--neon-cyan);
            text-shadow: 0 0 25px var(--neon-cyan), 0 0 10px #fff;
            box-shadow: inset 0 0 20px rgba(0, 243, 255, 0.4);
            transform: scale(1.02);
        }
        .marquee.jackpot {
            color: #fff;
            border-color: var(--neon-yellow);
            background: linear-gradient(90deg, #ff0000, #ffaa00, #ff0000, #ffaa00);
            background-size: 200% auto;
            text-shadow: 0 0 10px #fff, 0 0 40px var(--neon-yellow), 0 0 60px #ff0000;
            box-shadow: 0 0 50px #ff0000, inset 0 0 30px var(--neon-yellow);
            animation: rainbow-bg 0.5s infinite linear, shake-hard 0.1s infinite;
            transform: scale(1.05);
            font-size: clamp(2.2rem, 7vw, 3.8rem);
        }

        .hud-panel {
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: #0a0a0a;
            border: 2px solid #222;
            border-radius: 12px;
            padding: 16px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.8);
        }
        .inputs-row { display: flex; gap: 15px; }
        .input-group { flex: 1; display: flex; flex-direction: column; }
        .input-group label { font-size: 0.8rem; color: #aaa; font-weight: 900; letter-spacing: 2px; margin-bottom: 5px; text-shadow: 0 0 5px rgba(255,255,255,0.2); }
        .input-group select, .input-group input { 
            width: 100%; padding: 12px; background: #000; border: 2px solid #555; 
            color: #fff; font-size: 1.3rem; font-weight: 900; outline: none; border-radius: 8px;
            box-shadow: inset 0 4px 10px rgba(0,0,0,1);
            transition: border-color 0.2s;
        }
        .input-group select:focus, .input-group input:focus { border-color: var(--neon-cyan); box-shadow: 0 0 15px rgba(0,243,255,0.3), inset 0 4px 10px rgba(0,0,0,1); }
        
        .meters-row { display: flex; gap: 15px; margin-top: 8px; }
        .meter {
            flex: 1; background: #000; border: 3px solid #2a2a2a; border-radius: 8px;
            padding: 10px 15px; text-align: right; position: relative;
            box-shadow: inset 0 5px 15px rgba(0,0,0,1);
        }
        .meter-label { position: absolute; left: 12px; top: 12px; font-size: 0.75rem; color: #666; font-weight: 900; letter-spacing: 1px; }
        .meter-val { 
            font-family: 'Share Tech Mono', monospace; font-size: clamp(1.8rem, 6vw, 3rem); 
            color: var(--alert-red); text-shadow: 0 0 15px var(--alert-red); line-height: 1;
        }
        .meter-val.green { color: var(--neon-green); text-shadow: 0 0 20px var(--neon-green); }

        .stage-area {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: linear-gradient(180deg, #1a1a1a 0%, #050505 100%);
            border: 4px solid #222;
            border-radius: 12px;
            padding: 20px 16px;
            box-shadow: inset 0 30px 40px rgba(0,0,0,1), 0 15px 25px rgba(0,0,0,0.8);
            position: relative;
            min-height: 220px;
        }
        @media (min-width: 768px) { .stage-area { min-height: 320px; padding: 30px 24px; } }

        .gogo-lamp {
            width: 24%;
            aspect-ratio: 1;
            background: #020202;
            border-radius: 50%;
            border: 5px solid #111;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Black Ops One', sans-serif;
            font-size: clamp(0.8rem, 2.5vw, 1.3rem);
            color: #1a1a1a;
            line-height: 1.1;
            box-shadow: inset 0 0 30px #000;
            transition: all 0.05s;
            position: relative;
        }
        .gogo-lamp span { font-size: clamp(1rem, 3.5vw, 1.8rem); color: #1a1a1a; margin-top: -2px; }
        .gogo-lamp.peka {
            background: #fff;
            color: var(--neon-magenta);
            border-color: #ffd700;
            box-shadow: 0 0 80px #fff, 0 0 150px var(--neon-magenta), inset 0 0 40px #fff;
            text-shadow: 0 0 20px var(--neon-magenta), 0 0 40px var(--neon-magenta);
            animation: strobe-flash 0.04s infinite alternate;
            transform: scale(1.05);
        }
        .gogo-lamp.peka span { color: var(--neon-magenta); text-shadow: 0 0 20px var(--neon-magenta), 0 0 40px #fff; }

        .reels-wrapper {
            width: 72%;
            display: flex;
            gap: 8px;
            background: #000;
            padding: 8px;
            border: 4px solid #444;
            border-top-color: #222;
            border-bottom-color: #777;
            border-radius: 12px;
            position: relative;
            box-shadow: 0 10px 20px rgba(0,0,0,0.8);
        }
        .reels-wrapper::after {
            content: ""; position: absolute;
            top: 50%; left: 0; right: 0; height: 3px;
            background: rgba(255,0,0,0.8);
            box-shadow: 0 0 15px red, 0 0 30px red;
            transform: translateY(-50%);
            z-index: 10; pointer-events: none;
        }
        .reel-window {
            flex: 1;
            aspect-ratio: 1 / 2.4;
            background: #ffffff;
            overflow: hidden;
            position: relative;
            border-radius: 6px;
            box-shadow: inset 0 40px 25px -15px rgba(0,0,0,0.95), inset 0 -40px 25px -15px rgba(0,0,0,0.95);
            transform: translateY(0);
        }
        .reel-window.bounce { animation: reel-stop-bounce 0.12s cubic-bezier(0.25, 1, 0.5, 1); }

        .reel-strip {
            position: absolute; top: 0; left: 0; width: 100%;
            display: flex; flex-direction: column; will-change: transform;
        }
        .symbol {
            width: 100%; 
            /* 💡 変更: %指定をやめ、JSで計算したピクセル値を適用（透明バグ対策） */
            height: var(--sym-h); 
            display: flex; align-items: center; justify-content: center;
            font-size: clamp(2.5rem, 8vw, 4.5rem); font-weight: 900;
            border-bottom: 1px solid rgba(0,0,0,0.1);
            background: #ffffff;
        }
        
        .sym-7 { color: #e60000; text-shadow: 3px 3px 0 #222, -1px -1px 0 #fff; transform: scale(1.1); }
        .sym-bar { 
            color: #fff; background: linear-gradient(180deg, #333 0%, #111 100%); border: 4px solid #777; 
            width: 85%; height: 50%; font-size: 0.4em; 
            display: flex; align-items: center; justify-content: center; 
            border-radius: 6px; box-shadow: 0 6px 10px rgba(0,0,0,0.6); 
            letter-spacing: 3px;
        }
        .sym-bell { filter: drop-shadow(3px 3px 2px rgba(0,0,0,0.5)); }
        .sym-grape { filter: drop-shadow(3px 3px 2px rgba(0,0,0,0.5)); }
        .sym-cherry { filter: drop-shadow(3px 3px 2px rgba(0,0,0,0.5)); transform: scale(1.1); }
        .sym-replay { filter: drop-shadow(0 0 10px rgba(0,243,255,0.9)); transform: scale(1.1); }
        
        .spin-blur { filter: blur(4px) brightness(1.1); } 

        .controls-area { display: flex; flex-direction: column; gap: 16px; margin-top: 10px; }
        .stop-buttons { display: flex; justify-content: flex-end; width: 100%; gap: 12px; padding-left: 26%; }
        .btn-stop {
            flex: 1; aspect-ratio: 1.5;
            background: linear-gradient(180deg, #ff1a1a 0%, #a60000 100%);
            border: 3px solid #ffb3b3; border-radius: 12px;
            box-shadow: 0 10px 0 #660000, 0 15px 20px rgba(0,0,0,0.8), inset 0 4px 8px rgba(255,255,255,0.4);
            color: #fff; font-size: clamp(1rem, 3.5vw, 1.5rem); font-weight: 900;
            cursor: pointer; transition: all 0.05s;
        }
        .btn-stop:active:not(:disabled) {
            transform: translateY(10px); box-shadow: 0 0 0 #660000, inset 0 6px 12px rgba(0,0,0,0.8);
            background: linear-gradient(180deg, #ff4d4d 0%, #cc0000 100%);
        }
        .btn-stop:disabled { background: #2a2a2a; border-color: #333; color: transparent; box-shadow: 0 10px 0 #111; cursor: not-allowed; }
        .btn-stop:not(:disabled) { animation: btn-glow 1s infinite alternate; }

        .btn-start {
            width: 100%; padding: 22px 0;
            background: linear-gradient(180deg, #ffffff 0%, #b3b3b3 100%);
            border: 4px solid #fff; border-radius: 16px;
            color: #111; font-size: clamp(1.8rem, 6vw, 2.8rem); font-weight: 900; font-family: 'Black Ops One', sans-serif;
            text-transform: uppercase; letter-spacing: 6px;
            box-shadow: 0 12px 0 #666, 0 20px 30px rgba(0,0,0,0.9), inset 0 4px 15px #fff;
            cursor: pointer; transition: all 0.05s;
        }
        .btn-start:active:not(:disabled) {
            transform: translateY(12px); box-shadow: 0 0 0 #666, inset 0 8px 20px rgba(0,0,0,0.6);
        }
        .btn-start:disabled { background: #222; border-color: #333; color: #555; box-shadow: 0 12px 0 #0a0a0a; cursor: not-allowed; }

        .footer-link { text-align: center; margin-bottom: 5px; }
        .footer-link a { color: #888; text-decoration: none; font-size: 1rem; font-weight: bold; transition: color 0.2s; text-shadow: 0 2px 4px #000; }
        .footer-link a:hover { color: #fff; text-shadow: 0 0 10px #fff; }

        #flash-bang {
            position: fixed; top:0; left:0; width:100%; height:100%;
            background: #fff; opacity: 0; pointer-events: none; z-index: 9999; mix-blend-mode: hard-light;
        }
        body.mega-flash #flash-bang { animation: bang-anim 0.6s cubic-bezier(0.1, 1, 0.1, 1) forwards; }
        .shake-hard { animation: shake-hard 0.05s infinite alternate; }
        .num-pop { animation: super-pop 0.1s alternate 2; color: #fff !important; text-shadow: 0 0 30px #fff, 0 0 60px var(--neon-yellow) !important; }

        @keyframes insane-jackpot-bg {
            0% { background-color: #3a0000; box-shadow: inset 0 0 50px #ff0000; }
            50% { background-color: #4a3000; box-shadow: inset 0 0 150px #ffea00; }
            100% { background-color: #3a0000; box-shadow: inset 0 0 50px #ff0000; }
        }
        @keyframes rainbow-bg { to { background-position: 200% center; } }
        @keyframes strobe-flash { 0% { filter: brightness(1) contrast(1); } 100% { filter: brightness(2) contrast(1.5); } }
        @keyframes bang-anim { 0% { opacity: 1; background: #fff; } 10% { background: var(--neon-magenta); } 100% { opacity: 0; } }
        @keyframes shake-hard { 0% { transform: translate(5px, 5px) rotate(0.5deg); } 100% { transform: translate(-5px, -5px) rotate(-0.5deg); } }
        @keyframes super-pop { 0% { transform: scale(1); } 100% { transform: scale(1.5); } }
        @keyframes reel-stop-bounce { 0% { transform: translateY(0); } 30% { transform: translateY(18px); } 100% { transform: translateY(0); } }
        @keyframes btn-glow { 0% { box-shadow: 0 10px 0 #660000, 0 15px 20px rgba(0,0,0,0.8), 0 0 10px red; } 100% { box-shadow: 0 10px 0 #660000, 0 15px 20px rgba(0,0,0,0.8), 0 0 30px #ff4d4d; } }
    </style>
</head>
<body>

<div id="flash-bang"></div>

<div class="arcade-cabinet" id="cabinet">
    <div class="marquee" id="marquee">INSERT MEDAL</div>

    <div class="hud-panel">
        <div class="inputs-row">
            <div class="input-group">
                <label>ACCOUNT</label>
                <select id="wallet-select"></select>
            </div>
            <div class="input-group">
                <label>BET</label>
                <input type="number" id="bet-amount" min="1" value="3">
            </div>
        </div>
        <div class="meters-row">
            <div class="meter">
                <div class="meter-label">CREDIT</div>
                <div class="meter-val" id="credit-display">---</div>
            </div>
            <div class="meter">
                <div class="meter-label">PAYOUT</div>
                <div class="meter-val green" id="payout-display">0</div>
            </div>
        </div>
    </div>

    <div class="stage-area">
        <div class="gogo-lamp" id="gogo-lamp">GOGO!<br><span>CHANCE</span></div>
        <div class="reels-wrapper">
            <div class="reel-window" id="window-0"><div class="reel-strip" id="reel-0"></div></div>
            <div class="reel-window" id="window-1"><div class="reel-strip" id="reel-1"></div></div>
            <div class="reel-window" id="window-2"><div class="reel-strip" id="reel-2"></div></div>
        </div>
    </div>

    <div class="controls-area">
        <div class="stop-buttons">
            <button class="btn-stop" id="btn-stop-0" disabled>1</button>
            <button class="btn-stop" id="btn-stop-1" disabled>2</button>
            <button class="btn-stop" id="btn-stop-2" disabled>3</button>
        </div>
        <button class="btn-start" id="btn-start">LEVER ON</button>
        <div class="footer-link"><a href="/casino">◀ BACK TO CASINO</a></div>
    </div>
</div>

<script>
    const token = localStorage.getItem("access_token");
    if (!token) window.location.href = "/";

    const SYMBOLS = {
        "7": '<div class="symbol"><div class="sym-7">7</div></div>',
        "BAR": '<div class="symbol"><div class="sym-bar">BAR</div></div>',
        "BELL": '<div class="symbol"><span class="sym-bell">🔔</span></div>',
        "GRAPE": '<div class="symbol"><span class="sym-grape">🍇</span></div>',
        "CHERRY": '<div class="symbol"><span class="sym-cherry">🍒</span></div>',
        "REPLAY": '<div class="symbol"><span class="sym-replay">💎</span></div>'
    };

    const getSymbolHtml = (key) => SYMBOLS[key] || SYMBOLS["7"];

    // 💡 追加: 実際のパチスロ機を模した「あらかじめ決まった配列」
    const FIXED_STRIP_PATTERN = [
        "7", "CHERRY", "GRAPE", "BELL", "BAR", "REPLAY", 
        "GRAPE", "BAR", "CHERRY", "BELL", "7", "REPLAY",
        "GRAPE", "BELL", "7", "REPLAY", "BAR", "GRAPE"
    ];
    // 回転用につなぎ合わせる長さ（CSS崩れ防止用）
    const TOTAL_SPIN_SYMS = 32; 
    
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx = new AudioContext();

    function playSound(type) {
        if(audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        const now = audioCtx.currentTime;

        if (type === 'SPIN') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(400, now);
            osc.frequency.exponentialRampToValueAtTime(900, now + 0.3);
            gain.gain.setValueAtTime(0.15, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
            osc.start(now); osc.stop(now + 0.3);
        } else if (type === 'STOP') {
            osc.type = 'square';
            osc.frequency.setValueAtTime(150, now);
            osc.frequency.exponentialRampToValueAtTime(30, now + 0.1);
            gain.gain.setValueAtTime(1, now);
            gain.gain.linearRampToValueAtTime(0.01, now + 0.1);
            osc.start(now); osc.stop(now + 0.1);
        } else if (type === 'PEKA') { 
            osc.type = 'square';
            osc.frequency.setValueAtTime(1500, now);
            osc.frequency.linearRampToValueAtTime(4500, now + 0.1);
            
            const lfo = audioCtx.createOscillator();
            lfo.type = 'sine'; lfo.frequency.value = 35;
            const lfoGain = audioCtx.createGain();
            lfoGain.gain.value = 1200;
            lfo.connect(lfoGain); lfoGain.connect(osc.frequency);
            lfo.start(now); lfo.stop(now + 1.5);

            gain.gain.setValueAtTime(0, now);
            gain.gain.linearRampToValueAtTime(0.5, now + 0.05);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 1.5);
            osc.start(now); osc.stop(now + 1.5);
        } else if (type === 'COIN') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(2500 + Math.random()*500, now);
            gain.gain.setValueAtTime(0.3, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
            osc.start(now); osc.stop(now + 0.08);
        }
    }

    let myWalletsData = [];
    let reelEls = [document.getElementById('reel-0'), document.getElementById('reel-1'), document.getElementById('reel-2')];
    let winEls = [document.getElementById('window-0'), document.getElementById('window-1'), document.getElementById('window-2')];
    let rPos = [0, 0, 0];
    let rState = [0, 0, 0];
    let symbolHeight = 0;
    let reqAnim;
    
    let isSpinning = false;
    let stoppedCount = 0;
    let serverRes = null;

    init();

    async function init() {
        await loadWallets();
        setupReels(true);
        requestAnimationFrame(animate);
        
        document.getElementById("btn-start").addEventListener("click", () => {
            if(audioCtx.state === 'suspended') audioCtx.resume();
            startSpin();
        });
        document.getElementById("btn-stop-0").addEventListener("click", () => stopReel(0));
        document.getElementById("btn-stop-1").addEventListener("click", () => stopReel(1));
        document.getElementById("btn-stop-2").addEventListener("click", () => stopReel(2));
        
        document.getElementById("wallet-select").addEventListener("change", (e) => {
            const w = myWalletsData.find(w => w.wallet_id === e.target.value);
            if(w) updateCredit(w.balance);
        });

        window.addEventListener('resize', () => { setupReels(true); });
    }

    async function loadWallets() {
        try {
            const res = await fetch("/api/wallets", { headers: { "Authorization": `Bearer ${token}` } });
            myWalletsData = await res.json();
            const select = document.getElementById("wallet-select");
            const cur = select.value;
            select.innerHTML = myWalletsData.map(w => `<option value="${w.wallet_id}">${w.wallet_name}</option>`).join('');
            if (cur && myWalletsData.some(w => w.wallet_id === cur)) select.value = cur;
            const w = myWalletsData.find(w => w.wallet_id === select.value);
            if(w) updateCredit(w.balance);
        } catch (e) {}
    }

    function updateCredit(val) { document.getElementById("credit-display").innerText = val; }
    function updateWin(val) { document.getElementById("payout-display").innerText = val; }

    function fireFeedback(type) {
        const mq = document.getElementById("marquee");
        if(type === "PEKA") {
            playSound("PEKA");
            document.body.classList.remove("mega-flash");
            void document.body.offsetWidth;
            document.body.classList.add("mega-flash");
            document.getElementById("gogo-lamp").classList.add("peka");
        } else if (type === "BIG") {
            document.getElementById("cabinet").classList.add("shake-hard");
            document.body.classList.add("jackpot-mode");
            mq.innerText = "SUPER JACKPOT";
            mq.classList.add("jackpot");
            setTimeout(() => { document.getElementById("cabinet").classList.remove("shake-hard"); }, 3000);
        } else if (type === "REG") {
            mq.innerText = "REGULAR BONUS";
            mq.classList.add("active");
        }
    }

    function resetUI() {
        document.getElementById("gogo-lamp").classList.remove("peka");
        document.body.classList.remove("jackpot-mode", "mega-flash");
        const mq = document.getElementById("marquee");
        mq.innerText = "GOOD LUCK";
        mq.className = "marquee";
        updateWin(0);
        winEls.forEach(el => el.classList.remove("bounce"));
    }

    function setupReels(isInit = false, resSyms = ["7","7","7"]) {
        const windowHeight = winEls[0].offsetHeight;
        symbolHeight = windowHeight / 3;
        
        // 💡 修正: CSS側に計算済みの絶対値(px)を渡す（これにより高さ0潰れバグを根絶）
        document.documentElement.style.setProperty('--sym-h', `${symbolHeight}px`);
        
        for(let i=0; i<3; i++) {
            let html = "";
            
            // 💡 修正: 完全に決まった配列を順番にループ構築する（DOM負荷低減）
            for(let j=0; j<TOTAL_SPIN_SYMS; j++) {
                html += getSymbolHtml(FIXED_STRIP_PATTERN[j % FIXED_STRIP_PATTERN.length]);
            }
            
            // 最後にサーバーから来た結果（または初期の7）を配置
            if(!isInit && serverRes) html += getSymbolHtml(resSyms[i]);
            else html += getSymbolHtml("7");
            
            // 枠下にはみ出る見栄え用の調整図柄
            html += getSymbolHtml("GRAPE");
            html += getSymbolHtml("REPLAY");
            
            reelEls[i].innerHTML = html;
            rPos[i] = 0;
            reelEls[i].style.transform = `translateY(0px)`;
        }
    }

    function animate() {
        const speed = symbolHeight * 0.9; 
        const maxScroll = -(TOTAL_SPIN_SYMS * symbolHeight);
        
        for(let i=0; i<3; i++) {
            if(rState[i] === 1) {
                rPos[i] -= speed;
                if(rPos[i] <= maxScroll) rPos[i] += Math.abs(maxScroll);
                reelEls[i].style.transform = `translateY(${rPos[i]}px)`;
            } else if (rState[i] === 2) {
                rPos[i] = -(TOTAL_SPIN_SYMS * symbolHeight) + symbolHeight;
                reelEls[i].style.transform = `translateY(${rPos[i]}px)`;
                reelEls[i].classList.remove("spin-blur");
                
                winEls[i].classList.remove("bounce");
                void winEls[i].offsetWidth;
                winEls[i].classList.add("bounce");

                rState[i] = 0;
                playSound("STOP");
            }
        }
        reqAnim = requestAnimationFrame(animate);
    }

    async function startSpin() {
        if (isSpinning) return;
        const wid = document.getElementById("wallet-select").value;
        const bet = parseInt(document.getElementById("bet-amount").value, 10);
        
        if(!wid || isNaN(bet) || bet < 1) {
            alert("口座またはベット額が正しくありません。");
            return;
        }

        isSpinning = true;
        stoppedCount = 0;
        serverRes = null;
        resetUI();
        playSound("SPIN");
        
        document.getElementById("btn-start").disabled = true;
        
        try {
            const res = await fetch("/api/slot/spin", {
                method: "POST",
                headers: { "Content-Type": "application/json", "Authorization": `Bearer ${token}` },
                body: JSON.stringify({ wallet_id: wid, bet_amount: bet })
            });
            
            const data = await res.json();
            if (!res.ok) {
                alert(data.detail || "通信エラー");
                throw new Error(data.detail);
            }
            serverRes = data;
            
            const w = myWalletsData.find(w => w.wallet_id === wid);
            if(w) { w.balance = serverRes.new_balance - serverRes.payout; updateCredit(w.balance); }

            setupReels(false, serverRes.result_symbols);

            for (let i = 0; i < 3; i++) {
                document.getElementById(`btn-stop-${i}`).disabled = false;
                reelEls[i].classList.add("spin-blur");
                rState[i] = 1;
            }

            if (serverRes.is_early_pekari) fireFeedback("PEKA");

        } catch (e) {
            isSpinning = false; document.getElementById("btn-start").disabled = false;
        }
    }

    function stopReel(idx) {
        if (rState[idx] !== 1) return;
        document.getElementById(`btn-stop-${idx}`).disabled = true;
        rState[idx] = 2; 
        stoppedCount++;
        
        if (stoppedCount === 3) {
            setTimeout(finishGame, 200);
        }
    }

    async function finishGame() {
        isSpinning = false;
        document.getElementById("btn-start").disabled = false;
        document.getElementById("marquee").innerText = "INSERT MEDAL";
        
        if (serverRes.is_pekari && !serverRes.is_early_pekari) fireFeedback("PEKA");

        if (serverRes.prize === "BIG") fireFeedback("BIG");
        else if (serverRes.prize === "REG") fireFeedback("REG");
        else if (serverRes.payout > 0) document.getElementById("marquee").innerText = "WINNER";

        if (serverRes.payout > 0) {
            let cur = 0;
            const tgt = serverRes.payout;
            const step = Math.ceil(tgt / 40); 
            
            const countTimer = setInterval(() => {
                cur += step;
                if(cur >= tgt) {
                    cur = tgt;
                    clearInterval(countTimer);
                    const w = myWalletsData.find(w => w.wallet_id === document.getElementById("wallet-select").value);
                    if(w) { w.balance = serverRes.new_balance; updateCredit(w.balance); }
                }
                updateWin(cur);
                const pEl = document.getElementById("payout-display");
                pEl.classList.remove("num-pop");
                void pEl.offsetWidth; 
                pEl.classList.add("num-pop");
                playSound("COIN");
            }, 16); 
        }
        loadWallets();
    }
</script>
</body>
</html>
