{% raw %}
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>村岡王国 - マインズ (MINES)</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Black+Ops+One&family=M+PLUS+1p:wght@900&display=swap');

        :root {
            --neon-gold: #ffcf00;
            --neon-emerald: #00ff73;
            --neon-cyan: #00f0ff;
            --neon-crimson: #ff003c;
            --neon-violet: #a200ff;
            --bg-dark: #050508;
            --panel-bg: rgba(12, 12, 18, 0.85);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'M PLUS 1p', 'Black Ops One', sans-serif;
            background: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 50% 50%, #1a002a 0%, #000000 100%),
                linear-gradient(0deg, rgba(0, 240, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 0, 60, 0.05) 1px, transparent 1px);
            background-size: 100% 100%, 30px 30px, 30px 30px;
            color: #fff;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            user-select: none;
        }

        .app-container {
            display: flex;
            width: 100%;
            height: 100%;
            max-width: 1200px;
            flex-direction: column;
            padding: 10px;
            gap: 15px;
        }

        @media (min-width: 850px) {
            .app-container {
                flex-direction: row;
                align-items: center;
                padding: 30px;
                gap: 40px;
            }
            .left-panel {
                width: 380px;
                flex-shrink: 0;
            }
            .right-panel {
                flex-grow: 1;
                display: flex;
                justify-content: center;
                align-items: center;
            }
            .mines-grid {
                width: 100%;
                max-width: 600px;
            }
            .tile {
                border-radius: 16px !important;
                font-size: 2.5rem !important;
            }
        }

        @media (max-width: 849px) {
            .app-container {
                justify-content: flex-start;
                padding: 8px;
                gap: 8px;
            }
            .left-panel {
                order: 2;
                display: flex;
                flex-direction: column;
                gap: 6px;
            }
            .right-panel {
                order: 1;
                flex-grow: 1;
                display: flex;
                justify-content: center;
                align-items: center;
                min-height: 0;
            }
            .mines-grid {
                width: 100%;
                max-width: 45vh;
                margin: 0 auto;
            }
            .control-card {
                padding: 15px !important;
                border-radius: 12px !important;
            }
            .inputs-row {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 10px;
            }
            .header-title {
                font-size: 1.2rem !important;
                margin-bottom: 8px !important;
            }
        }

        .control-card {
            background: var(--panel-bg);
            border: 2px solid rgba(0, 240, 255, 0.3);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.1), inset 0 0 20px rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            position: relative;
            z-index: 10;
        }

        .header-title {
            font-size: 1.8rem;
            font-weight: 900;
            color: var(--neon-cyan);
            text-align: center;
            text-shadow: 0 0 15px var(--neon-cyan);
            margin: 0 0 20px 0;
            letter-spacing: 2px;
            border-bottom: 1px solid rgba(0, 240, 255, 0.3);
            padding-bottom: 10px;
        }

        /* ステータス系 */
        .status-box {
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(0, 240, 255, 0.2);
            border-radius: 12px;
            padding: 15px;
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.8);
        }

        .status-item {
            text-align: center;
            display: flex;
            flex-direction: column;
        }

        .status-label {
            font-size: 0.75rem;
            color: #888;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }

        .status-value {
            font-size: 1.4rem;
            font-weight: 900;
            font-family: 'Black Ops One', sans-serif;
            transition: all 0.3s ease;
        }

        .val-multi { color: var(--neon-emerald); text-shadow: 0 0 10px var(--neon-emerald); }
        .val-profit { color: var(--neon-gold); text-shadow: 0 0 10px var(--neon-gold); }

        /* 入力フォーム */
        .input-group {
            margin-bottom: 15px;
        }
        
        .inputs-row {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            color: #aaa;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 12px;
            background: rgba(0,0,0,0.7);
            border: 1px solid rgba(0, 240, 255, 0.4);
            color: #fff;
            border-radius: 8px;
            font-family: inherit;
            font-size: 1.1rem;
            font-weight: bold;
            transition: all 0.3s;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--neon-cyan);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
        }

        /* ボタン */
        .btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 10px;
            font-weight: 900;
            font-size: 1.3rem;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        
        .btn:active {
            transform: scale(0.96);
        }

        .btn-start {
            background: var(--neon-cyan);
            color: #000;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
        }

        .btn-start:hover {
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.8);
            background: #4dffff;
        }

        .btn-cashout {
            background: var(--neon-gold);
            color: #000;
            box-shadow: 0 0 15px rgba(255, 207, 0, 0.4);
            display: none;
        }

        .btn-cashout:hover {
            box-shadow: 0 0 25px rgba(255, 207, 0, 0.8);
            background: #ffdb4d;
        }

        /* グリッド */
        .mines-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            width: 100%;
            aspect-ratio: 1 / 1;
            padding: 15px;
            background: var(--panel-bg);
            border-radius: 20px;
            border: 2px solid rgba(0, 240, 255, 0.2);
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.1), inset 0 0 30px rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(10px);
        }

        .tile {
            background: rgba(255, 255, 255, 0.04);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2rem;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }

        .tile:hover:not(.disabled) {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-3px) scale(1.05);
            border-color: rgba(0, 240, 255, 0.5);
            box-shadow: 0 5px 15px rgba(0, 240, 255, 0.2), inset 0 0 10px rgba(0,240,255,0.2);
        }

        .tile.revealed-gem {
            background: rgba(0, 255, 115, 0.15);
            border-color: var(--neon-emerald);
            box-shadow: 0 0 20px rgba(0, 255, 115, 0.4) inset, 0 0 15px rgba(0, 255, 115, 0.2);
            cursor: default;
            transform: scale(1);
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .tile.revealed-mine {
            background: rgba(255, 0, 60, 0.2);
            border-color: var(--neon-crimson);
            box-shadow: 0 0 25px rgba(255, 0, 60, 0.6) inset, 0 0 20px rgba(255, 0, 60, 0.4);
            cursor: default;
            transform: scale(1);
            animation: shake 0.4s;
        }

        .tile.disabled {
            pointer-events: none;
        }

        .tile.fade {
            opacity: 0.3;
            filter: grayscale(100%);
            transition: all 0.5s ease;
        }

        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            80% { transform: scale(1.1); }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg) scale(1.1); }
            20% { transform: translate(-3px, 0px) rotate(2deg) scale(1.1); }
            40% { transform: translate(1px, -1px) rotate(-2deg) scale(1.1); }
            60% { transform: translate(-3px, 1px) rotate(2deg) scale(1.1); }
            80% { transform: translate(-1px, -1px) rotate(-2deg) scale(1.1); }
            100% { transform: translate(0px, 0px) rotate(0deg) scale(1); }
        }

        /* トースト通知 */
        .toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .toast {
            background: rgba(12, 12, 18, 0.95);
            border-left: 4px solid var(--neon-cyan);
            color: #fff;
            padding: 15px 25px;
            border-radius: 6px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.6);
            font-weight: bold;
            animation: slideIn 0.3s ease forwards, fadeOut 0.5s ease 2.5s forwards;
        }

        .toast.error { border-color: var(--neon-crimson); }
        .toast.success { border-color: var(--neon-emerald); }
        .toast.gold { border-color: var(--neon-gold); }

        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        @keyframes fadeOut {
            from { opacity: 1; }
            to { opacity: 0; visibility: hidden; }
        }

    </style>
</head>
<body>

    <div class="toast-container" id="toast-container"></div>

    <div class="app-container">
        <!-- 左側コントロールパネル -->
        <div class="left-panel control-card">
            <div class="header-title">MINES</div>
            
            <div class="status-box">
                <div class="status-item">
                    <span class="status-label">NEXT MULTIPLIER</span>
                    <span class="status-value val-multi" id="next-multi">1.00x</span>
                </div>
                <div class="status-item">
                    <span class="status-label">CURRENT PROFIT</span>
                    <span class="status-value val-profit" id="current-profit">0</span>
                </div>
            </div>

            <div class="inputs-row">
                <div>
                    <label>BET AMOUNT</label>
                    <input type="number" id="bet-amount" value="100" min="1" step="1">
                </div>
                <div>
                    <label>MINES</label>
                    <select id="mines-count">
                        <option value="1">1 Mine</option>
                        <option value="3" selected>3 Mines</option>
                        <option value="5">5 Mines</option>
                        <option value="10">10 Mines</option>
                        <option value="20">20 Mines</option>
                    </select>
                </div>
            </div>

            <button class="btn btn-start" id="btn-start">BET</button>
            <button class="btn btn-cashout" id="btn-cashout">CASHOUT</button>
        </div>

        <!-- 右側グリッドパネル -->
        <div class="right-panel">
            <div class="mines-grid" id="mines-grid">
                <!-- JavaScriptで25マスを生成 -->
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const grid = document.getElementById('mines-grid');
            const btnStart = document.getElementById('btn-start');
            const btnCashout = document.getElementById('btn-cashout');
            const inputBet = document.getElementById('bet-amount');
            const inputMines = document.getElementById('mines-count');
            const displayMulti = document.getElementById('next-multi');
            const displayProfit = document.getElementById('current-profit');
            const toastContainer = document.getElementById('toast-container');

            let isPlaying = false;
            let sessionId = null;
            let currentBet = 0;

            // APIパス設定
            const API_START = '/api/mines/start';
            const API_STEP = '/api/mines/step';
            const API_CASHOUT = '/api/mines/cashout';

            function showToast(message, type = 'default') {
                const toast = document.createElement('div');
                toast.className = `toast ${type}`;
                toast.textContent = message;
                toastContainer.appendChild(toast);
                setTimeout(() => toast.remove(), 3000);
            }

            function getHeaders() {
                const token = localStorage.getItem('access_token') || localStorage.getItem('token');
                return {
                    'Content-Type': 'application/json',
                    'Authorization': token ? `Bearer ${token}` : ''
                };
            }

            function initGrid() {
                grid.innerHTML = '';
                for (let i = 0; i < 25; i++) {
                    const tile = document.createElement('div');
                    tile.className = 'tile';
                    tile.dataset.index = i;
                    
                    const triggerEvent = ('ontouchstart' in window) ? 'touchstart' : 'mousedown';
                    tile.addEventListener(triggerEvent, (e) => {
                        e.preventDefault();
                        handleTileClick(i, tile);
                    });
                    
                    grid.appendChild(tile);
                }
            }

            async function handleTileClick(index, tileEl) {
                if (!isPlaying) return;
                if (tileEl.classList.contains('revealed-gem') || tileEl.classList.contains('revealed-mine')) return;

                try {
                    const res = await fetch(API_STEP, {
                        method: 'POST',
                        headers: getHeaders(),
                        body: JSON.stringify({ session_id: sessionId, position: index })
                    });
                    
                    const data = await res.json();

                    if (!res.ok) {
                        showToast(data.detail || '通信エラー', 'error');
                        return;
                    }

                    if (data.status === 'playing') {
                        // セーフ（ドーパミン演出）
                        tileEl.classList.add('revealed-gem');
                        tileEl.innerHTML = '💎';
                        displayMulti.textContent = `${data.multiplier.toFixed(2)}x`;
                        
                        // プロフィットをアニメーション風に更新
                        const newProfit = Math.floor(currentBet * data.multiplier);
                        displayProfit.textContent = newProfit;
                        displayProfit.style.transform = 'scale(1.2)';
                        setTimeout(() => displayProfit.style.transform = 'scale(1)', 200);
                        
                    } else if (data.status === 'busted') {
                        // アウト
                        tileEl.classList.add('revealed-mine');
                        tileEl.innerHTML = '💣';
                        showToast('BOOM! 敗北...', 'error');
                        displayProfit.textContent = '0';
                        endGame(data.grid); 
                    }

                } catch (err) {
                    console.error(err);
                    showToast('サーバーとの通信に失敗しました', 'error');
                }
            }

            async function startGame() {
                const bet = parseFloat(inputBet.value);
                const mines = parseInt(inputMines.value);

                if (isNaN(bet) || bet <= 0) {
                    return showToast('正しいベット額を入力してください', 'error');
                }

                try {
                    const res = await fetch(API_START, {
                        method: 'POST',
                        headers: getHeaders(),
                        body: JSON.stringify({ bet_amount: bet, mines_count: mines })
                    });
                    
                    const data = await res.json();

                    if (!res.ok) {
                        return showToast(data.detail || '開始できませんでした', 'error');
                    }

                    sessionId = data.session_id;
                    isPlaying = true;
                    currentBet = bet;

                    initGrid();
                    
                    displayMulti.textContent = '1.00x';
                    displayProfit.textContent = bet;
                    
                    inputBet.disabled = true;
                    inputMines.disabled = true;
                    btnStart.style.display = 'none';
                    btnCashout.style.display = 'block';

                    showToast('GOOD LUCK!', 'success');

                } catch (err) {
                    console.error(err);
                    showToast('通信エラーが発生しました', 'error');
                }
            }

            async function cashout() {
                if (!isPlaying) return;

                try {
                    const res = await fetch(API_CASHOUT, {
                        method: 'POST',
                        headers: getHeaders(),
                        body: JSON.stringify({ session_id: sessionId })
                    });
                    
                    const data = await res.json();

                    if (!res.ok) {
                        return showToast(data.detail || 'エラーが発生しました', 'error');
                    }

                    if (data.status === 'cashed_out') {
                        showToast(`見事な利確！ +${data.payout}`, 'gold');
                        endGame(data.grid);
                    }

                } catch (err) {
                    console.error(err);
                    showToast('通信エラーが発生しました', 'error');
                }
            }

            function endGame(gridData) {
                isPlaying = false;
                
                const tiles = grid.querySelectorAll('.tile');
                
                tiles.forEach((tile, i) => {
                    tile.classList.add('disabled');
                    
                    if (!tile.classList.contains('revealed-gem') && !tile.classList.contains('revealed-mine')) {
                        tile.classList.add('fade');
                        
                        setTimeout(() => {
                            if (gridData && gridData[i] === 1) {
                                tile.innerHTML = '💣';
                            } else {
                                tile.innerHTML = '💎';
                            }
                        }, i * 30); // 終了時のパラパラとめくれる余韻演出
                    }
                });

                inputBet.disabled = false;
                inputMines.disabled = false;
                btnStart.style.display = 'block';
                btnCashout.style.display = 'none';
            }

            btnStart.addEventListener('click', startGame);
            btnCashout.addEventListener('click', cashout);

            initGrid();
        });
    </script>
</body>
</html>
{% endraw %}
