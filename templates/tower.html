<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>村岡王国 - タワーゲーム (Tower)</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Black+Ops+One&family=M+PLUS+1p:wght@800;900&display=swap');

        :root {
            --neon-pink: #ff007f;
            --neon-cyan: #00f3ff;
            --neon-yellow: #ffe600;
            --neon-green: #00ff66;
            --neon-red: #ff003c;
            --neon-purple: #b000ff;
        }

        body { 
            font-family: 'M PLUS 1p', 'Black Ops One', sans-serif; 
            background: #000;
            background-image: 
                radial-gradient(circle at 50% 30%, #200033 0%, #000000 85%),
                linear-gradient(0deg, rgba(255, 0, 127, 0.08) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 243, 255, 0.08) 1px, transparent 1px);
            background-size: 100% 100%, 20px 20px, 20px 20px;
            color: #fff; 
            display: flex; 
            justify-content: center; 
            padding: 10px 0; 
            margin: 0; 
            min-height: 100vh;
            box-sizing: border-box;
            overflow-x: hidden;
        }

        .container { 
            width: 100%; 
            max-width: 380px; 
            display: flex; 
            flex-direction: column; 
            gap: 10px; 
            box-sizing: border-box;
            padding: 0 10px;
        }

        .card { 
            background: rgba(15, 5, 25, 0.95); 
            border: 2px solid var(--neon-pink); 
            border-radius: 20px; 
            padding: 14px; 
            box-shadow: 0 0 20px rgba(255, 0, 127, 0.5); 
            position: relative;
            overflow: hidden;
        }

        .header { 
            font-size: 1.3rem; 
            font-weight: 900; 
            color: var(--neon-yellow); 
            text-align: center; 
            border-bottom: 2px solid var(--neon-cyan); 
            padding-bottom: 4px; 
            margin-bottom: 6px; 
            text-shadow: 0 0 10px var(--neon-yellow);
            letter-spacing: 1px;
        }

        .label { 
            font-size: 0.75rem; 
            color: var(--neon-cyan); 
            margin-top: 6px; 
            display: block; 
            font-weight: 900;
            text-shadow: 0 0 4px var(--neon-cyan);
        }

        input, select { 
            width: 100%; 
            padding: 8px 10px; 
            border-radius: 10px; 
            border: 2px solid var(--neon-cyan); 
            background: rgba(10, 10, 20, 0.9); 
            color: #fff; 
            box-sizing: border-box; 
            margin-top: 3px; 
            margin-bottom: 6px; 
            font-size: 0.9rem; 
            font-weight: bold;
            font-family: inherit; 
            outline: none;
        }

        input:focus, select:focus {
            border-color: var(--neon-pink);
            box-shadow: 0 0 10px var(--neon-pink);
        }

        button { 
            width: 100%; 
            padding: 10px; 
            border: none; 
            border-radius: 12px; 
            font-weight: 900; 
            cursor: pointer; 
            background: var(--neon-yellow); 
            color: #000; 
            font-size: 0.95rem; 
            margin-top: 4px; 
            box-shadow: 0 0 12px var(--neon-yellow);
            user-select: none;
            transition: transform 0.05s ease;
        }

        button:active:not(:disabled) {
            transform: scale(0.95);
            filter: brightness(1.3);
        }

        .btn-start { 
            background: linear-gradient(135deg, #ff0055 0%, #ff00a0 50%, #7928ca 100%); 
            color: #fff; 
            font-size: 1.15rem; 
            padding: 12px; 
            border-radius: 14px;
            box-shadow: 0 0 25px var(--neon-pink);
            text-shadow: 0 0 5px #fff;
            border: 2px solid #fff;
            animation: pulse-btn 1.5s infinite;
        }

        @keyframes pulse-btn {
            0% { box-shadow: 0 0 15px var(--neon-pink); }
            50% { box-shadow: 0 0 30px var(--neon-pink), 0 0 10px var(--neon-cyan); }
            100% { box-shadow: 0 0 15px var(--neon-pink); }
        }

        .btn-start:disabled { 
            background: #333; 
            box-shadow: none; 
            cursor: not-allowed; 
            border: none;
            color: #666;
            animation: none;
            transform: none !important;
        }

        .btn-cashout {
            background: linear-gradient(135deg, #00ff66 0%, #009933 100%);
            color: #000;
            font-size: 1.1rem;
            padding: 12px;
            border-radius: 14px;
            box-shadow: 0 0 20px var(--neon-green);
            margin-top: 8px;
            border: 2px solid #fff;
            animation: cashout-glow 0.8s infinite alternate;
        }

        @keyframes cashout-glow {
            from { box-shadow: 0 0 10px var(--neon-green); filter: brightness(1); }
            to { box-shadow: 0 0 25px var(--neon-green), 0 0 10px var(--neon-yellow); filter: brightness(1.3); }
        }

        .btn-cashout:disabled { background: #333; box-shadow: none; cursor: not-allowed; border: none; color: #666; animation: none; }

        .btn-back { 
            background: #111; 
            color: #888; 
            margin-top: 4px; 
            border: 1px solid #333; 
            font-size: 0.8rem;
            padding: 8px;
            box-shadow: none;
        }

        /* 🎰 ステータス表示エリア */
        .status-display { 
            background: #000; 
            border: 2px solid var(--neon-cyan); 
            border-radius: 16px; 
            padding: 10px 8px; 
            text-align: center; 
            margin-bottom: 8px; 
            box-shadow: inset 0 0 15px rgba(0, 243, 255, 0.4);
            position: relative;
            will-change: transform;
        }

        .status-text { 
            font-size: 0.85rem; 
            font-weight: 900; 
            color: var(--neon-yellow); 
            min-height: 22px; 
            text-shadow: 0 0 6px currentColor;
        }
        
        .stats-grid { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 8px; 
            background: rgba(0, 0, 0, 0.5); 
            border-radius: 12px; 
            padding: 6px; 
            margin-bottom: 8px; 
        }

        .stat-box { 
            text-align: center; 
            background: rgba(20, 20, 35, 0.8);
            padding: 6px;
            border-radius: 10px;
            border: 1px solid rgba(0, 243, 255, 0.2);
        }

        .stat-label { font-size: 0.7rem; color: #aaa; font-weight: bold; }
        .stat-val { 
            font-size: 1.15rem; 
            font-weight: 900; 
            color: var(--neon-green); 
            margin-top: 1px; 
            text-shadow: 0 0 8px var(--neon-green); 
            font-family: 'Black Ops One', monospace;
            display: inline-block;
            will-change: transform;
        }

        /* 🏰 15段タワーエリア */
        .tower-container {
            display: flex;
            flex-direction: column-reverse;
            gap: 5px;
            max-height: 320px;
            overflow-y: auto;
            background: #000;
            padding: 8px;
            border-radius: 14px;
            border: 2px solid var(--neon-pink);
            margin-bottom: 8px;
            box-shadow: inset 0 0 15px rgba(255, 0, 127, 0.3);
            scrollbar-width: thin;
        }

        .tower-row {
            display: flex;
            align-items: center;
            gap: 6px;
            opacity: 0.35;
            padding: 4px;
            border-radius: 10px;
            background: rgba(20, 10, 30, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: all 0.15s ease;
        }

        .tower-row.active {
            opacity: 1.0;
            background: rgba(0, 243, 255, 0.12);
            border: 2px solid var(--neon-cyan);
            box-shadow: 0 0 12px var(--neon-cyan);
            animation: active-row-pulse 1s infinite alternate;
        }

        @keyframes active-row-pulse {
            from { border-color: var(--neon-cyan); box-shadow: 0 0 8px var(--neon-cyan); }
            to { border-color: var(--neon-pink); box-shadow: 0 0 15px var(--neon-pink); }
        }

        .tower-row.cleared {
            opacity: 0.9;
            background: rgba(0, 255, 102, 0.1);
            border: 1px solid var(--neon-green);
        }

        .floor-num {
            font-size: 0.75rem;
            font-weight: 900;
            color: var(--neon-yellow);
            width: 28px;
            text-align: center;
            text-shadow: 0 0 4px var(--neon-yellow);
            font-family: 'Black Ops One', monospace;
        }

        .tiles-group {
            display: flex;
            flex: 1;
            gap: 6px;
        }

        .tile-btn {
            flex: 1;
            padding: 8px 0;
            background: #151525;
            border: 1.5px solid var(--neon-cyan);
            color: var(--neon-cyan);
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 900;
            cursor: pointer;
            margin: 0;
            box-shadow: 0 0 6px rgba(0, 243, 255, 0.2);
            transition: transform 0.05s ease;
        }

        .tile-btn:not(:disabled):hover {
            background: var(--neon-cyan);
            color: #000;
            box-shadow: 0 0 12px var(--neon-cyan);
        }

        .tile-btn:disabled {
            cursor: not-allowed;
            background: #101015;
            border-color: #333;
            color: #444;
            box-shadow: none;
        }

        .tile-btn.safe { 
            background: linear-gradient(135deg, #00ff66 0%, #009933 100%) !important; 
            border-color: #fff !important; 
            color: #fff !important; 
            text-shadow: 0 0 6px #000;
            box-shadow: 0 0 15px var(--neon-green) !important;
        }

        .tile-btn.trap { 
            background: linear-gradient(135deg, #ff003c 0%, #990000 100%) !important; 
            border-color: #fff !important; 
            color: #fff !important; 
            box-shadow: 0 0 15px var(--neon-red) !important;
        }

        .floor-mult { 
            font-size: 0.75rem; 
            font-weight: 900;
            color: var(--neon-green); 
            width: 58px; 
            text-align: right; 
            text-shadow: 0 0 5px var(--neon-green);
            font-family: 'Black Ops One', monospace;
        }

        /* ⚙️ オプション設定パネル */
        .option-box { 
            background: rgba(10, 10, 15, 0.95); 
            border: 1.5px solid var(--neon-pink); 
            border-radius: 14px; 
            padding: 8px 10px; 
            margin-top: 6px; 
        }

        .checkbox-label { 
            display: flex; 
            align-items: center; 
            gap: 6px; 
            font-size: 0.78rem; 
            font-weight: bold;
            color: #fff; 
            cursor: pointer; 
        }

        .checkbox-label input[type=checkbox] { 
            width: 16px; 
            height: 16px; 
            margin: 0; 
            accent-color: var(--neon-pink);
        }

        /* 🌈 脳汁爆発！虹色・揺れ・飛び出し演出 🌈 */
        .win-rainbow-shake {
            animation: rainbow-glow 0.4s linear infinite, win-shake-anim 0.2s ease-in-out infinite alternate;
        }

        .win-rainbow-noshake {
            animation: rainbow-glow 0.4s linear infinite;
        }

        .win-text-rainbow {
            animation: rainbow-text 0.2s linear infinite;
        }

        .num-pop {
            animation: pop-bounce 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes pop-bounce {
            0% { transform: scale(1); }
            50% { transform: scale(1.45); text-shadow: 0 0 30px #ffffff, 0 0 50px var(--neon-pink); }
            100% { transform: scale(1); }
        }

        .lose-shake {
            animation: lose-shake-anim 0.2s ease-in-out 2;
            border-color: var(--neon-red) !important;
        }

        @keyframes rainbow-glow {
            0% { border-color: #ff0000; box-shadow: 0 0 25px #ff0000, inset 0 0 15px #ff0000; }
            20% { border-color: #ffff00; box-shadow: 0 0 25px #ffff00, inset 0 0 15px #ffff00; }
            40% { border-color: #00ff00; box-shadow: 0 0 25px #00ff00, inset 0 0 15px #00ff00; }
            60% { border-color: #00ffff; box-shadow: 0 0 25px #00ffff, inset 0 0 15px #00ffff; }
            80% { border-color: #ff00ff; box-shadow: 0 0 25px #ff00ff, inset 0 0 15px #ff00ff; }
            100% { border-color: #ff0000; box-shadow: 0 0 25px #ff0000, inset 0 0 15px #ff0000; }
        }

        @keyframes rainbow-text {
            0% { color: #ff0055; text-shadow: 0 0 15px #ff0055; }
            25% { color: #ffe600; text-shadow: 0 0 15px #ffe600; }
            50% { color: #00ff66; text-shadow: 0 0 15px #00ff66; }
            75% { color: #00f3ff; text-shadow: 0 0 15px #00f3ff; }
            100% { color: #ff00a0; text-shadow: 0 0 15px #ff00a0; }
        }

        @keyframes win-shake-anim {
            0% { transform: scale(1) rotate(0deg); }
            50% { transform: scale(1.05) rotate(-1.5deg); }
            100% { transform: scale(1.05) rotate(1.5deg); }
        }

        @keyframes lose-shake-anim {
            0% { transform: translateX(0); }
            25% { transform: translateX(-6px); }
            75% { transform: translateX(6px); }
            100% { transform: translateX(0); }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="card" id="main-card">
        <div class="header">👑 脳汁頂上！TOWER 👑</div>
        <p style="font-size: 0.75rem; color: #00f3ff; font-weight: bold; margin: 0 0 6px 0; text-align: center; text-shadow: 0 0 4px #00f3ff;">
            ⚡ 全財産を叩き込め！1/3の罠を避けて頂点を目指せ！ ⚡
        </p>

        <!-- ステータスエリア -->
        <div class="status-display" id="status-display-box">
            <div id="game-status" class="status-text">🔥 全ベット準備完了！勝負のタワーを開始せよ！</div>
        </div>

        <div class="stats-grid">
            <div class="stat-box">
                <div class="stat-label">🔥 現在の獲得倍率</div>
                <div id="stat-multiplier" class="stat-val">1.00x</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">💎 見込み獲得Gold</div>
                <div id="stat-payout" class="stat-val">0 G</div>
            </div>
        </div>

        <!-- 口座選択 -->
        <div class="label">💳 支払口座</div>
        <select id="wallet-select"></select>

        <!-- 賭け金入力 -->
        <div class="label">💎 賭け金 (Gold)</div>
        <input type="number" id="bet-amount" min="10" value="100" placeholder="例: 100">

        <!-- 15段のタワー -->
        <div class="label">🏰 頂上へ登れ！(全15階)</div>
        <div id="tower-container" class="tower-container"></div>

        <!-- ボタンエリア -->
        <button id="start-btn" class="btn-start">🚀 脳汁挑戦スタート！</button>
        <button id="cashout-btn" class="btn-cashout" disabled>💰 今すぐ利確 (Cash Out)</button>

        <!-- ⚙️ オプション設定 -->
        <div class="option-box">
            <label class="checkbox-label">
                <input type="checkbox" id="disable-shake">
                <span>🚫 画面の揺れ・飛び出し演出をオフにする</span>
            </label>
        </div>
    </div>

    <button class="btn-back" onclick="location.href='/casino'">◀ カジノ一覧に戻る</button>
</div>

<script>
    const token = localStorage.getItem("access_token");
    const TOTAL_FLOORS = 15;
    
    let myWalletsData = [];
    let currentGameId = null;
    let currentFloor = 0;
    let isPlaying = false;
    let activeBetAmount = 0;

    initTowerUI();

    if (!token) {
        window.location.href = "/";
    } else {
        loadWallets();
        setupEventListeners();
    }

    // RTP 90.0% 倍率計算関数
    function getMultiplier(floor) {
        if (floor <= 0) return 1.0;
        return Math.floor(Math.pow(2.70, floor) * 100) / 100;
    }

    async function loadWallets() {
        try {
            const res = await fetch("/api/wallets", { headers: { "Authorization": `Bearer ${token}` } });
            if (!res.ok) return;
            myWalletsData = await res.json();
            
            const select = document.getElementById("wallet-select");
            const currentSelected = select.value;

            select.innerHTML = myWalletsData.map(w => `
                <option value="${w.wallet_id}">${escapeHtml(w.wallet_name)} (${w.wallet_id}) - 残高:${w.balance}G</option>
            `).join('');

            if (currentSelected && myWalletsData.some(w => w.wallet_id === currentSelected)) {
                select.value = currentSelected;
            }
        } catch (e) {
            console.error(e);
        }
    }

    function initTowerUI() {
        const container = document.getElementById("tower-container");
        container.innerHTML = "";

        for (let f = 1; f <= TOTAL_FLOORS; f++) {
            const mult = getMultiplier(f).toFixed(2);
            const row = document.createElement("div");
            row.className = `tower-row ${f === 1 ? 'active' : ''}`;
            row.id = `floor-row-${f}`;

            row.innerHTML = `
                <div class="floor-num">${f}F</div>
                <div class="tiles-group">
                    <button class="tile-btn" onclick="selectTile(${f}, 0)" disabled>?</button>
                    <button class="tile-btn" onclick="selectTile(${f}, 1)" disabled>?</button>
                    <button class="tile-btn" onclick="selectTile(${f}, 2)" disabled>?</button>
                </div>
                <div class="floor-mult">${mult}x</div>
            `;
            container.appendChild(row);
        }
    }

    function setupEventListeners() {
        document.getElementById("start-btn").addEventListener("click", startGame);
        document.getElementById("cashout-btn").addEventListener("click", cashout);
    }

    function triggerWinEffects() {
        const displayBox = document.getElementById("status-display-box");
        const disableShake = document.getElementById("disable-shake").checked;
        const payoutEl = document.getElementById("stat-payout");
        const statusEl = document.getElementById("game-status");

        displayBox.className = "status-display";
        payoutEl.className = "stat-val";
        statusEl.className = "status-text";

        statusEl.classList.add("win-text-rainbow");

        if (disableShake) {
            displayBox.classList.add("win-rainbow-noshake");
        } else {
            displayBox.classList.add("win-rainbow-shake");
            payoutEl.classList.add("num-pop");
        }
    }

    function triggerLoseEffects() {
        const displayBox = document.getElementById("status-display-box");
        const disableShake = document.getElementById("disable-shake").checked;
        
        displayBox.className = "status-display";
        
        if (!disableShake) {
            displayBox.classList.add("lose-shake");
        }
    }

    function resetEffects() {
        const displayBox = document.getElementById("status-display-box");
        const payoutEl = document.getElementById("stat-payout");
        const statusEl = document.getElementById("game-status");

        displayBox.className = "status-display";
        payoutEl.className = "stat-val";
        statusEl.className = "status-text";
    }

    async function startGame() {
        const wallet_id = document.getElementById("wallet-select").value;
        const amount = parseInt(document.getElementById("bet-amount").value, 10);

        if (!wallet_id) return alert("口座を選択してください");
        if (!amount || amount <= 0) return alert("賭け金を正しく入力してください");

        try {
            const res = await fetch("/api/tower/start", {
                method: "POST",
                headers: { "Content-Type": "application/json", "Authorization": `Bearer ${token}` },
                body: JSON.stringify({ wallet_id, amount })
            });

            const data = await res.json();
            if (!res.ok) return alert(data.detail || "エラーが発生しました");

            resetEffects();
            initTowerUI();

            currentGameId = data.game_id;
            activeBetAmount = amount;
            currentFloor = 1;
            isPlaying = true;

            await loadWallets();
            updateUIState();

            const statusEl = document.getElementById("game-status");
            statusEl.innerText = "⚡ 1階のブロックを選べ！直感を信じろ！";
            statusEl.style.color = "#00f3ff";

            scrollToActiveFloor();

        } catch (e) {
            console.error(e);
            alert("通信エラーが発生しました");
        }
    }

    async function selectTile(floor, tileIndex) {
        if (!isPlaying || floor !== currentFloor) return;

        try {
            const res = await fetch("/api/tower/step", {
                method: "POST",
                headers: { "Content-Type": "application/json", "Authorization": `Bearer ${token}` },
                body: JSON.stringify({ game_id: currentGameId, floor, tile_index: tileIndex })
            });

            const data = await res.json();
            if (!res.ok) return alert(data.detail || "エラーが発生しました");

            const row = document.getElementById(`floor-row-${floor}`);
            const buttons = row.querySelectorAll(".tile-btn");

            if (data.is_safe) {
                buttons[tileIndex].innerText = "💎";
                buttons[tileIndex].classList.add("safe");

                if (data.is_cleared) {
                    isPlaying = false;
                    const statusEl = document.getElementById("game-status");
                    statusEl.innerText = `🌈👑 タワー完全制覇！！ +${data.payout} Gold 神引き達成！！ 👑🌈`;
                    
                    triggerWinEffects();
                    await loadWallets();
                } else {
                    currentFloor = data.next_floor;
                    const statusEl = document.getElementById("game-status");
                    statusEl.innerText = `🎯 突破！！ (${data.multiplier}x) 次の ${currentFloor}階へ挑め！`;
                    statusEl.style.color = "#00ff66";

                    triggerWinEffects();
                    scrollToActiveFloor();
                }
            } else {
                buttons[tileIndex].innerText = "💣";
                buttons[tileIndex].classList.add("trap");
                
                if (buttons[data.safe_tile]) {
                    buttons[data.safe_tile].innerText = "💎";
                }

                isPlaying = false;
                const statusEl = document.getElementById("game-status");
                statusEl.innerText = `💀 爆死！！ 罠を踏んでしまった... (-${activeBetAmount} G)`;
                statusEl.style.color = "#ff003c";

                triggerLoseEffects();
            }

            updateUIState();

        } catch (e) {
            console.error(e);
            alert("通信エラーが発生しました");
        }
    }

    async function cashout() {
        if (!isPlaying || currentFloor <= 1) return;

        try {
            const res = await fetch("/api/tower/cashout", {
                method: "POST",
                headers: { "Content-Type": "application/json", "Authorization": `Bearer ${token}` },
                body: JSON.stringify({ game_id: currentGameId })
            });

            const data = await res.json();
            if (!res.ok) return alert(data.detail || "エラーが発生しました");

            isPlaying = false;
            const statusEl = document.getElementById("game-status");
            statusEl.innerText = `💰 脳汁利確成功！！ +${data.payout} Gold 獲得！！ 🎉`;

            triggerWinEffects();
            await loadWallets();
            updateUIState();

        } catch (e) {
            console.error(e);
            alert("通信エラーが発生しました");
        }
    }

    function scrollToActiveFloor() {
        const activeRow = document.getElementById(`floor-row-${currentFloor}`);
        if (activeRow) {
            activeRow.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }
    }

    function updateUIState() {
        document.getElementById("start-btn").disabled = isPlaying;
        document.getElementById("wallet-select").disabled = isPlaying;
        document.getElementById("bet-amount").disabled = isPlaying;
        document.getElementById("cashout-btn").disabled = !isPlaying || currentFloor <= 1;

        const mult = isPlaying && currentFloor > 1 ? getMultiplier(currentFloor - 1) : (isPlaying ? 1.0 : 0);
        const payout = Math.floor(activeBetAmount * mult);
        document.getElementById("stat-multiplier").innerText = mult.toFixed(2) + "x";
        document.getElementById("stat-payout").innerText = payout + " G";

        for (let f = 1; f <= TOTAL_FLOORS; f++) {
            const row = document.getElementById(`floor-row-${f}`);
            if (!row) continue;
            
            const buttons = row.querySelectorAll(".tile-btn");
            row.classList.remove("active", "cleared");

            if (f === currentFloor && isPlaying) {
                row.classList.add("active");
                buttons.forEach(btn => {
                    if (!btn.classList.contains("safe") && !btn.classList.contains("trap")) {
                        btn.disabled = false;
                    }
                });
            } else {
                if (f < currentFloor) row.classList.add("cleared");
                buttons.forEach(btn => btn.disabled = true);
            }
        }
    }

    function escapeHtml(str) { 
        return str ? str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;") : ''; 
    }
</script>

</body>
</html>
