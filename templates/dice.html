<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>村岡王国 - サイコロ勝負 (Dice)</title>
    <style>
        body { 
            font-family: sans-serif; 
            background: radial-gradient(circle at center, #221a0f 0%, #0d0d0d 100%); 
            color: #e0e0e0; 
            display: flex; 
            justify-content: center; 
            padding: 20px 0; 
            margin: 0; 
            min-height: 100vh;
        }
        .container { width: 380px; display: flex; flex-direction: column; gap: 16px; }
        .card { 
            background: rgba(35, 30, 25, 0.95); 
            border: 2px solid #d4af37; 
            border-radius: 16px; 
            padding: 20px; 
            box-shadow: 0 0 25px rgba(212, 175, 55, 0.25), inset 0 0 10px rgba(0,0,0,0.8); 
        }
        .header { 
            font-size: 1.1rem; 
            font-weight: bold; 
            color: #ffd700; 
            text-align: center; 
            border-bottom: 2px solid #d4af37; 
            padding-bottom: 8px; 
            margin-bottom: 12px; 
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }
        
        .label { font-size: 0.8rem; color: #aaa; margin-top: 6px; display: block; }
        input, select { width: 100%; padding: 8px; border-radius: 6px; border: 1px solid #444; background: #333; color: #fff; box-sizing: border-box; margin-top: 4px; margin-bottom: 10px; font-size: 0.85rem; font-family: sans-serif; }
        
        button { width: 100%; padding: 10px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; background: #d4af37; color: #1a1a1a; font-size: 0.9rem; margin-top: 4px; }
        button:hover { background: #f1c40f; }
        
        .btn-roll { 
            background: linear-gradient(180deg, #e74c3c 0%, #900c3f 100%); 
            color: #fff; 
            font-size: 1.0rem; 
            padding: 12px; 
            box-shadow: 0 0 12px rgba(231, 76, 60, 0.4);
            text-shadow: 0 1px 2px rgba(0,0,0,0.5);
        }
        .btn-roll:hover { 
            background: linear-gradient(180deg, #ff5733 0%, #a00d40 100%); 
            box-shadow: 0 0 18px rgba(255, 87, 51, 0.6);
        }
        .btn-roll:disabled { background: #555; box-shadow: none; cursor: not-allowed; }

        .btn-auto {
            background: linear-gradient(180deg, #27ae60 0%, #1e8449 100%);
            color: #fff;
            margin-top: 8px;
        }
        .btn-auto:hover { background: linear-gradient(180deg, #2ecc71 0%, #25a25a 100%); }
        .btn-auto.active { background: #c0392b; }
        
        .btn-back { background: #333; color: #aaa; margin-top: 8px; border: 1px solid #555; }
        .btn-back:hover { background: #444; color: #fff; }

        /* ダイス結果ディスプレイ */
        .dice-display { background: #151515; border: 2px dashed #d4af37; border-radius: 10px; padding: 16px; text-align: center; margin-bottom: 12px; }
        .dice-number { font-size: 2.8rem; font-weight: bold; font-family: monospace; color: #888; letter-spacing: 2px; }
        .dice-status { font-size: 0.85rem; margin-top: 4px; height: 20px; font-weight: bold; }
        
        /* 確率・倍率ステータスボード */
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; background: #202020; border-radius: 8px; padding: 10px; margin-bottom: 12px; border: 1px solid #333; }
        .stat-box { text-align: center; }
        .stat-label { font-size: 0.7rem; color: #888; }
        .stat-val { font-size: 1.0rem; font-weight: bold; color: #f39c12; margin-top: 2px; }

        /* スライダー */
        input[type=range] { width: 100%; height: 8px; border-radius: 4px; background: #444; outline: none; margin: 8px 0 12px 0; }
        
        /* モード切り替えボタン */
        .mode-selector { display: flex; gap: 8px; margin-bottom: 10px; }
        .mode-btn { flex: 1; padding: 8px; font-size: 0.8rem; background: #333; color: #aaa; border: 1px solid #444; border-radius: 6px; cursor: pointer; text-align: center; }
        .mode-btn.active { background: #2980b9; color: #fff; border-color: #3498db; font-weight: bold; }

        /* オプション設定パネル */
        .option-box { background: #222; border: 1px solid #444; border-radius: 8px; padding: 10px; margin-top: 10px; margin-bottom: 10px; }
        .checkbox-label { display: flex; align-items: center; gap: 8px; font-size: 0.8rem; color: #ddd; cursor: pointer; margin: 0; }
        .checkbox-label input[type=checkbox] { width: auto; margin: 0; }
        .auto-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 6px; }
        .auto-grid .label { margin-top: 2px; font-size: 0.7rem; }
        .auto-grid input { margin-bottom: 4px; }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <div class="header">🎲 ハイローラー・ダイス（Dice）</div>
        <p style="font-size: 0.75rem; color: #aaa; margin-top: 0; line-height: 1.4; text-align: center;">
            0 〜 10000 の出目を予想せよ！目標数値を設定して一獲千金を狙え！
        </p>

        <!-- 1. 出目・結果表示エリア -->
        <div class="dice-display">
            <div id="dice-num" class="dice-number">????</div>
            <div id="dice-status" class="dice-status" style="color: #aaa;">ベットしてサイコロを振ってください</div>
        </div>

        <!-- 2. 確率・倍率表示エリア -->
        <div class="stats-grid">
            <div class="stat-box">
                <div class="stat-label">配当倍率</div>
                <div id="stat-multiplier" class="stat-val">1.93x</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">勝利確率</div>
                <div id="stat-chance" class="stat-val">50.00%</div>
            </div>
        </div>

        <!-- 3. ゲーム条件設定エリア -->
        <div class="label">勝利条件</div>
        <div class="mode-selector">
            <div id="mode-under" class="mode-btn active">UNDER (未満)</div>
            <div id="mode-over" class="mode-btn">OVER (超え)</div>
        </div>

        <div class="label" style="display: flex; justify-content: space-between;">
            <span>ターゲット値: <b id="target-val-text" style="color: #f39c12;">5000</b></span>
            <span id="condition-desc" style="color: #3498db;">5000 未満で勝利</span>
        </div>
        <input type="range" id="target-slider" min="100" max="9500" step="50" value="5000">

        <!-- 4. 口座・賭け金入力エリア -->
        <div class="label">支払口座を選択</div>
        <select id="wallet-select"></select>

        <div class="label">賭け金 (Gold)</div>
        <input type="number" id="bet-amount" min="10" value="100" placeholder="例: 100">

        <!-- 5. ベットアクションボタン -->
        <button id="roll-btn" class="btn-roll">🎲 サイコロを振る</button>

        <!-- 6. 詳細オプション・自動設定パネル -->
        <div class="option-box">
            <label class="checkbox-label">
                <input type="checkbox" id="skip-anim">
                <span>⚡ 演出をスキップ（即時判定）</span>
            </label>

            <div style="border-top: 1px dashed #444; margin: 8px 0;"></div>

            <div style="font-size: 0.75rem; font-weight: bold; color: #ffd700;">🤖 自動ベット設定</div>
            <div class="auto-grid">
                <div>
                    <span class="label">実行回数 (0で無制限)</span>
                    <input type="number" id="auto-count" value="10" min="0" placeholder="例: 10">
                </div>
                <div>
                    <span class="label">間隔 (ミリ秒 / 最低500)</span>
                    <input type="number" id="auto-interval" value="600" min="500" step="100" placeholder="600">
                </div>
                <div>
                    <span class="label">損切り (以下で停止)</span>
                    <input type="number" id="stop-loss" value="0" min="0" placeholder="0">
                </div>
                <div>
                    <span class="label">利確 (以上で停止)</span>
                    <input type="number" id="take-profit" value="0" min="0" placeholder="0">
                </div>
            </div>

            <button id="auto-btn" class="btn-auto">▶ 自動賭けスタート</button>
        </div>
    </div>

    <!-- 戻るボタン -->
    <button class="btn-back" onclick="location.href='/casino'">◀ カジノ一覧に戻る</button>
</div>

<script>
    const token = localStorage.getItem("access_token");
    if (!token) {
        window.location.href = "/";
    } else {
        loadWallets();
        setupEventListeners();
    }

    let currentMode = "UNDER";
    let isAutoRunning = false;
    let autoTimer = null;
    let executedCount = 0;
    let myWalletsData = [];

    async function loadWallets() {
        try {
            const res = await fetch("/api/wallets", { headers: { "Authorization": `Bearer ${token}` } });
            if (!res.ok) return;
            myWalletsData = await res.json();
            
            const select = document.getElementById("wallet-select");
            const currentSelected = select.value;

            select.innerHTML = myWalletsData.map(w => `
                <option value="${w.wallet_id}">${escapeHtml(w.wallet_name)} (${w.wallet_id}) - 残高:${w.balance}G</option>
            `).join('');

            if (currentSelected && myWalletsData.some(w => w.wallet_id === currentSelected)) {
                select.value = currentSelected;
            }

            calculateStats();
        } catch (e) {
            console.error(e);
        }
    }

    function setupEventListeners() {
        document.getElementById("mode-under").addEventListener("click", () => setMode("UNDER"));
        document.getElementById("mode-over").addEventListener("click", () => setMode("OVER"));
        document.getElementById("target-slider").addEventListener("input", onSliderChange);
        document.getElementById("bet-amount").addEventListener("input", calculateStats);
        document.getElementById("roll-btn").addEventListener("click", () => playDice(false));
        document.getElementById("auto-btn").addEventListener("click", toggleAutoBet);
    }

    function setMode(mode) {
        if (isAutoRunning) return;
        currentMode = mode;
        document.getElementById("mode-under").classList.toggle("active", mode === "UNDER");
        document.getElementById("mode-over").classList.toggle("active", mode === "OVER");
        calculateStats();
    }

    function onSliderChange() {
        const val = document.getElementById("target-slider").value;
        document.getElementById("target-val-text").innerText = val;
        calculateStats();
    }

    function calculateStats() {
        const target = parseInt(document.getElementById("target-slider").value, 10);
        let winChancePercent = 0;

        if (currentMode === "UNDER") {
            winChancePercent = (target / 10000) * 100;
            document.getElementById("condition-desc").innerText = `${target} 未満で勝利`;
        } else {
            winChancePercent = ((10000 - target) / 10000) * 100;
            document.getElementById("condition-desc").innerText = `${target} 超えで勝利`;
        }

        let multiplier = (96.5 / winChancePercent);
        if (multiplier < 1.01) multiplier = 1.01;

        document.getElementById("stat-multiplier").innerText = multiplier.toFixed(2) + "x";
        document.getElementById("stat-chance").innerText = winChancePercent.toFixed(2) + "%";
    }

    function toggleAutoBet() {
        if (isAutoRunning) {
            stopAutoBet("ユーザーによって停止されました");
        } else {
            startAutoBet();
        }
    }

    function startAutoBet() {
        const wallet_id = document.getElementById("wallet-select").value;
        const amount = parseInt(document.getElementById("bet-amount").value, 10);

        if (!wallet_id) return alert("口座を選択してください");
        if (!amount || amount <= 0) return alert("賭け金を正しく入力してください");

        isAutoRunning = true;
        executedCount = 0;

        const autoBtn = document.getElementById("auto-btn");
        autoBtn.innerText = "■ 自動賭けを停止";
        autoBtn.classList.add("active");
        
        toggleInputsDisabled(true);
        runAutoLoop();
    }

    function stopAutoBet(reason) {
        isAutoRunning = false;
        if (autoTimer) clearTimeout(autoTimer);

        const autoBtn = document.getElementById("auto-btn");
        autoBtn.innerText = "▶ 自動賭けスタート";
        autoBtn.classList.remove("active");

        toggleInputsDisabled(false);

        if (reason) {
            const statusEl = document.getElementById("dice-status");
            statusEl.innerText = `[自動賭け終了] ${reason}`;
            statusEl.style.color = "#f39c12";
        }
    }

    function toggleInputsDisabled(disabled) {
        document.getElementById("roll-btn").disabled = disabled;
        document.getElementById("wallet-select").disabled = disabled;
        document.getElementById("bet-amount").disabled = disabled;
        document.getElementById("target-slider").disabled = disabled;
        document.getElementById("skip-anim").disabled = disabled;
        document.getElementById("auto-count").disabled = disabled;
        document.getElementById("auto-interval").disabled = disabled;
        document.getElementById("stop-loss").disabled = disabled;
        document.getElementById("take-profit").disabled = disabled;
    }

    async function runAutoLoop() {
        if (!isAutoRunning) return;

        const wallet_id = document.getElementById("wallet-select").value;
        const currentWallet = myWalletsData.find(w => w.wallet_id === wallet_id);
        const currentBalance = currentWallet ? currentWallet.balance : 0;

        const maxCount = parseInt(document.getElementById("auto-count").value, 10) || 0;
        const stopLoss = parseInt(document.getElementById("stop-loss").value, 10) || 0;
        const takeProfit = parseInt(document.getElementById("take-profit").value, 10) || 0;

        if (maxCount > 0 && executedCount >= maxCount) {
            stopAutoBet(`指定回数 (${maxCount}回) に達しました`);
            return;
        }

        if (stopLoss > 0 && currentBalance <= stopLoss) {
            stopAutoBet(`損切りライン (${stopLoss}G 以下) に達しました`);
            return;
        }

        if (takeProfit > 0 && currentBalance >= takeProfit) {
            stopAutoBet(`利確ライン (${takeProfit}G 以上) に達しました`);
            return;
        }

        const success = await playDice(true);
        if (!success || !isAutoRunning) return;

        executedCount++;

        let interval = parseInt(document.getElementById("auto-interval").value, 10) || 600;
        if (interval < 500) interval = 500;

        autoTimer = setTimeout(runAutoLoop, interval);
    }

    async function playDice(isAutoCall = false) {
        const wallet_id = document.getElementById("wallet-select").value;
        const amount = parseInt(document.getElementById("bet-amount").value, 10);
        const target = parseInt(document.getElementById("target-slider").value, 10);
        const skipAnim = document.getElementById("skip-anim").checked;

        if (!wallet_id) { alert("口座を選択してください"); return false; }
        if (!amount || amount <= 0) { alert("賭け金を正しく入力してください"); return false; }

        const rollBtn = document.getElementById("roll-btn");
        const diceNumEl = document.getElementById("dice-num");
        const statusEl = document.getElementById("dice-status");

        if (!isAutoCall) rollBtn.disabled = true;
        statusEl.style.color = "#aaa";
        statusEl.innerText = "サイコロを振っています...";

        let animInterval = null;
        if (!skipAnim) {
            animInterval = setInterval(() => {
                diceNumEl.innerText = Math.floor(Math.random() * 10001);
                diceNumEl.style.color = "#888";
            }, 50);
        }

        try {
            const res = await fetch("/api/dice/play", {
                method: "POST",
                headers: { "Content-Type": "application/json", "Authorization": `Bearer ${token}` },
                body: JSON.stringify({ wallet_id, amount, target, mode: currentMode })
            });

            const data = await res.json();
            const delay = skipAnim ? 0 : 500;

            return await new Promise((resolve) => {
                setTimeout(async () => {
                    if (animInterval) clearInterval(animInterval);
                    if (!isAutoCall && !isAutoRunning) rollBtn.disabled = false;

                    if (!res.ok) {
                        diceNumEl.innerText = "----";
                        statusEl.style.color = "#e74c3c";
                        statusEl.innerText = "エラー: " + data.detail;
                        if (isAutoRunning) stopAutoBet("エラーが発生したため停止しました");
                        resolve(false);
                        return;
                    }

                    diceNumEl.innerText = data.roll;

                    if (data.is_win) {
                        diceNumEl.style.color = "#2ecc71";
                        statusEl.style.color = "#2ecc71";
                        statusEl.innerText = `🎉 勝利！ +${data.payout} Gold 獲得！`;
                    } else {
                        diceNumEl.style.color = "#e74c3c";
                        statusEl.style.color = "#e74c3c";
                        statusEl.innerText = `💀 敗北... ${amount} Gold 没収`;
                    }

                    await loadWallets();
                    resolve(true);
                }, delay);
            });

        } catch (e) {
            if (animInterval) clearInterval(animInterval);
            if (!isAutoCall && !isAutoRunning) rollBtn.disabled = false;
            console.error(e);
            if (isAutoRunning) stopAutoBet("通信エラーのため停止しました");
            resolve(false);
        }
    }

    function escapeHtml(str) { return str ? str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;") : ''; }
</script>

</body>
</html>
