<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>村岡王国 - サイコロ勝負 (Dice)</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Black+Ops+One&family=M+PLUS+1p:wght@800;900&display=swap');

        :root {
            --neon-pink: #ff007f;
            --neon-cyan: #00f3ff;
            --neon-yellow: #ffe600;
            --neon-green: #00ff66;
            --neon-red: #ff003c;
        }

        body { 
            font-family: 'M PLUS 1p', 'Black Ops One', sans-serif; 
            background: #000;
            background-image: 
                radial-gradient(circle at 50% 20%, #220033 0%, #000000 80%),
                linear-gradient(0deg, rgba(255, 0, 127, 0.1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 243, 255, 0.1) 1px, transparent 1px);
            background-size: 100% 100%, 20px 20px, 20px 20px;
            color: #fff; 
            display: flex; 
            justify-content: center; 
            align-items: center;
            padding: 10px; 
            margin: 0; 
            min-height: 100vh;
            box-sizing: border-box;
            overflow-x: hidden;
        }

        .container { 
            width: 100%;
            max-width: 380px; 
            display: flex; 
            flex-direction: column; 
            gap: 10px; 
            box-sizing: border-box;
        }

        .card { 
            background: rgba(15, 5, 25, 0.95); 
            border: 2px solid var(--neon-pink); 
            border-radius: 20px; 
            padding: 14px; 
            box-shadow: 0 0 20px rgba(255, 0, 127, 0.5); 
            position: relative;
            overflow: hidden;
        }

        .header { 
            font-size: 1.3rem; 
            font-weight: 900; 
            color: var(--neon-yellow); 
            text-align: center; 
            border-bottom: 2px solid var(--neon-cyan); 
            padding-bottom: 4px; 
            margin-bottom: 6px; 
            text-shadow: 0 0 10px var(--neon-yellow);
            letter-spacing: 1px;
        } 
        
        .label { 
            font-size: 0.75rem; 
            color: var(--neon-cyan); 
            margin-top: 6px; 
            display: block; 
            font-weight: 900;
            text-shadow: 0 0 4px var(--neon-cyan);
        }

        input, select { 
            width: 100%; 
            padding: 8px 10px; 
            border-radius: 10px; 
            border: 2px solid var(--neon-cyan); 
            background: rgba(10, 10, 20, 0.9); 
            color: #fff; 
            box-sizing: border-box; 
            margin-top: 3px; 
            margin-bottom: 6px; 
            font-size: 0.9rem; 
            font-weight: bold;
            font-family: inherit; 
            outline: none;
        }

        input:focus, select:focus {
            border-color: var(--neon-pink);
            box-shadow: 0 0 10px var(--neon-pink);
        }
        
        button { 
            width: 100%; 
            padding: 10px; 
            border: none; 
            border-radius: 12px; 
            font-weight: 900; 
            cursor: pointer; 
            background: var(--neon-yellow); 
            color: #000; 
            font-size: 0.95rem; 
            margin-top: 4px; 
            box-shadow: 0 0 12px var(--neon-yellow);
            user-select: none;
        }

        button:active:not(:disabled) {
            transform: scale(0.95);
            filter: brightness(1.3);
        }
        
        .btn-roll { 
            background: linear-gradient(135deg, #ff0055 0%, #ff00a0 50%, #7928ca 100%); 
            color: #fff; 
            font-size: 1.2rem; 
            padding: 14px; 
            border-radius: 14px;
            box-shadow: 0 0 25px var(--neon-pink);
            text-shadow: 0 0 5px #fff;
            border: 2px solid #fff;
            animation: pulse-btn 1.5s infinite;
        }

        @keyframes pulse-btn {
            0% { box-shadow: 0 0 15px var(--neon-pink); }
            50% { box-shadow: 0 0 30px var(--neon-pink), 0 0 10px var(--neon-cyan); }
            100% { box-shadow: 0 0 15px var(--neon-pink); }
        }

        .btn-roll:disabled { 
            background: #333; 
            box-shadow: none; 
            cursor: not-allowed; 
            border: none;
            color: #666;
            animation: none;
            transform: none !important;
        }

        .btn-auto {
            background: linear-gradient(135deg, #00ff66 0%, #009933 100%);
            color: #000;
            font-size: 0.95rem;
            margin-top: 8px;
            box-shadow: 0 0 12px var(--neon-green);
        }

        .btn-auto.active { 
            background: linear-gradient(135deg, #ff003c 0%, #990000 100%); 
            color: #fff;
            box-shadow: 0 0 20px var(--neon-red);
            animation: pulse-auto 0.6s infinite alternate;
        }

        @keyframes pulse-auto {
            from { filter: brightness(1); }
            to { filter: brightness(1.4); }
        }
        
        .btn-back { 
            background: #111; 
            color: #888; 
            margin-top: 4px; 
            border: 1px solid #333; 
            font-size: 0.8rem;
            padding: 8px;
            box-shadow: none;
        }

        /* 🎰 サイコロ結果エリア */
        .dice-display { 
            background: #000; 
            border: 2px solid var(--neon-cyan); 
            border-radius: 16px; 
            padding: 10px 8px; 
            text-align: center; 
            margin-bottom: 8px; 
            box-shadow: inset 0 0 15px rgba(0, 243, 255, 0.4);
            position: relative;
            will-change: transform;
        }

        .dice-number { 
            font-size: 3rem; 
            font-weight: 900; 
            font-family: 'Black Ops One', monospace; 
            color: var(--neon-yellow); 
            letter-spacing: 2px; 
            text-shadow: 0 0 15px var(--neon-yellow);
            line-height: 1.1;
            margin: 2px 0;
            display: inline-block;
            will-change: transform, color, text-shadow;
        }

        .dice-status { 
            font-size: 0.85rem; 
            margin-top: 2px; 
            min-height: 20px; 
            font-weight: 900; 
            text-shadow: 0 0 6px currentColor;
        }
        
        /* 📊 ネオンステータスボード */
        .stats-grid { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 8px; 
            background: rgba(0, 0, 0, 0.5); 
            border-radius: 12px; 
            padding: 6px; 
            margin-bottom: 8px; 
        }

        .stat-box { 
            text-align: center; 
            background: rgba(20, 20, 35, 0.8);
            padding: 6px;
            border-radius: 10px;
            border: 1px solid rgba(0, 243, 255, 0.2);
        }

        .stat-label { font-size: 0.7rem; color: #aaa; font-weight: bold; }
        .stat-val { font-size: 1.1rem; font-weight: 900; color: var(--neon-green); margin-top: 1px; text-shadow: 0 0 8px var(--neon-green); }

        /* スライダー */
        input[type=range] { 
            -webkit-appearance: none;
            width: 100%; 
            height: 10px; 
            border-radius: 5px; 
            background: #1a1a2e; 
            outline: none; 
            margin: 6px 0 10px 0; 
            border: 1px solid var(--neon-cyan);
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: var(--neon-yellow);
            cursor: pointer;
            box-shadow: 0 0 10px var(--neon-yellow);
            border: 2px solid #fff;
        }
        
        /* モード切り替えボタン */
        .mode-selector { display: flex; gap: 8px; margin-bottom: 6px; }
        .mode-btn { 
            flex: 1; 
            padding: 8px; 
            font-size: 0.8rem; 
            font-weight: 900;
            background: #111; 
            color: #666; 
            border: 2px solid #333; 
            border-radius: 10px; 
            cursor: pointer; 
            text-align: center; 
        }

        .mode-btn.active { 
            background: linear-gradient(135deg, #00f3ff 0%, #0066ff 100%); 
            color: #fff; 
            border-color: #fff; 
            box-shadow: 0 0 12px var(--neon-cyan);
        }

        /* ⚙️ オプション設定パネル */
        .option-box { 
            background: rgba(10, 10, 15, 0.95); 
            border: 1.5px solid var(--neon-pink); 
            border-radius: 14px; 
            padding: 10px; 
            margin-top: 8px; 
        }

        .checkbox-label { 
            display: flex; 
            align-items: center; 
            gap: 6px; 
            font-size: 0.78rem; 
            font-weight: bold;
            color: #fff; 
            cursor: pointer; 
            margin-bottom: 4px;
        }

        .checkbox-label input[type=checkbox] { 
            width: 16px; 
            height: 16px; 
            margin: 0; 
            accent-color: var(--neon-pink);
        }

        .auto-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 6px; }
        .auto-grid .label { margin-top: 0; font-size: 0.65rem; color: #bbb; }
        .auto-grid input { margin-bottom: 0; padding: 6px; font-size: 0.8rem; }

        /* 🌈 脳汁ドバドバ！勝ったら虹色に光り揺れる演出 🌈 */
        .win-rainbow-shake {
            animation: rainbow-glow 0.4s linear infinite, win-shake-anim 0.2s ease-in-out infinite alternate;
        }

        .win-rainbow-noshake {
            animation: rainbow-glow 0.4s linear infinite;
        }

        .win-text-rainbow {
            animation: rainbow-text 0.2s linear infinite;
        }

        /* 🔥 数字飛び出しエフェクト */
        .num-pop {
            animation: pop-bounce 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes pop-bounce {
            0% { transform: scale(1); }
            50% { transform: scale(1.45); text-shadow: 0 0 30px #ffffff, 0 0 50px var(--neon-pink); }
            100% { transform: scale(1); }
        }

        .lose-shake {
            animation: lose-shake-anim 0.2s ease-in-out 2;
            border-color: var(--neon-red) !important;
        }

        @keyframes rainbow-glow {
            0% { border-color: #ff0000; box-shadow: 0 0 25px #ff0000, inset 0 0 15px #ff0000; }
            20% { border-color: #ffff00; box-shadow: 0 0 25px #ffff00, inset 0 0 15px #ffff00; }
            40% { border-color: #00ff00; box-shadow: 0 0 25px #00ff00, inset 0 0 15px #00ff00; }
            60% { border-color: #00ffff; box-shadow: 0 0 25px #00ffff, inset 0 0 15px #00ffff; }
            80% { border-color: #ff00ff; box-shadow: 0 0 25px #ff00ff, inset 0 0 15px #ff00ff; }
            100% { border-color: #ff0000; box-shadow: 0 0 25px #ff0000, inset 0 0 15px #ff0000; }
        }

        @keyframes rainbow-text {
            0% { color: #ff0055; text-shadow: 0 0 15px #ff0055; }
            25% { color: #ffe600; text-shadow: 0 0 15px #ffe600; }
            50% { color: #00ff66; text-shadow: 0 0 15px #00ff66; }
            75% { color: #00f3ff; text-shadow: 0 0 15px #00f3ff; }
            100% { color: #ff00a0; text-shadow: 0 0 15px #ff00a0; }
        }

        @keyframes win-shake-anim {
            0% { transform: scale(1) rotate(0deg); }
            50% { transform: scale(1.05) rotate(-1.5deg); }
            100% { transform: scale(1.05) rotate(1.5deg); }
        }

        @keyframes lose-shake-anim {
            0% { transform: translateX(0); }
            25% { transform: translateX(-6px); }
            75% { transform: translateX(6px); }
            100% { transform: translateX(0); }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="card" id="main-card">
        <div class="header">🚨 脳汁全開！DICE 🚨</div>
        <p style="font-size: 0.75rem; color: #00f3ff; font-weight: bold; margin: 0 0 6px 0; text-align: center; text-shadow: 0 0 4px #00f3ff;">
            ⚡ 神引き連発！全財産溶かして脳汁を出せ！ ⚡
        </p>

        <!-- 1. 出目・結果表示エリア -->
        <div class="dice-display" id="dice-display-box">
            <div id="dice-num" class="dice-number">????</div>
            <div id="dice-status" class="dice-status" style="color: #00f3ff;">💰 ぶち込んで運命のダイスを回せ！！</div>
        </div>

        <!-- 2. 確率・倍率表示エリア -->
        <div class="stats-grid">
            <div class="stat-box">
                <div class="stat-label">🔥 配当倍率</div>
                <div id="stat-multiplier" class="stat-val">1.93x</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">🎯 勝利確率</div>
                <div id="stat-chance" class="stat-val">50.00%</div>
            </div>
        </div>

        <!-- 3. ゲーム条件設定エリア -->
        <div class="label">⚔️ 勝利条件ターゲット</div>
        <div class="mode-selector">
            <div id="mode-under" class="mode-btn active">UNDER (未満)</div>
            <div id="mode-over" class="mode-btn">OVER (超え)</div>
        </div>

        <div class="label" style="display: flex; justify-content: space-between; align-items: center;">
            <span>ターゲット: <b id="target-val-text" style="color: var(--neon-yellow); font-size: 0.95rem; text-shadow: 0 0 6px var(--neon-yellow);">5000</b></span>
            <span id="condition-desc" style="color: var(--neon-cyan); font-weight: bold;">5000 未満で勝利</span>
        </div>
        <input type="range" id="target-slider" min="100" max="9500" step="50" value="5000">

        <!-- 4. 口座・賭け金入力エリア -->
        <div class="label">💳 支払口座</div>
        <select id="wallet-select"></select>

        <div class="label">💎 賭け金 (Gold)</div>
        <input type="number" id="bet-amount" min="10" value="10" placeholder="例: 10">

        <!-- 5. ベットアクションボタン -->
        <button id="roll-btn" class="btn-roll">🎲 脳汁ダイスを回転！！</button>

        <!-- 6. 詳細オプション・自動設定パネル -->
        <div class="option-box">
            <label class="checkbox-label">
                <input type="checkbox" id="bgm-toggle">
                <span>🎵 BGM ON</span>
            </label>

            <label class="checkbox-label">
                <input type="checkbox" id="disable-shake">
                <span>🚫 画面の揺れ・飛び出し演出をオフにする</span>
            </label>

            <label class="checkbox-label">
                <input type="checkbox" id="skip-anim">
                <span>⚡ 爆速演出スキップ（即時判定）</span>
            </label>

            <div style="border-top: 1px dashed var(--neon-pink); margin: 6px 0;"></div>

            <div style="font-size: 0.75rem; font-weight: 900; color: var(--neon-yellow); text-shadow: 0 0 4px var(--neon-yellow);">🤖 無限脳汁！自動連打モード</div>
            <div class="auto-grid">
                <div>
                    <span class="label">実行回数 (0=無限)</span>
                    <input type="number" id="auto-count" value="10" min="0" placeholder="例: 10">
                </div>
                <div>
                    <span class="label">速度 (ms/最低100)</span>
                    <input type="number" id="auto-interval" value="200" min="100" step="50" placeholder="200">
                </div>
                <div>
                    <span class="label">損切りストップ</span>
                    <input type="number" id="stop-loss" value="0" min="0" placeholder="0">
                </div>
                <div>
                    <span class="label">利確ストップ</span>
                    <input type="number" id="take-profit" value="0" min="0" placeholder="0">
                </div>
            </div>

            <button id="auto-btn" class="btn-auto">▶ 超高速・自動ベット爆走スタート</button>
        </div>
    </div>

    <!-- 戻るボタン -->
    <button class="btn-back" onclick="location.href='/casino'">◀ カジノ一覧に戻る</button>
</div>

<audio id="bgm-player" src="/templates/dopa.mp3" loop preload="auto"></audio>

<script>
    const token = localStorage.getItem("access_token");
    if (!token) {
        window.location.href = "/";
    } else {
        loadWallets();
        setupEventListeners();
    }

    let currentMode = "UNDER";
    let isAutoRunning = false;
    let autoTimer = null;
    let executedCount = 0;
    let myWalletsData = [];

    async function loadWallets() {
        try {
            const res = await fetch("/api/wallets", { headers: { "Authorization": `Bearer ${token}` } });
            if (!res.ok) return;
            myWalletsData = await res.json();
            
            const select = document.getElementById("wallet-select");
            const currentSelected = select.value;

            select.innerHTML = myWalletsData.map(w => `
                <option value="${w.wallet_id}">${escapeHtml(w.wallet_name)} (${w.wallet_id}) - 残高:${w.balance}G</option>
            `).join('');

            if (currentSelected && myWalletsData.some(w => w.wallet_id === currentSelected)) {
                select.value = currentSelected;
            }

            calculateStats();
        } catch (e) {
            console.error(e);
        }
    }

    function setupEventListeners() {
        document.getElementById("mode-under").addEventListener("click", () => setMode("UNDER"));
        document.getElementById("mode-over").addEventListener("click", () => setMode("OVER"));
        document.getElementById("target-slider").addEventListener("input", onSliderChange);
        document.getElementById("bet-amount").addEventListener("input", calculateStats);
        document.getElementById("roll-btn").addEventListener("click", () => playDice(false));
        document.getElementById("auto-btn").addEventListener("click", toggleAutoBet);

        document.addEventListener("keydown", (e) => {
            if (e.key === "Enter") {
                const rollBtn = document.getElementById("roll-btn");
                if (!rollBtn.disabled) {
                    playDice(false);
                }
            }
        });

        const bgmPlayer = document.getElementById("bgm-player");
        const bgmToggle = document.getElementById("bgm-toggle");

        bgmToggle.addEventListener("change", (e) => {
            if (e.target.checked) {
                bgmPlayer.play().catch(err => console.log("再生ブロック解除待ち:", err));
            } else {
                bgmPlayer.pause();
            }
        });

        document.addEventListener("click", function startAudioOnFirstUserGesture() {
            if (bgmToggle.checked && bgmPlayer.paused) {
                bgmPlayer.play().catch(() => {});
            }
        }, { once: true });
    }

    function setMode(mode) {
        if (isAutoRunning) return;
        currentMode = mode;
        document.getElementById("mode-under").classList.toggle("active", mode === "UNDER");
        document.getElementById("mode-over").classList.toggle("active", mode === "OVER");
        calculateStats();
    }

    function onSliderChange() {
        const val = document.getElementById("target-slider").value;
        document.getElementById("target-val-text").innerText = val;
        calculateStats();
    }

    function calculateStats() {
        const target = parseInt(document.getElementById("target-slider").value, 10);
        let winChancePercent = 0;

        if (currentMode === "UNDER") {
            winChancePercent = (target / 10000) * 100;
            document.getElementById("condition-desc").innerText = `${target} 未満で勝利`;
        } else {
            winChancePercent = ((10000 - target) / 10000) * 100;
            document.getElementById("condition-desc").innerText = `${target} 超えで勝利`;
        }

        let multiplier = (96.5 / winChancePercent);
        if (multiplier < 1.01) multiplier = 1.01;

        document.getElementById("stat-multiplier").innerText = multiplier.toFixed(2) + "x";
        document.getElementById("stat-chance").innerText = winChancePercent.toFixed(2) + "%";
    }

    function toggleAutoBet() {
        if (isAutoRunning) {
            stopAutoBet("ユーザーによって停止されました");
        } else {
            startAutoBet();
        }
    }

    function startAutoBet() {
        const wallet_id = document.getElementById("wallet-select").value;
        const amount = parseInt(document.getElementById("bet-amount").value, 10);

        if (!wallet_id) return alert("口座を選択してください");
        if (!amount || amount <= 0) return alert("賭け金を正しく入力してください");

        isAutoRunning = true;
        executedCount = 0;

        const autoBtn = document.getElementById("auto-btn");
        autoBtn.innerText = "■ 自動賭けを停止";
        autoBtn.classList.add("active");
        
        toggleInputsDisabled(true);
        runAutoLoop();
    }

    function stopAutoBet(reason) {
        isAutoRunning = false;
        if (autoTimer) clearTimeout(autoTimer);

        const autoBtn = document.getElementById("auto-btn");
        autoBtn.innerText = "▶ 超高速・自動ベット爆走スタート";
        autoBtn.classList.remove("active");

        toggleInputsDisabled(false);

        if (reason) {
            const statusEl = document.getElementById("dice-status");
            statusEl.innerText = `[自動賭け終了] ${reason}`;
            statusEl.style.color = "#ffe600";
        }
    }

    function toggleInputsDisabled(disabled) {
        document.getElementById("roll-btn").disabled = disabled;
        document.getElementById("wallet-select").disabled = disabled;
        document.getElementById("bet-amount").disabled = disabled;
        document.getElementById("target-slider").disabled = disabled;
        document.getElementById("skip-anim").disabled = disabled;
        document.getElementById("disable-shake").disabled = disabled;
        document.getElementById("auto-count").disabled = disabled;
        document.getElementById("auto-interval").disabled = disabled;
        document.getElementById("stop-loss").disabled = disabled;
        document.getElementById("take-profit").disabled = disabled;
    }

    async function runAutoLoop() {
        if (!isAutoRunning) return;

        const wallet_id = document.getElementById("wallet-select").value;
        const currentWallet = myWalletsData.find(w => w.wallet_id === wallet_id);
        const currentBalance = currentWallet ? currentWallet.balance : 0;

        const maxCount = parseInt(document.getElementById("auto-count").value, 10) || 0;
        const stopLoss = parseInt(document.getElementById("stop-loss").value, 10) || 0;
        const takeProfit = parseInt(document.getElementById("take-profit").value, 10) || 0;

        if (maxCount > 0 && executedCount >= maxCount) {
            stopAutoBet(`指定回数 (${maxCount}回) に達しました`);
            return;
        }

        if (stopLoss > 0 && currentBalance <= stopLoss) {
            stopAutoBet(`損切りライン (${stopLoss}G 以下) に達しました`);
            return;
        }

        if (takeProfit > 0 && currentBalance >= takeProfit) {
            stopAutoBet(`利確ストップ (${takeProfit}G 以上) に達しました`);
            return;
        }

        const success = await playDice(true);
        if (!success || !isAutoRunning) return;

        executedCount++;

        let interval = parseInt(document.getElementById("auto-interval").value, 10) || 200;
        if (interval < 50) interval = 50;

        autoTimer = setTimeout(runAutoLoop, interval);
    }

    async function playDice(isAutoCall = false) {
        const wallet_id = document.getElementById("wallet-select").value;
        const amount = parseInt(document.getElementById("bet-amount").value, 10);
        const target = parseInt(document.getElementById("target-slider").value, 10);
        const skipAnim = document.getElementById("skip-anim").checked;
        const disableShake = document.getElementById("disable-shake").checked;

        if (!wallet_id) { alert("口座を選択してください"); return false; }
        if (!amount || amount <= 0) { alert("賭け金を正しく入力してください"); return false; }

        const rollBtn = document.getElementById("roll-btn");
        const diceNumEl = document.getElementById("dice-num");
        const statusEl = document.getElementById("dice-status");
        const displayBox = document.getElementById("dice-display-box");

        // アニメーション初期化
        displayBox.className = "dice-display";
        diceNumEl.className = "dice-number";

        if (!isAutoCall) rollBtn.disabled = true;
        statusEl.style.color = "#00f3ff";
        statusEl.innerText = "🎲 激アツ！ダイス回転中...！";

        let animFrameId = null;
        if (!skipAnim) {
            const updateFastAnim = () => {
                diceNumEl.innerText = Math.floor(Math.random() * 10001);
                diceNumEl.style.color = "#00ff66";
                animFrameId = requestAnimationFrame(updateFastAnim);
            };
            animFrameId = requestAnimationFrame(updateFastAnim);
        }

        try {
            const res = await fetch("/api/dice/play", {
                method: "POST",
                headers: { "Content-Type": "application/json", "Authorization": `Bearer ${token}` },
                body: JSON.stringify({ wallet_id, amount, target, mode: currentMode })
            });

            const data = await res.json();
            const delay = skipAnim ? 0 : 250;

            return await new Promise((resolve) => {
                setTimeout(async () => {
                    if (animFrameId) cancelAnimationFrame(animFrameId);
                    if (!isAutoCall && !isAutoRunning) rollBtn.disabled = false;

                    if (!res.ok) {
                        diceNumEl.innerText = "----";
                        statusEl.style.color = "#ff003c";
                        statusEl.innerText = "💥 エラー: " + data.detail;
                        if (isAutoRunning) stopAutoBet("エラーが発生したため停止しました");
                        resolve(false);
                        return;
                    }

                    diceNumEl.innerText = data.roll;

                    if (data.is_win) {
                        diceNumEl.classList.add("win-text-rainbow");
                        statusEl.style.color = "#00ff66";
                        statusEl.innerText = `🌈👑 脳汁大噴射！！ +${data.payout} Gold 獲得！！ 👑🌈`;
                        
                        if (disableShake) {
                            displayBox.classList.add("win-rainbow-noshake");
                        } else {
                            displayBox.classList.add("win-rainbow-shake");
                            diceNumEl.classList.add("num-pop"); // 💥 飛び出しアニメーション追加
                        }
                    } else {
                        diceNumEl.style.color = "#ff003c";
                        statusEl.style.color = "#ff003c";
                        statusEl.innerText = `💀 爆死... ${amount} Gold 没収！！`;
                        if (!disableShake) {
                            displayBox.classList.add("lose-shake");
                        }
                    }

                    await loadWallets();
                    resolve(true);
                }, delay);
            });

        } catch (e) {
            if (animFrameId) cancelAnimationFrame(animFrameId);
            if (!isAutoCall && !isAutoRunning) rollBtn.disabled = false;
            console.error(e);
            if (isAutoRunning) stopAutoBet("通信エラーのため停止しました");
            resolve(false);
        }
    }

    function escapeHtml(str) { return str ? str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;") : ''; }
</script>
