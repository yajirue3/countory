<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>村岡王国 - サイコロ勝負 (Dice)</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Black+Ops+One&family=M+PLUS+1p:wght@800;900&display=swap');

        :root {
            --neon-pink: #ff007f;
            --neon-cyan: #00f3ff;
            --neon-yellow: #ffe600;
            --neon-green: #00ff66;
            --neon-red: #ff003c;
            --bg-dark: #05020a;
        }

        body { 
            font-family: 'M PLUS 1p', 'Black Ops One', sans-serif; 
            background: #000;
            background-image: 
                radial-gradient(circle at 50% 20%, #20002c 0%, #000000 80%),
                linear-gradient(0deg, rgba(255, 0, 127, 0.1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 243, 255, 0.1) 1px, transparent 1px);
            background-size: 100% 100%, 30px 30px, 30px 30px;
            color: #fff; 
            display: flex; 
            justify-content: center; 
            padding: 10px 0; 
            margin: 0; 
            min-height: 100vh;
            overflow-x: hidden;
        }

        .container { 
            width: 100%;
            max-width: 420px; 
            display: flex; 
            flex-direction: column; 
            gap: 12px; 
            padding: 10px;
            box-sizing: border-box;
        }

        .card { 
            background: rgba(15, 5, 25, 0.9); 
            border: 3px solid var(--neon-pink); 
            border-radius: 24px; 
            padding: 18px; 
            box-shadow: 
                0 0 20px var(--neon-pink),
                inset 0 0 15px rgba(255, 0, 127, 0.4); 
            backdrop-filter: blur(10px);
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255, 255, 255, 0.05), transparent);
            transform: rotate(45deg);
            animation: shine 3s infinite linear;
            pointer-events: none;
        }

        @keyframes shine {
            0% { transform: translateY(-100%) rotate(45deg); }
            100% { transform: translateY(100%) rotate(45deg); }
        }

        .header { 
            font-size: 1.5rem; 
            font-weight: 900; 
            color: var(--neon-yellow); 
            text-align: center; 
            border-bottom: 3px stroke var(--neon-cyan); 
            padding-bottom: 6px; 
            margin-bottom: 8px; 
            text-shadow: 0 0 10px var(--neon-yellow), 0 0 20px #ffaa00, 2px 2px 0px #000;
            letter-spacing: 1px;
            animation: pulse-text 0.8s infinite alternate;
        }

        @keyframes pulse-text {
            0% { transform: scale(1); text-shadow: 0 0 10px var(--neon-yellow); }
            100% { transform: scale(1.03); text-shadow: 0 0 25px var(--neon-yellow), 0 0 40px #ff0055; }
        }
        
        .label { 
            font-size: 0.85rem; 
            color: var(--neon-cyan); 
            margin-top: 8px; 
            display: block; 
            font-weight: 900;
            text-shadow: 0 0 5px var(--neon-cyan);
            letter-spacing: 0.5px;
        }

        input, select { 
            width: 100%; 
            padding: 12px; 
            border-radius: 12px; 
            border: 2px solid var(--neon-cyan); 
            background: rgba(10, 10, 20, 0.9); 
            color: #fff; 
            box-sizing: border-box; 
            margin-top: 4px; 
            margin-bottom: 8px; 
            font-size: 1rem; 
            font-weight: bold;
            font-family: inherit; 
            box-shadow: 0 0 8px rgba(0, 243, 255, 0.3);
            outline: none;
            transition: all 0.2s;
        }

        input:focus, select:focus {
            border-color: var(--neon-pink);
            box-shadow: 0 0 15px var(--neon-pink);
        }
        
        button { 
            width: 100%; 
            padding: 12px; 
            border: none; 
            border-radius: 14px; 
            font-weight: 900; 
            cursor: pointer; 
            background: var(--neon-yellow); 
            color: #000; 
            font-size: 1rem; 
            margin-top: 4px; 
            transition: transform 0.1s, filter 0.2s;
            box-shadow: 0 0 15px var(--neon-yellow);
        }

        button:active {
            transform: scale(0.95);
        }
        
        .btn-roll { 
            background: linear-gradient(135deg, #ff0055 0%, #ff00a0 50%, #7928ca 100%); 
            color: #fff; 
            font-size: 1.4rem; 
            padding: 16px; 
            border-radius: 18px;
            box-shadow: 0 0 25px var(--neon-pink), 0 0 10px #ff0055;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
            letter-spacing: 1.5px;
            animation: roll-btn-glow 1.2s infinite alternate;
            border: 2px solid #fff;
        }

        @keyframes roll-btn-glow {
            0% { box-shadow: 0 0 15px var(--neon-pink); transform: scale(1); }
            100% { box-shadow: 0 0 35px var(--neon-pink), 0 0 15px var(--neon-yellow); transform: scale(1.02); }
        }

        .btn-roll:disabled { 
            background: #333; 
            box-shadow: none; 
            cursor: not-allowed; 
            animation: none;
            border: none;
            color: #666;
        }

        .btn-auto {
            background: linear-gradient(135deg, #00ff66 0%, #009933 100%);
            color: #000;
            font-size: 1.1rem;
            margin-top: 10px;
            box-shadow: 0 0 15px var(--neon-green);
        }

        .btn-auto.active { 
            background: linear-gradient(135deg, #ff003c 0%, #990000 100%); 
            color: #fff;
            box-shadow: 0 0 20px var(--neon-red);
            animation: pulse-red 0.5s infinite alternate;
        }

        @keyframes pulse-red {
            0% { box-shadow: 0 0 10px var(--neon-red); }
            100% { box-shadow: 0 0 30px var(--neon-red); }
        }
        
        .btn-back { 
            background: #111; 
            color: #888; 
            margin-top: 8px; 
            border: 1px solid #333; 
            font-size: 0.85rem;
        }

        /* 🎰 ドーパミン全開ダイスディスプレイ */
        .dice-display { 
            background: #000; 
            border: 3px solid var(--neon-cyan); 
            border-radius: 20px; 
            padding: 16px 10px; 
            text-align: center; 
            margin-bottom: 12px; 
            box-shadow: inset 0 0 20px rgba(0, 243, 255, 0.5), 0 0 15px rgba(0, 243, 255, 0.3);
            position: relative;
            overflow: hidden;
        }

        .dice-number { 
            font-size: 3.8rem; 
            font-weight: 900; 
            font-family: 'Black Ops One', monospace; 
            color: var(--neon-yellow); 
            letter-spacing: 3px; 
            text-shadow: 0 0 20px var(--neon-yellow), 0 0 40px var(--neon-yellow);
            line-height: 1;
            margin: 5px 0;
        }

        .dice-status { 
            font-size: 1rem; 
            margin-top: 6px; 
            min-height: 24px; 
            font-weight: 900; 
            text-shadow: 0 0 8px currentColor;
            letter-spacing: 1px;
        }
        
        /* 📊 ネオンステータスボード */
        .stats-grid { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 10px; 
            background: rgba(0, 0, 0, 0.6); 
            border-radius: 16px; 
            padding: 10px; 
            margin-bottom: 12px; 
            border: 2px solid rgba(255, 255, 255, 0.1); 
        }

        .stat-box { 
            text-align: center; 
            background: rgba(20, 20, 35, 0.8);
            padding: 8px;
            border-radius: 12px;
            border: 1px solid rgba(0, 243, 255, 0.2);
        }

        .stat-label { font-size: 0.75rem; color: #aaa; font-weight: bold; }
        .stat-val { font-size: 1.3rem; font-weight: 900; color: var(--neon-green); margin-top: 2px; text-shadow: 0 0 10px var(--neon-green); }

        /* スライダー */
        input[type=range] { 
            -webkit-appearance: none;
            width: 100%; 
            height: 14px; 
            border-radius: 7px; 
            background: #1a1a2e; 
            outline: none; 
            margin: 10px 0 14px 0; 
            border: 1px solid var(--neon-cyan);
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.3);
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: var(--neon-yellow);
            cursor: pointer;
            box-shadow: 0 0 15px var(--neon-yellow);
            border: 2px solid #fff;
        }
        
        /* 🔀 モード切り替えボタン */
        .mode-selector { display: flex; gap: 10px; margin-bottom: 10px; }
        .mode-btn { 
            flex: 1; 
            padding: 10px; 
            font-size: 0.9rem; 
            font-weight: 900;
            background: #111; 
            color: #666; 
            border: 2px solid #333; 
            border-radius: 12px; 
            cursor: pointer; 
            text-align: center; 
            transition: all 0.2s;
        }
        .mode-btn.active { 
            background: linear-gradient(135deg, #00f3ff 0%, #0066ff 100%); 
            color: #fff; 
            border-color: #fff; 
            box-shadow: 0 0 15px var(--neon-cyan);
            text-shadow: 0 0 5px #000;
        }

        /* ⚙️ オプション設定パネル */
        .option-box { 
            background: rgba(10, 10, 15, 0.95); 
            border: 2px solid var(--neon-pink); 
            border-radius: 16px; 
            padding: 12px; 
            margin-top: 12px; 
            margin-bottom: 10px; 
            box-shadow: 0 0 10px rgba(255, 0, 127, 0.2);
        }

        .checkbox-label { 
            display: flex; 
            align-items: center; 
            gap: 8px; 
            font-size: 0.85rem; 
            font-weight: bold;
            color: #fff; 
            cursor: pointer; 
            margin: 0; 
        }

        .checkbox-label input[type=checkbox] { 
            width: 18px; 
            height: 18px; 
            margin: 0; 
            accent-color: var(--neon-pink);
        }

        .auto-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
        .auto-grid .label { margin-top: 2px; font-size: 0.7rem; color: #bbb; }
        .auto-grid input { margin-bottom: 2px; padding: 8px; font-size: 0.85rem; }

        /* 🔥 ドーパミン演出エフェクトクラス */
        .win-shake {
            animation: shake-win 0.4s cubic-bezier(.36,.07,.19,.97) both infinite, rainbow-bg 0.2s infinite;
        }

        .lose-shake {
            animation: shake-lose 0.3s cubic-bezier(.36,.07,.19,.97) both;
            filter: grayscale(0.8) contrast(1.5);
        }

        @keyframes shake-win {
            0% { transform: translate(0, 0) scale(1.05); }
            20% { transform: translate(-5px, 5px) scale(1.08); }
            40% { transform: translate(5px, -5px) scale(1.05); }
            60% { transform: translate(-5px, -5px) scale(1.08); }
            80% { transform: translate(5px, 5px) scale(1.05); }
            100% { transform: translate(0, 0) scale(1.05); }
        }

        @keyframes shake-lose {
            10%, 90% { transform: translate3d(-2px, 0, 0); }
            20%, 80% { transform: translate3d(4px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-6px, 0, 0); }
            40%, 60% { transform: translate3d(6px, 0, 0); }
        }

        @keyframes rainbow-bg {
            0% { border-color: #ff0000; box-shadow: 0 0 30px #ff0000; }
            20% { border-color: #ffff00; box-shadow: 0 0 30px #ffff00; }
            40% { border-color: #00ff00; box-shadow: 0 0 30px #00ff00; }
            60% { border-color: #00ffff; box-shadow: 0 0 30px #00ffff; }
            80% { border-color: #ff00ff; box-shadow: 0 0 30px #ff00ff; }
            100% { border-color: #ff0000; box-shadow: 0 0 30px #ff0000; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="card" id="main-card">
        <div class="header">🔥 脳汁炸裂！DICE 🔥</div>
        <p style="font-size: 0.8rem; color: #00f3ff; font-weight: bold; margin-top: 0; line-height: 1.4; text-align: center; text-shadow: 0 0 5px #00f3ff;">
            ⚡ 0〜10000の神引きを狙え！脳汁ドバドバ一獲千金 ⚡
        </p>

        <!-- 1. 出目・結果表示エリア -->
        <div class="dice-display" id="dice-display-box">
            <div id="dice-num" class="dice-number">????</div>
            <div id="dice-status" class="dice-status" style="color: #00f3ff;">💰 ベットして運命のダイスを振れ！！</div>
        </div>

        <!-- 2. 確率・倍率表示エリア -->
        <div class="stats-grid">
            <div class="stat-box">
                <div class="stat-label">🔥 配当倍率</div>
                <div id="stat-multiplier" class="stat-val">1.93x</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">🎯 勝利確率</div>
                <div id="stat-chance" class="stat-val">50.00%</div>
            </div>
        </div>

        <!-- 3. ゲーム条件設定エリア -->
        <div class="label">⚔️ 勝利条件ターゲット</div>
        <div class="mode-selector">
            <div id="mode-under" class="mode-btn active">UNDER (未満)</div>
            <div id="mode-over" class="mode-btn">OVER (超え)</div>
        </div>

        <div class="label" style="display: flex; justify-content: space-between; align-items: center;">
            <span>ターゲット: <b id="target-val-text" style="color: var(--neon-yellow); font-size: 1.1rem; text-shadow: 0 0 8px var(--neon-yellow);">5000</b></span>
            <span id="condition-desc" style="color: var(--neon-cyan); font-weight: bold;">5000 未満で勝利</span>
        </div>
        <input type="range" id="target-slider" min="100" max="9500" step="50" value="5000">

        <!-- 4. 口座・賭け金入力エリア -->
        <div class="label">💳 支払口座</div>
        <select id="wallet-select"></select>

        <div class="label">💎 賭け金 (Gold)</div>
        <input type="number" id="bet-amount" min="10" value="10" placeholder="例: 10">

        <!-- 5. ベットアクションボタン -->
        <button id="roll-btn" class="btn-roll">🎲 運命のダイスを振る！！</button>

        <!-- 6. 詳細オプション・自動設定パネル -->
        <div class="option-box">
            <label class="checkbox-label">
                <input type="checkbox" id="skip-anim">
                <span>⚡ 爆速演出スキップ（即時判定）</span>
            </label>

            <div style="border-top: 1px dashed var(--neon-pink); margin: 10px 0;"></div>

            <div style="font-size: 0.85rem; font-weight: 900; color: var(--neon-yellow); text-shadow: 0 0 5px var(--neon-yellow);">🤖 無限脳汁！自動連打モード</div>
            <div class="auto-grid">
                <div>
                    <span class="label">実行回数 (0=無限)</span>
                    <input type="number" id="auto-count" value="10" min="0" placeholder="例: 10">
                </div>
                <div>
                    <span class="label">速度 (ms/最低500)</span>
                    <input type="number" id="auto-interval" value="600" min="500" step="100" placeholder="600">
                </div>
                <div>
                    <span class="label">損切りストップ</span>
                    <input type="number" id="stop-loss" value="0" min="0" placeholder="0">
                </div>
                <div>
                    <span class="label">利確ストップ</span>
                    <input type="number" id="take-profit" value="0" min="0" placeholder="0">
                </div>
            </div>

            <button id="auto-btn" class="btn-auto">▶ 自動ベット爆走スタート</button>
        </div>
    </div>

    <!-- 戻るボタン -->
    <button class="btn-back" onclick="location.href='/casino'">◀ カジノ一覧に戻る</button>
</div>

<script>
    const token = localStorage.getItem("access_token");
    if (!token) {
        window.location.href = "/";
    } else {
        loadWallets();
        setupEventListeners();
    }

    let currentMode = "UNDER";
    let isAutoRunning = false;
    let autoTimer = null;
    let executedCount = 0;
    let myWalletsData = [];

    async function loadWallets() {
        try {
            const res = await fetch("/api/wallets", { headers: { "Authorization": `Bearer ${token}` } });
            if (!res.ok) return;
            myWalletsData = await res.json();
            
            const select = document.getElementById("wallet-select");
            const currentSelected = select.value;

            select.innerHTML = myWalletsData.map(w => `
                <option value="${w.wallet_id}">${escapeHtml(w.wallet_name)} (${w.wallet_id}) - 残高:${w.balance}G</option>
            `).join('');

            if (currentSelected && myWalletsData.some(w => w.wallet_id === currentSelected)) {
                select.value = currentSelected;
            }

            calculateStats();
        } catch (e) {
            console.error(e);
        }
    }

    function setupEventListeners() {
        document.getElementById("mode-under").addEventListener("click", () => setMode("UNDER"));
        document.getElementById("mode-over").addEventListener("click", () => setMode("OVER"));
        document.getElementById("target-slider").addEventListener("input", onSliderChange);
        document.getElementById("bet-amount").addEventListener("input", calculateStats);
        document.getElementById("roll-btn").addEventListener("click", () => playDice(false));
        document.getElementById("auto-btn").addEventListener("click", toggleAutoBet);
    }

    function setMode(mode) {
        if (isAutoRunning) return;
        currentMode = mode;
        document.getElementById("mode-under").classList.toggle("active", mode === "UNDER");
        document.getElementById("mode-over").classList.toggle("active", mode === "OVER");
        calculateStats();
    }

    function onSliderChange() {
        const val = document.getElementById("target-slider").value;
        document.getElementById("target-val-text").innerText = val;
        calculateStats();
    }

    function calculateStats() {
        const target = parseInt(document.getElementById("target-slider").value, 10);
        let winChancePercent = 0;

        if (currentMode === "UNDER") {
            winChancePercent = (target / 10000) * 100;
            document.getElementById("condition-desc").innerText = `${target} 未満で勝利`;
        } else {
            winChancePercent = ((10000 - target) / 10000) * 100;
            document.getElementById("condition-desc").innerText = `${target} 超えで勝利`;
        }

        let multiplier = (96.5 / winChancePercent);
        if (multiplier < 1.01) multiplier = 1.01;

        document.getElementById("stat-multiplier").innerText = multiplier.toFixed(2) + "x";
        document.getElementById("stat-chance").innerText = winChancePercent.toFixed(2) + "%";
    }

    function toggleAutoBet() {
        if (isAutoRunning) {
            stopAutoBet("ユーザーによって停止されました");
        } else {
            startAutoBet();
        }
    }

    function startAutoBet() {
        const wallet_id = document.getElementById("wallet-select").value;
        const amount = parseInt(document.getElementById("bet-amount").value, 10);

        if (!wallet_id) return alert("口座を選択してください");
        if (!amount || amount <= 0) return alert("賭け金を正しく入力してください");

        isAutoRunning = true;
        executedCount = 0;

        const autoBtn = document.getElementById("auto-btn");
        autoBtn.innerText = "■ 自動賭けを停止";
        autoBtn.classList.add("active");
        
        toggleInputsDisabled(true);
        runAutoLoop();
    }

    function stopAutoBet(reason) {
        isAutoRunning = false;
        if (autoTimer) clearTimeout(autoTimer);

        const autoBtn = document.getElementById("auto-btn");
        autoBtn.innerText = "▶ 自動賭けスタート";
        autoBtn.classList.remove("active");

        toggleInputsDisabled(false);

        if (reason) {
            const statusEl = document.getElementById("dice-status");
            statusEl.innerText = `[自動賭け終了] ${reason}`;
            statusEl.style.color = "#ffe600";
        }
    }

    function toggleInputsDisabled(disabled) {
        document.getElementById("roll-btn").disabled = disabled;
        document.getElementById("wallet-select").disabled = disabled;
        document.getElementById("bet-amount").disabled = disabled;
        document.getElementById("target-slider").disabled = disabled;
        document.getElementById("skip-anim").disabled = disabled;
        document.getElementById("auto-count").disabled = disabled;
        document.getElementById("auto-interval").disabled = disabled;
        document.getElementById("stop-loss").disabled = disabled;
        document.getElementById("take-profit").disabled = disabled;
    }

    async function runAutoLoop() {
        if (!isAutoRunning) return;

        const wallet_id = document.getElementById("wallet-select").value;
        const currentWallet = myWalletsData.find(w => w.wallet_id === wallet_id);
        const currentBalance = currentWallet ? currentWallet.balance : 0;

        const maxCount = parseInt(document.getElementById("auto-count").value, 10) || 0;
        const stopLoss = parseInt(document.getElementById("stop-loss").value, 10) || 0;
        const takeProfit = parseInt(document.getElementById("take-profit").value, 10) || 0;

        if (maxCount > 0 && executedCount >= maxCount) {
            stopAutoBet(`指定回数 (${maxCount}回) に達しました`);
            return;
        }

        if (stopLoss > 0 && currentBalance <= stopLoss) {
            stopAutoBet(`損切りライン (${stopLoss}G 以下) に達しました`);
            return;
        }

        if (takeProfit > 0 && currentBalance >= takeProfit) {
            stopAutoBet(`利確ライン (${takeProfit}G 以上) に達しました`);
            return;
        }

        const success = await playDice(true);
        if (!success || !isAutoRunning) return;

        executedCount++;

        let interval = parseInt(document.getElementById("auto-interval").value, 10) || 600;
        if (interval < 500) interval = 500;

        autoTimer = setTimeout(runAutoLoop, interval);
    }

    async function playDice(isAutoCall = false) {
        const wallet_id = document.getElementById("wallet-select").value;
        const amount = parseInt(document.getElementById("bet-amount").value, 10);
        const target = parseInt(document.getElementById("target-slider").value, 10);
        const skipAnim = document.getElementById("skip-anim").checked;

        if (!wallet_id) { alert("口座を選択してください"); return false; }
        if (!amount || amount <= 0) { alert("賭け金を正しく入力してください"); return false; }

        const rollBtn = document.getElementById("roll-btn");
        const diceNumEl = document.getElementById("dice-num");
        const statusEl = document.getElementById("dice-status");
        const displayBox = document.getElementById("dice-display-box");

        // アニメーション初期化
        displayBox.classList.remove("win-shake", "lose-shake");

        if (!isAutoCall) rollBtn.disabled = true;
        statusEl.style.color = "#00f3ff";
        statusEl.innerText = "🎲 激アツ！ダイス回転中...！";

        let animInterval = null;
        if (!skipAnim) {
            animInterval = setInterval(() => {
                diceNumEl.innerText = Math.floor(Math.random() * 10001);
                diceNumEl.style.color = "#00ff66";
            }, 40);
        }

        try {
            const res = await fetch("/api/dice/play", {
                method: "POST",
                headers: { "Content-Type": "application/json", "Authorization": `Bearer ${token}` },
                body: JSON.stringify({ wallet_id, amount, target, mode: currentMode })
            });

            const data = await res.json();
            const delay = skipAnim ? 0 : 500;

            return await new Promise((resolve) => {
                setTimeout(async () => {
                    if (animInterval) clearInterval(animInterval);
                    if (!isAutoCall && !isAutoRunning) rollBtn.disabled = false;

                    if (!res.ok) {
                        diceNumEl.innerText = "----";
                        statusEl.style.color = "#ff003c";
                        statusEl.innerText = "💥 エラー: " + data.detail;
                        if (isAutoRunning) stopAutoBet("エラーが発生したため停止しました");
                        resolve(false);
                        return;
                    }

                    diceNumEl.innerText = data.roll;

                    if (data.is_win) {
                        diceNumEl.style.color = "#ffe600";
                        statusEl.style.color = "#00ff66";
                        statusEl.innerText = `🎉 脳汁噴出の大勝利！！ +${data.payout} Gold ゲット！！ 🎉`;
                        displayBox.classList.add("win-shake");
                    } else {
                        diceNumEl.style.color = "#ff003c";
                        statusEl.style.color = "#ff003c";
                        statusEl.innerText = `💀 爆死... ${amount} Gold 没収！！`;
                        displayBox.classList.add("lose-shake");
                    }

                    await loadWallets();
                    resolve(true);
                }, delay);
            });

        } catch (e) {
            if (animInterval) clearInterval(animInterval);
            if (!isAutoCall && !isAutoRunning) rollBtn.disabled = false;
            console.error(e);
            if (isAutoRunning) stopAutoBet("通信エラーのため停止しました");
            resolve(false);
        }
    }

    function escapeHtml(str) { return str ? str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;") : ''; }
</script>

</body>
</html>
