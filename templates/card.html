<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>村岡王国 - 究極カード対戦 (Card Battle)</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Black+Ops+One&family=M+PLUS+1p:wght@900&display=swap');

        :root {
            --neon-pink: #ff007f;
            --neon-cyan: #00f3ff;
            --neon-yellow: #ffe600;
            --neon-green: #00ff66;
            --neon-red: #ff003c;
            --neon-purple: #b000ff;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'M PLUS 1p', 'Black Ops One', sans-serif;
            background: #000;
            background-image: 
                radial-gradient(circle at 50% 50%, #1a0022 0%, #000 90%),
                linear-gradient(0deg, rgba(255, 0, 127, 0.1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 243, 255, 0.1) 1px, transparent 1px);
            background-size: 100% 100%, 16px 16px, 16px 16px;
            color: #fff;
            min-height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
            user-select: none;
            overflow: hidden;
        }

        .container {
            width: 100%;
            max-width: 480px;
            height: 100dvh;
            max-height: 920px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 8px;
            gap: 6px;
        }

        .card-main {
            background: rgba(10, 2, 18, 0.95);
            border: 2px solid var(--neon-pink);
            border-radius: 16px;
            padding: 10px;
            box-shadow: 0 0 30px rgba(255, 0, 127, 0.5);
            display: flex;
            flex-direction: column;
            gap: 8px;
            height: 100%;
            overflow: hidden;
            position: relative;
        }

        .header-area {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--neon-cyan);
            padding-bottom: 4px;
        }

        .header-title {
            font-size: clamp(1.1rem, 4vw, 1.4rem);
            font-weight: 900;
            color: var(--neon-yellow);
            text-shadow: 0 0 10px var(--neon-yellow);
        }

        .btn-rule-open {
            background: rgba(0, 243, 255, 0.2);
            border: 1px solid var(--neon-cyan);
            color: var(--neon-cyan);
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: bold;
            cursor: pointer;
        }

        /* 🎰 ステータス表示エリア */
        .status-display {
            background: #000;
            border: 2px solid var(--neon-cyan);
            border-radius: 12px;
            padding: 8px;
            text-align: center;
            box-shadow: inset 0 0 15px rgba(0, 243, 255, 0.3);
        }

        .status-text {
            font-size: clamp(0.85rem, 3.2vw, 1.05rem);
            font-weight: 900;
            color: var(--neon-yellow);
            min-height: 24px;
            text-shadow: 0 0 8px currentColor;
        }

        .timer-display {
            font-size: 1.5rem;
            font-weight: 900;
            color: var(--neon-red);
            font-family: 'Black Ops One', monospace;
        }

        /* 🎛️ バトルフィールド */
        .field {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            flex: 1;
        }

        .player-box {
            background: rgba(20, 20, 35, 0.9);
            border: 1.5px solid rgba(0, 243, 255, 0.4);
            border-radius: 12px;
            padding: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
        }

        .player-name {
            font-size: clamp(0.8rem, 3vw, 0.95rem);
            color: var(--neon-cyan);
            font-weight: bold;
        }

        .hp-bar-container {
            width: 100%;
            height: 14px;
            background: #222;
            border-radius: 7px;
            overflow: hidden;
            border: 1px solid #444;
            margin: 4px 0;
            position: relative;
        }

        .hp-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #ff0055, #00ff66);
            width: 100%;
            transition: width 0.4s ease;
        }

        .hp-text {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            font-size: 0.65rem;
            text-align: center;
            line-height: 14px;
            font-weight: bold;
            color: #fff;
            text-shadow: 0 0 3px #000;
        }

        .card-slot {
            width: 100%;
            max-width: 110px;
            aspect-ratio: 2/3;
            border: 2px dashed rgba(255,255,255,0.3);
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,0.6);
            margin: 4px 0;
            position: relative;
        }

        .slot-type { font-size: 1.8rem; }
        .slot-atk { font-size: 0.85rem; font-weight: 900; color: var(--neon-yellow); }

        /* 🎎 手札エリア */
        .hand-container {
            display: flex;
            gap: 6px;
            justify-content: center;
            min-height: 95px;
            background: rgba(0,0,0,0.4);
            padding: 6px;
            border-radius: 10px;
            border: 1px solid rgba(255,0,127,0.3);
        }

        .card-item {
            flex: 1;
            max-width: 75px;
            aspect-ratio: 2/3;
            background: linear-gradient(135deg, #1f1c2c, #3a3858);
            border: 2px solid var(--neon-cyan);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-around;
            padding: 4px;
            cursor: pointer;
            transition: transform 0.15s ease, border-color 0.15s ease;
        }

        .card-item:not(.disabled):hover { transform: translateY(-4px); }
        .card-item.selected {
            border-color: var(--neon-yellow);
            box-shadow: 0 0 15px var(--neon-yellow);
            transform: translateY(-8px);
        }

        .card-item.disabled {
            opacity: 0.3;
            filter: grayscale(1);
            cursor: not-allowed;
        }

        /* 🎛️ 操作・設定エリア */
        .controls {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .input-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
        }

        select, input {
            width: 100%;
            padding: 8px;
            border-radius: 8px;
            border: 1.5px solid var(--neon-cyan);
            background: #0d0d18;
            color: #fff;
            font-size: clamp(0.75rem, 2.8vw, 0.9rem);
            font-weight: bold;
        }

        button {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 10px;
            font-weight: 900;
            font-size: clamp(0.85rem, 3.2vw, 1.0rem);
            cursor: pointer;
        }

        .btn-action { background: linear-gradient(135deg, #ff0055, #ff00a0); color: #fff; box-shadow: 0 0 15px var(--neon-pink); }
        .btn-submit { background: linear-gradient(135deg, #00ff66, #009933); color: #000; box-shadow: 0 0 15px var(--neon-green); }
        .btn-back { background: #111; color: #aaa; border: 1px solid #333; font-size: 0.75rem; padding: 6px; }

        /* 📖 ルールダイアログ */
        .rule-modal {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.92);
            border-radius: 16px;
            padding: 16px;
            display: none;
            flex-direction: column;
            gap: 12px;
            z-index: 100;
            overflow-y: auto;
        }

        .rule-modal.active { display: flex; }
        .rule-modal h2 { color: var(--neon-yellow); border-bottom: 2px solid var(--neon-pink); padding-bottom: 4px; }
        .rule-modal ul { font-size: 0.8rem; line-height: 1.5; color: #ddd; padding-left: 18px; }
    </style>
</head>
<body>

<div class="container">
    <div class="card-main">
        <div class="header-area">
            <div class="header-title">⚔️ 究極属性バトル ⚔️</div>
            <button class="btn-rule-open" onclick="toggleRule(true)">📖 ルール</button>
        </div>

        <div class="status-display">
            <div id="status-text" class="status-text">対戦部屋を作成するかIDを入力してください</div>
            <div id="timer" class="timer-display">--</div>
        </div>

        <div class="field">
            <div class="player-box">
                <div id="host-name" class="player-name">Host: 待機中</div>
                <div class="hp-bar-container">
                    <div id="host-hp-fill" class="hp-bar-fill"></div>
                    <div id="host-hp-text" class="hp-text">100/100</div>
                </div>
                <div id="host-card" class="card-slot"><div class="slot-type">❓</div></div>
            </div>
            <div class="player-box">
                <div id="guest-name" class="player-name">Guest: 待機中</div>
                <div class="hp-bar-container">
                    <div id="guest-hp-fill" class="hp-bar-fill"></div>
                    <div id="guest-hp-text" class="hp-text">100/100</div>
                </div>
                <div id="guest-card" class="card-slot"><div class="slot-type">❓</div></div>
            </div>
        </div>

        <div id="hand-area" class="hand-container"></div>

        <div class="controls">
            <div class="input-row" id="setup-inputs">
                <select id="wallet-select"></select>
                <input type="number" id="bet-amount" value="100" min="10" placeholder="賭け金">
            </div>
            <button id="main-btn" class="btn-action">🚀 部屋を作成して待機</button>
            <button id="submit-card-btn" class="btn-submit" style="display:none;" disabled>🔥 カードを提出する</button>
            <button class="btn-back" onclick="location.href='/casino'">◀ カジino一覧へ戻る</button>
        </div>

        <!-- 📖 ルール説明モーダル -->
        <div id="rule-modal" class="rule-modal">
            <h2>📜 究極カードバトルのルール</h2>
            <ul>
                <li><strong>属性相性 (じゃんけん):</strong><br>🔥 炎は 🌲 樹に勝ち、🌲 樹は 💧 水に勝ち、💧 水は 🔥 炎に勝ちます。</li>
                <li><strong>ダメージ判定:</strong><br>相性勝ちした側は<strong>【自分のATK × 1.5倍】</strong>のダメージを与えます。あいこ・引き分けの場合は互いのATKがそのままダメージになります。</li>
                <li><strong>勝利条件:</strong><br>先に相手のHP(100)を0にしたプレイヤーが勝利となり、賭け金の全額を獲得します！</li>
            </ul>
            <button class="btn-action" onclick="toggleRule(false)">閉じる</button>
        </div>
    </div>
</div>

<script>
    const token = localStorage.getItem("access_token");
    if (!token) window.location.href = "/";

    let ws = null;
    let currentRoomId = null;
    let myUserId = null;
    let selectedHandIndex = null;
    let currentHandData = [];

    document.addEventListener("DOMContentLoaded", () => {
        loadWallets();
        document.getElementById("main-btn").addEventListener("click", createRoom);
        document.getElementById("submit-card-btn").addEventListener("click", submitCard);
    });

    function toggleRule(show) {
        document.getElementById("rule-modal").classList.toggle("active", show);
    }

    async function loadWallets() {
        try {
            const res = await fetch("/api/wallets", { headers: { "Authorization": `Bearer ${token}` } });
            if (!res.ok) return;
            const wallets = await res.json();
            const select = document.getElementById("wallet-select");
            select.innerHTML = wallets.map(w => `<option value="${w.wallet_id}">${w.wallet_name}: ${w.balance}G</option>`).join('');
        } catch (e) { console.error(e); }
    }

    async function createRoom() {
        const walletId = document.getElementById("wallet-select").value;
        const amount = parseInt(document.getElementById("bet-amount").value, 10);
        if (!walletId || !amount) return alert("正しい入力をお願いします");

        const res = await fetch("/api/card/create", {
            method: "POST",
            headers: { "Content-Type": "application/json", "Authorization": `Bearer ${token}` },
            body: JSON.stringify({ wallet_id: walletId, bet_amount: amount })
        });
        const data = await res.json();
        if (!res.ok) return alert(data.detail);

        connectWebSocket(data.room_id);
    }

    function connectWebSocket(roomId) {
        currentRoomId = roomId;
        const protocol = location.protocol === "https:" ? "wss:" : "ws:";
        ws = new WebSocket(`${protocol}//${location.host}/ws/card/${roomId}?token=${token}`);

        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);
            if (data.type === "ERROR") return alert(data.message);
            renderState(data);
        };
    }

    function renderState(state) {
        myUserId = state.your_user_id;
        document.getElementById("status-text").innerText = state.message;
        document.getElementById("timer").innerText = state.timer_seconds ?? "--";

        document.getElementById("host-name").innerText = state.host_name || "Host";
        document.getElementById("guest-name").innerText = state.guest_name || "待機中...";

        // HPバー
        document.getElementById("host-hp-fill").style.width = `${state.host_hp}%`;
        document.getElementById("host-hp-text").innerText = `${state.host_hp}/100`;
        document.getElementById("guest-hp-fill").style.width = `${state.guest_hp}%`;
        document.getElementById("guest-hp-text").innerText = `${state.guest_hp}/100`;

        // 手札描画
        const isHost = (myUserId === state.host_id);
        currentHandData = isHost ? state.host_hand : state.guest_hand;
        renderHand(currentHandData, state.status === "BATTLE");

        // UI切替
        if (state.status === "BATTLE") {
            document.getElementById("setup-inputs").style.display = "none";
            document.getElementById("main-btn").style.display = "none";
            document.getElementById("submit-card-btn").style.display = "block";
        }
    }

    function renderHand(hand, isActive) {
        const handArea = document.getElementById("hand-area");
        if (!hand) return handArea.innerHTML = "";
        
        handArea.innerHTML = hand.map((card, idx) => `
            <div class="card-item ${selectedHandIndex === idx ? 'selected' : ''} ${!isActive ? 'disabled' : ''}" onclick="selectCard(${idx})">
                <div style="font-size: 1.4rem;">${card.type === 'FIRE' ? '🔥' : card.type === 'WATER' ? '💧' : '🌲'}</div>
                <div style="font-size: 0.8rem; font-weight:900; color:var(--neon-yellow);">ATK ${card.atk}</div>
            </div>
        `).join('');
    }

    function selectCard(index) {
        selectedHandIndex = index;
        document.getElementById("submit-card-btn").disabled = false;
        renderHand(currentHandData, true);
    }

    function submitCard() {
        if (selectedHandIndex === null || !ws) return;
        ws.send(JSON.stringify({ action: "SUBMIT_CARD", hand_index: selectedHandIndex }));
        document.getElementById("submit-card-btn").disabled = true;
    }
</script>
</body>
</html>
