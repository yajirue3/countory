<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>村岡王国 - 究極カード対戦 (Card Battle)</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Black+Ops+One&family=M+PLUS+1p:wght@900&display=swap');

        :root {
            --neon-pink: #ff007f;
            --neon-cyan: #00f3ff;
            --neon-yellow: #ffe600;
            --neon-green: #00ff66;
            --neon-red: #ff003c;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'M PLUS 1p', 'Black Ops One', sans-serif;
            background: #000;
            background-image: 
                radial-gradient(circle at 50% 50%, #1a0022 0%, #000 90%),
                linear-gradient(0deg, rgba(255, 0, 127, 0.1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 243, 255, 0.1) 1px, transparent 1px);
            background-size: 100% 100%, 16px 16px, 16px 16px;
            color: #fff;
            /* dvhで画面一杯に広げつつ、スマホのノッチや画面端見切れを防止 */
            min-height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
            user-select: none;
            overflow: hidden;
        }

        .container {
            width: 100%;
            max-width: 480px;
            height: 100dvh;
            max-height: 900px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 8px;
            gap: 8px;
        }

        .card-main {
            background: rgba(10, 2, 18, 0.95);
            border: 2px solid var(--neon-pink);
            border-radius: 16px;
            padding: 10px;
            box-shadow: 0 0 30px rgba(255, 0, 127, 0.5);
            display: flex;
            flex-direction: column;
            gap: 8px;
            height: 100%;
            overflow-y: auto;
        }

        .header {
            font-size: 1.3rem;
            font-weight: 900;
            color: var(--neon-yellow);
            text-align: center;
            border-bottom: 2px solid var(--neon-cyan);
            padding-bottom: 4px;
            text-shadow: 0 0 10px var(--neon-yellow);
        }

        /* 🎰 ステータス表示エリア (文字サイズ拡大) */
        .status-display {
            background: #000;
            border: 2px solid var(--neon-cyan);
            border-radius: 12px;
            padding: 8px;
            text-align: center;
            box-shadow: inset 0 0 15px rgba(0, 243, 255, 0.3);
        }

        .status-text {
            font-size: 0.95rem;
            font-weight: 900;
            color: var(--neon-yellow);
            min-height: 24px;
            text-shadow: 0 0 8px currentColor;
        }

        .timer-display {
            font-size: 1.4rem;
            font-weight: 900;
            color: var(--neon-red);
            font-family: 'Black Ops One', monospace;
        }

        /* 🎛️ バトルフィールド */
        .field {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            flex: 1;
        }

        .player-box {
            background: rgba(20, 20, 35, 0.9);
            border: 1px solid rgba(0, 243, 255, 0.4);
            border-radius: 10px;
            padding: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
        }

        .player-name {
            font-size: 0.85rem;
            color: var(--neon-cyan);
            font-weight: bold;
        }

        .hp-bar-container {
            width: 100%;
            height: 12px;
            background: #222;
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid #444;
            margin: 4px 0;
        }

        .hp-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #ff0055, #00ff66);
            width: 100%;
            transition: width 0.3s ease;
        }

        .card-slot {
            width: 100%;
            aspect-ratio: 2/3;
            max-height: 140px;
            border: 2px dashed rgba(255,255,255,0.2);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            background: rgba(0,0,0,0.5);
            margin: 4px 0;
        }

        /* 🎎 手札エリア */
        .hand-container {
            display: flex;
            gap: 6px;
            justify-content: center;
            min-height: 85px;
        }

        .card-item {
            flex: 1;
            max-width: 80px;
            aspect-ratio: 2/3;
            background: linear-gradient(135deg, #1f1c2c, #928dab);
            border: 2px solid var(--neon-cyan);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.1s;
        }

        .card-item:active { transform: scale(0.92); }
        .card-item.selected { border-color: var(--neon-yellow); box-shadow: 0 0 12px var(--neon-yellow); }

        /* 🎛️ 操作エリア */
        .controls {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .input-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
        }

        select, input {
            width: 100%;
            padding: 8px;
            border-radius: 8px;
            border: 1.5px solid var(--neon-cyan);
            background: #0d0d18;
            color: #fff;
            font-size: 0.85rem;
            font-weight: bold;
        }

        button {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 10px;
            font-weight: 900;
            font-size: 0.95rem;
            cursor: pointer;
            transition: filter 0.1s;
        }

        button:active { filter: brightness(1.2); }
        .btn-action { background: linear-gradient(135deg, #ff0055, #ff00a0); color: #fff; box-shadow: 0 0 15px var(--neon-pink); }
        .btn-action:disabled { background: #333; box-shadow: none; color: #666; cursor: not-allowed; }

        .btn-back { background: #111; color: #aaa; border: 1px solid #333; font-size: 0.75rem; padding: 6px; }
    </style>
</head>
<body>

<div class="container">
    <div class="card-main">
        <div class="header">⚔️ 究極カードバトル ⚔️</div>

        <div class="status-display">
            <div id="status-text" class="status-text">対戦部屋を選択してください</div>
            <div id="timer" class="timer-display">--</div>
        </div>

        <div class="field">
            <div class="player-box">
                <div id="host-name" class="player-name">Host: ---</div>
                <div class="hp-bar-container"><div id="host-hp" class="hp-bar-fill"></div></div>
                <div id="host-card" class="card-slot">❓</div>
            </div>
            <div class="player-box">
                <div id="guest-name" class="player-name">Guest: ---</div>
                <div class="hp-bar-container"><div id="guest-hp" class="hp-bar-fill"></div></div>
                <div id="guest-card" class="card-slot">❓</div>
            </div>
        </div>

        <div id="hand-area" class="hand-container"></div>

        <div class="controls">
            <div class="input-row" id="setup-inputs">
                <select id="wallet-select"></select>
                <input type="number" id="bet-amount" value="100" min="10" placeholder="賭け金">
            </div>
            <button id="main-btn" class="btn-action">部屋を作成して待機</button>
            <button class="btn-back" onclick="location.href='/casino'">◀ カジノ一覧へ戻る</button>
        </div>
    </div>
</div>

<script>
    const token = localStorage.getItem("access_token");
    if (!token) window.location.href = "/";

    let ws = null;
    let currentRoomId = null;
    let selectedCard = null;

    document.addEventListener("DOMContentLoaded", () => {
        loadWallets();
        document.getElementById("main-btn").addEventListener("click", handleMainBtnClick);
    });

    async function loadWallets() {
        try {
            const res = await fetch("/api/wallets", { headers: { "Authorization": `Bearer ${token}` } });
            if (!res.ok) return;
            const wallets = await res.json();
            const select = document.getElementById("wallet-select");
            select.innerHTML = wallets.map(w => `<option value="${w.wallet_id}">${w.wallet_name}: ${w.balance}G</option>`).join('');
        } catch (e) { console.error(e); }
    }

    async function handleMainBtnClick() {
        const walletId = document.getElementById("wallet-select").value;
        const amount = parseInt(document.getElementById("bet-amount").value, 10);
        if (!walletId || !amount) return alert("入力内容を確認してください");

        // 部屋作成API呼び出し
        const res = await fetch("/api/card/create", {
            method: "POST",
            headers: { "Content-Type": "application/json", "Authorization": `Bearer ${token}` },
            body: JSON.stringify({ wallet_id: walletId, bet_amount: amount })
        });
        const data = await res.json();
        if (!res.ok) return alert(data.detail);

        connectWebSocket(data.room_id);
    }

    function connectWebSocket(roomId) {
        currentRoomId = roomId;
        const protocol = location.protocol === "https:" ? "wss:" : "ws:";
        ws = new WebSocket(`${protocol}//${location.host}/ws/card/${roomId}?token=${token}`);

        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);
            if (data.type === "ERROR") {
                alert(data.message);
                return;
            }
            renderState(data);
        };

        ws.onclose = () => {
            document.getElementById("status-text").innerText = "切断されました";
        };
    }

    function renderState(state) {
        document.getElementById("status-text").innerText = state.message || state.status;
        document.getElementById("timer").innerText = state.timer_seconds ?? "--";
        
        document.getElementById("host-name").innerText = state.host_name || "Host";
        document.getElementById("guest-name").innerText = state.guest_name || "待機中...";
        
        document.getElementById("host-hp").style.width = `${(state.host_hp / 100) * 100}%`;
        document.getElementById("guest-hp").style.width = `${(state.guest_hp / 100) * 100}%`;

        // 画面の活性/非活性ハンドリング
        const inputs = document.getElementById("setup-inputs");
        const mainBtn = document.getElementById("main-btn");
        if (state.status !== "WAITING") {
            inputs.style.display = "none";
            mainBtn.style.display = "none";
        }
    }
</script>
</body>
</html>
