<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>村岡王国 - カードバトル</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=M+PLUS+1p:wght@700;900&display=swap');
        :root {
            --primary: #00f3ff;
            --secondary: #ff007f;
            --bg-dark: #07030e;
            --card-bg: #1c1a29;
            --taunt-color: #ffaa00;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            font-family: 'M PLUS 1p', sans-serif;
            background: var(--bg-dark);
            color: #fff;
            height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        .container {
            width: 100%;
            max-width: 500px;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            padding: 5px;
            background: #111;
        }
        /* ロビー画面 */
        #lobby-screen { display: flex; flex-direction: column; height: 100%; padding: 10px; gap: 10px; }
        .room-list { flex: 1; overflow-y: auto; background: rgba(255,255,255,0.05); border-radius: 8px; padding: 10px; }
        .room-item { display: flex; justify-content: space-between; padding: 10px; border-bottom: 1px solid #333; align-items: center;}
        input, select, button { padding: 10px; border-radius: 6px; font-weight: bold; font-family: inherit; }
        button { background: var(--primary); color: #000; border: none; cursor: pointer; }
        
        /* バトル画面 */
        #battle-screen { display: none; flex-direction: column; height: 100%; gap: 5px; position: relative; }
        .info-bar { display: flex; justify-content: space-between; background: #000; padding: 5px; border-bottom: 1px solid var(--primary); font-size: 0.8rem; }
        
        .player-area { display: flex; align-items: center; justify-content: space-between; padding: 5px 10px; background: rgba(0,243,255,0.1); border-radius: 5px; }
        .opponent-area { background: rgba(255,0,127,0.1); }
        .portrait { display: flex; flex-direction: column; }
        .hp-mp { font-size: 0.9rem; font-weight: 900; }
        .hp-text { color: #ff4444; }
        .mp-text { color: #44aaff; }

        .board { flex: 1; display: flex; gap: 5px; padding: 10px; background: rgba(255,255,255,0.02); overflow-x: auto; align-items: center; border-radius: 8px; min-height: 100px; }
        .board-card {
            min-width: 70px; height: 90px; background: var(--card-bg); border: 2px solid #555; border-radius: 6px;
            display: flex; flex-direction: column; justify-content: space-between; padding: 4px; font-size: 0.7rem; text-align: center; cursor: pointer;
        }
        .board-card.taunt { border-color: var(--taunt-color); box-shadow: 0 0 5px var(--taunt-color); }
        .board-card.can-attack { border-color: #00ff00; box-shadow: 0 0 8px #00ff00; }
        .stats { display: flex; justify-content: space-between; font-weight: bold; }
        
        .hand-area { height: 120px; display: flex; gap: 5px; padding: 5px; overflow-x: auto; background: #000; border-top: 2px solid var(--primary); }
        .hand-card {
            min-width: 80px; height: 105px; background: linear-gradient(180deg, #2a2540 0%, #151222 100%);
            border: 2px solid #555; border-radius: 6px; padding: 4px; display: flex; flex-direction: column; font-size: 0.7rem; cursor: pointer; position: relative;
        }
        .hand-card.playable { border-color: var(--primary); }
        .hand-card.selected { transform: translateY(-10px); border-color: #ff00ff; box-shadow: 0 0 10px #ff00ff; }
        
        .cost { position: absolute; top: -5px; left: -5px; background: #00f3ff; color: #000; width: 20px; height: 20px; border-radius: 50%; text-align: center; line-height: 20px; font-weight: bold; }
        .card-title { font-weight: bold; text-align: center; margin-top: 10px; margin-bottom: auto; }
        .card-desc { font-size: 0.6rem; color: #aaa; text-align: center; line-height: 1.1; }

        /* ドラフト画面 */
        #draft-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9);
            display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 100; gap: 20px;
        }
        .draft-options { display: flex; gap: 15px; }
        .draft-card { width: 110px; height: 150px; background: var(--card-bg); border: 2px solid var(--primary); border-radius: 8px; padding: 10px; display: flex; flex-direction: column; cursor: pointer; font-size: 0.8rem; }
        
        .target-mode { cursor: crosshair !important; box-shadow: inset 0 0 20px rgba(255,0,0,0.5); }
    </style>
</head>
<body>
<div class="container">
    <!-- ロビー -->
    <div id="lobby-screen">
        <h2>TCG ロビー</h2>
        <div style="display:flex; gap:10px;">
            <select id="wallet-select" style="flex:1;"></select>
            <input type="number" id="bet-amount" value="100" min="10" style="width:100px;" placeholder="Bet(G)">
            <button onclick="createRoom()">部屋作成</button>
        </div>
        <div class="room-list" id="room-list"></div>
        <button style="background:#333; color:#fff;" onclick="location.href='/casino'">戻る</button>
    </div>

    <!-- ドラフト/バトル共通レイヤー -->
    <div id="battle-screen">
        <div class="info-bar">
            <span id="sys-message">待機中...</span>
            <span id="sys-timer">⏳ 0</span>
        </div>
        
        <div class="player-area opponent-area" id="opp-hero" onclick="handleTargetClick('hero', opponentId)">
            <div class="portrait">
                <span id="opp-name">Opponent</span>
                <span class="hp-mp">Deck: <span id="opp-deck">0</span></span>
            </div>
            <div class="hp-mp">
                <span class="hp-text">HP: <span id="opp-hp">20</span></span> | 
                <span class="mp-text">MP: <span id="opp-mp">0</span>/<span id="opp-max-mp">0</span></span>
            </div>
        </div>

        <div class="board" id="opp-board"></div>
        <div style="text-align:center; font-size:0.7rem; color:#666; border-top:1px solid #333; border-bottom:1px solid #333; padding:2px;">--- FIELD ---</div>
        <div class="board" id="my-board"></div>

        <div class="player-area" id="my-hero" onclick="handleTargetClick('hero', myUserId)">
            <div class="portrait">
                <span id="my-name">You</span>
                <span class="hp-mp">Deck: <span id="my-deck">0</span></span>
            </div>
            <div class="hp-mp">
                <span class="hp-text">HP: <span id="my-hp">20</span></span> | 
                <span class="mp-text">MP: <span id="my-mp">0</span>/<span id="my-max-mp">0</span></span>
            </div>
            <button id="end-turn-btn" style="padding: 5px 15px; display:none;" onclick="endTurn()">ターン終了</button>
        </div>

        <div class="hand-area" id="my-hand"></div>
    </div>

    <!-- ドラフトモーダル -->
    <div id="draft-overlay">
        <h3>カードを1枚ピックしてください</h3>
        <div class="draft-options" id="draft-options"></div>
        <div id="draft-wait" style="display:none;">相手の選択を待っています...</div>
    </div>
</div>

<script>
    const token = localStorage.getItem("access_token");
    if (!token) window.location.href = "/";

    let ws = null;
    let gameState = null;
    let myUserId = null;
    let opponentId = null;
    
    // UI State
    let selectedHandCard = null; 
    let selectedBoardUnit = null; 
    let isTargetingMode = false;

    document.addEventListener("DOMContentLoaded", () => {
        loadWallets();
        fetchRooms();
        setInterval(fetchRooms, 3000);
    });

    async function loadWallets() {
        try {
            const res = await fetch("/api/wallets", { headers: { "Authorization": `Bearer ${token}` } });
            if (!res.ok) return;
            const wallets = await res.json();
            document.getElementById("wallet-select").innerHTML = wallets.map(w => `<option value="${w.wallet_id}">${w.wallet_name} (${w.balance}G)</option>`).join('');
        } catch (e) {}
    }

    async function fetchRooms() {
        if (ws) return;
        try {
            const res = await fetch("/api/card/rooms");
            if (!res.ok) return;
            const data = await res.json();
            document.getElementById("room-list").innerHTML = data.rooms.map(r => `
                <div class="room-item">
                    <span>${r.host_name} (Bet: ${r.bet_amount}G)</span>
                    <button onclick="joinRoom('${r.room_id}')">参加</button>
                </div>
            `).join('');
        } catch (e) {}
    }

    async function createRoom() {
        const walletId = document.getElementById("wallet-select").value;
        const amount = parseInt(document.getElementById("bet-amount").value);
        if (!walletId || amount <= 0) return alert("入力が不正です");

        const res = await fetch("/api/card/create", {
            method: "POST", headers: { "Content-Type": "application/json", "Authorization": `Bearer ${token}` },
            body: JSON.stringify({ wallet_id: walletId, amount })
        });
        const data = await res.json();
        if (!res.ok) return alert(data.detail);
        connectWS(data.room_id);
    }

    function joinRoom(roomId) { connectWS(roomId); }

    function connectWS(roomId) {
        document.getElementById("lobby-screen").style.display = "none";
        document.getElementById("battle-screen").style.display = "flex";
        
        const protocol = location.protocol === "https:" ? "wss:" : "ws:";
        ws = new WebSocket(`${protocol}//${location.host}/ws/card/${roomId}?token=${token}`);
        
        ws.onmessage = (e) => {
            const data = JSON.parse(e.data);
            if(data.type === "ERROR") { alert(data.message); location.reload(); }
            if(data.type === "SYNC_STATE") renderState(data.payload);
        };
        ws.onclose = () => { setTimeout(() => location.reload(), 2000); };
    }

    function renderState(state) {
        gameState = state;
        myUserId = state.your_user_id;
        opponentId = state.host.id === myUserId ? (state.guest ? state.guest.id : null) : state.host.id;
        
        document.getElementById("sys-message").innerText = state.message;
        document.getElementById("sys-timer").innerText = `⏳ ${state.time_limit}`;

        if (state.status === "WAITING") return;
        
        if (state.status === "DRAFT") {
            document.getElementById("draft-overlay").style.display = "flex";
            if (state.turn_user_id === myUserId && state.draft_options.length > 0) {
                document.getElementById("draft-options").style.display = "flex";
                document.getElementById("draft-wait").style.display = "none";
                document.getElementById("draft-options").innerHTML = state.draft_options.map(c => `
                    <div class="draft-card" onclick="pickCard('${c.id}')">
                        <div class="cost">${c.cost}</div>
                        <div class="card-title">${c.name}</div>
                        <div class="card-desc">${c.desc}</div>
                        ${c.type === 'unit' ? `<div class="stats"><span>⚔️${c.atk}</span><span>❤️${c.hp}</span></div>` : ''}
                    </div>
                `).join('');
            } else {
                document.getElementById("draft-options").style.display = "none";
                document.getElementById("draft-wait").style.display = "block";
            }
        } else {
            document.getElementById("draft-overlay").style.display = "none";
            renderBattlePhase(state);
        }
        
        if (state.status === "ENDED") {
            setTimeout(() => location.reload(), 4000);
        }
    }

    function renderBattlePhase(state) {
        resetSelection();
        const isMyTurn = state.turn_user_id === myUserId;
        document.getElementById("end-turn-btn").style.display = isMyTurn ? "block" : "none";

        // Heroes
        if (opponentId) {
            document.getElementById("opp-name").innerText = state.host.id === opponentId ? state.host.name : state.guest.name;
            document.getElementById("opp-hp").innerText = state.hp[opponentId];
            document.getElementById("opp-mp").innerText = state.mp[opponentId];
            document.getElementById("opp-max-mp").innerText = state.max_mp[opponentId];
            document.getElementById("opp-deck").innerText = state.deck_counts[opponentId];
        }
        document.getElementById("my-name").innerText = state.host.id === myUserId ? state.host.name : state.guest.name;
        document.getElementById("my-hp").innerText = state.hp[myUserId];
        document.getElementById("my-mp").innerText = state.mp[myUserId];
        document.getElementById("my-max-mp").innerText = state.max_mp[myUserId];
        document.getElementById("my-deck").innerText = state.deck_counts[myUserId];

        // Boards
        const renderUnit = (u, isMine) => `
            <div class="board-card ${u.taunt ? 'taunt' : ''} ${isMine && u.can_attack && isMyTurn ? 'can-attack' : ''}" 
                 onclick="handleBoardClick('${u.instance_id}', ${isMine})">
                <div style="font-weight:bold;">${u.name}</div>
                ${u.taunt ? '<div style="font-size:0.6rem; color:#ffaa00;">🛡️挑発</div>' : ''}
                <div class="stats" style="margin-top:auto;"><span>⚔️${u.atk}</span><span>❤️${u.curr_hp}</span></div>
            </div>`;
            
        document.getElementById("opp-board").innerHTML = (state.boards[opponentId] || []).map(u => renderUnit(u, false)).join('');
        document.getElementById("my-board").innerHTML = (state.boards[myUserId] || []).map(u => renderUnit(u, true)).join('');

        // Hand
        const myMp = state.mp[myUserId];
        document.getElementById("my-hand").innerHTML = (state.hands[myUserId] || []).map(c => `
            <div class="hand-card ${c.cost <= myMp && isMyTurn ? 'playable' : ''}" id="hand-${c.instance_id}" onclick="handleHandClick('${c.instance_id}', ${c.cost <= myMp && isMyTurn})">
                <div class="cost">${c.cost}</div>
                <div class="card-title">${c.name}</div>
                <div class="card-desc">${c.desc}</div>
                ${c.type === 'unit' ? `<div class="stats" style="margin-top:auto;"><span>⚔️${c.atk}</span><span>❤️${c.hp}</span></div>` : ''}
            </div>
        `).join('');
    }

    // --- Actions ---
    function pickCard(cardId) { ws.send(JSON.stringify({ action: "PICK_CARD", card_id: cardId })); }
    function endTurn() { ws.send(JSON.stringify({ action: "END_TURN" })); }

    // --- Interaction Logic ---
    function resetSelection() {
        selectedHandCard = null; selectedBoardUnit = null; isTargetingMode = false;
        document.getElementById("battle-screen").classList.remove("target-mode");
        document.querySelectorAll('.hand-card').forEach(el => el.classList.remove('selected'));
    }

    function handleHandClick(instanceId, isPlayable) {
        if (!isPlayable) return;
        resetSelection();
        selectedHandCard = gameState.hands[myUserId].find(c => c.instance_id === instanceId);
        document.getElementById(`hand-${instanceId}`).classList.add("selected");
        
        if (selectedHandCard.type === "unit" || (selectedHandCard.type === "spell" && !selectedHandCard.need_target)) {
            ws.send(JSON.stringify({ action: "PLAY_HAND", card_instance_id: instanceId, target: null }));
            resetSelection();
        } else {
            isTargetingMode = true; // Spell that needs target
            document.getElementById("battle-screen").classList.add("target-mode");
        }
    }

    function handleBoardClick(instanceId, isMine) {
        if (isMine) {
            // Select attacker
            if (gameState.turn_user_id !== myUserId) return;
            const unit = gameState.boards[myUserId].find(u => u.instance_id === instanceId);
            if (unit && unit.can_attack) {
                resetSelection();
                selectedBoardUnit = unit;
                isTargetingMode = true;
                document.getElementById("battle-screen").classList.add("target-mode");
            }
        } else {
            // Target enemy unit
            if (isTargetingMode) {
                handleTargetClick('unit', instanceId);
            }
        }
    }

    function handleTargetClick(type, id) {
        if (!isTargetingMode) return;
        
        if (selectedHandCard) {
            ws.send(JSON.stringify({ action: "PLAY_HAND", card_instance_id: selectedHandCard.instance_id, target: { type, id } }));
        } else if (selectedBoardUnit) {
            ws.send(JSON.stringify({ action: "DECLARE_ATTACK", attacker_id: selectedBoardUnit.instance_id, target: { type, id } }));
        }
        resetSelection();
    }
</script>
</body>
</html>
