<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contract Duel - Strategic Card Battle</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Noto+Sans+JP:wght@500;700;900&display=swap');
        :root {
            --bg-primary: #0a0c10; --bg-surface: #12161f; --bg-card: #181e2b;
            --border-color: #2a3447; --accent-blue: #2563eb; --accent-cyan: #06b6d4;
            --accent-gold: #f59e0b; --text-main: #f8fafc; --text-muted: #94a3b8;
            --danger: #ef4444; --success: #10b981;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', 'Noto Sans JP', sans-serif; }
        body { background: var(--bg-primary); color: var(--text-main); display: flex; justify-content: center; min-height: 100vh; padding: 12px; }
        .app-container { width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 12px; }
        
        .panel { background: var(--bg-surface); border: 1px solid var(--border-color); border-radius: 12px; padding: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        .panel-header { font-size: 1.1rem; font-weight: 800; text-align: center; color: var(--text-main); letter-spacing: 0.05em; margin-bottom: 12px; }
        
        select, input, button { width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border-color); background: var(--bg-card); color: var(--text-main); font-size: 0.9rem; margin-top: 6px; }
        button { background: var(--accent-blue); border: none; font-weight: 700; cursor: pointer; transition: all 0.2s; }
        button:hover { background: #1d4ed8; }
        button:disabled { background: #1e293b; color: var(--text-muted); cursor: not-allowed; }

        .room-card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 8px; padding: 10px 12px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        
        /* ゲームボード設計 */
        .status-bar { display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; font-weight: 700; background: #0f172a; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border-color); }
        .hero-node { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 8px; padding: 10px; display: flex; justify-content: space-between; align-items: center; margin: 6px 0; }
        .field-zone { min-height: 90px; background: rgba(255,255,255,0.02); border: 1px dashed var(--border-color); border-radius: 8px; padding: 6px; display: flex; gap: 8px; overflow-x: auto; margin: 6px 0; }
        
        /* カードコンポーネント */
        .duel-card { width: 85px; height: 115px; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 6px; padding: 6px; display: flex; flex-direction: column; justify-content: space-between; position: relative; flex-shrink: 0; cursor: pointer; user-select: none; }
        .duel-card.active-atk { border-color: var(--success); box-shadow: 0 0 8px rgba(16,185,129,0.4); }
        .duel-card.selected { border-color: var(--accent-gold); box-shadow: 0 0 10px rgba(245,158,11,0.5); transform: translateY(-4px); }
        .duel-card.taunt { border: 2px solid var(--accent-gold); }
        
        .card-cost { position: absolute; top: -6px; left: -6px; background: var(--accent-blue); color: #fff; width: 20px; height: 20px; border-radius: 50%; font-size: 0.75rem; font-weight: 800; display: flex; align-items: center; justify-content: center; }
        .card-title { font-size: 0.7rem; font-weight: 700; color: var(--text-main); margin-top: 4px; }
        .card-desc { font-size: 0.55rem; color: var(--text-muted); line-height: 1.1; }
        .card-stats { display: flex; justify-content: space-between; font-size: 0.75rem; font-weight: 800; }
        
        .val-atk { color: var(--danger); }
        .val-hp { color: var(--success); }
    </style>
</head>
<body>
<div class="app-container">
    <!-- ロビー画面 -->
    <div class="panel" id="lobby-panel">
        <div class="panel-header">CONTRACT DUEL</div>
        <label style="font-size: 0.75rem; color: var(--text-muted);">使用口座</label>
        <select id="wallet-select"></select>
        <label style="font-size: 0.75rem; color: var(--text-muted); margin-top: 8px; display: block;">契約賭け金 (Gold)</label>
        <input type="number" id="bet-amount" value="100" min="1">
        <button onclick="createNewRoom()" style="margin-top: 12px;">対戦契約を作成</button>

        <div style="margin-top: 20px;">
            <div style="font-size: 0.8rem; font-weight: 700; color: var(--text-muted); margin-bottom: 8px;">アクティブな募集</div>
            <div id="room-list-target">部屋一覧を取得中...</div>
        </div>
    </div>

    <!-- ゲーム画面 -->
    <div class="panel" id="game-panel" style="display: none;">
        <div class="status-bar">
            <span id="turn-indicator">対戦待機中</span>
            <span id="timer-label" style="color: var(--accent-gold);">⏱️ 30s</span>
        </div>

        <!-- ドラフトフェイズ UI -->
        <div id="draft-container" style="display: none; margin-top: 12px;">
            <div style="font-size: 0.8rem; text-align: center; color: var(--text-muted); margin-bottom: 8px;">デッキ構築：カードを選択してください</div>
            <div style="display: flex; justify-content: center; gap: 8px;" id="draft-cards-target"></div>
        </div>

        <!-- バトルフェイズ UI -->
        <div id="battle-container" style="display: none; margin-top: 8px;">
            <!-- 敵対者ステータス -->
            <div class="hero-node" onclick="handleTargetClick('hero', opponentUserId)">
                <div>
                    <div style="font-size: 0.85rem; font-weight: 700;" id="opp-name-display">Opponent</div>
                    <div style="font-size: 0.65rem; color: var(--text-muted);" id="opp-deck-label">Deck: 0</div>
                </div>
                <div style="font-size: 1rem; font-weight: 800; color: var(--danger);">HP <span id="opp-hp-display">20</span></div>
            </div>

            <div class="field-zone" id="opp-board-target"></div>
            <div class="field-zone" id="my-board-target"></div>

            <!-- プレイヤー自身ステータス -->
            <div class="hero-node">
                <div>
                    <div style="font-size: 0.85rem; font-weight: 700;">Player (You)</div>
                    <div style="font-size: 0.7rem; color: var(--accent-cyan); font-weight: 700;">MP <span id="my-mp-display">1/1</span></div>
                </div>
                <div style="font-size: 1rem; font-weight: 800; color: var(--success);">HP <span id="my-hp-display">20</span></div>
            </div>

            <button id="end-turn-button" onclick="dispatchEndTurn()" style="margin: 6px 0; background: var(--bg-card); border: 1px solid var(--border-color);">ターンエンド</button>

            <!-- 手札エリア -->
            <div style="font-size: 0.7rem; color: var(--text-muted); margin-top: 4px;">所持手札:</div>
            <div style="display: flex; gap: 6px; overflow-x: auto; padding-top: 4px;" id="my-hand-target"></div>
        </div>
    </div>
</div>

<script>
    const authToken = localStorage.getItem("access_token") || "test_token";
    let socket = null;
    let currentUserId = null;
    let opponentUserId = null;
    let activeSession = null;

    let selectedHandCardId = null;
    let selectedAttackerId = null;

    initializeLobby();

    async function initializeLobby() {
        const res = await fetch("/api/card/rooms");
        if (res.ok) {
            const data = await res.json();
            document.getElementById("room-list-target").innerHTML = data.rooms.length ? data.rooms.map(r => `
                <div class="room-card">
                    <div><b>${r.host_name}</b> (${r.bet_amount} G)</div>
                    <button style="width: auto; padding: 4px 12px;" onclick="joinRoom('${r.room_id}')">対戦</button>
                </div>
            `).join('') : '<div style="font-size:0.75rem; color:#666;">募集中の対戦はありません</div>';
        }
    }

    async function createNewRoom() {
        const wallet_id = "default_wallet";
        const bet_amount = parseInt(document.getElementById("bet-amount").value, 10);
        const res = await fetch("/api/card/create", {
            method: "POST",
            headers: { "Content-Type": "application/json", "Authorization": `Bearer ${authToken}` },
            body: JSON.stringify({ wallet_id, bet_amount })
        });
        if (res.ok) {
            const data = await res.json();
            connectGameSocket(data.room_id);
        }
    }

    function joinRoom(roomId) { connectGameSocket(roomId); }

    function connectGameSocket(roomId) {
        document.getElementById("lobby-panel").style.display = "none";
        document.getElementById("game-panel").style.display = "block";

        const protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
        socket = new WebSocket(`${protocol}//${window.location.host}/ws/card/${roomId}?token=${authToken}`);

        socket.onmessage = (e) => {
            const msg = JSON.parse(e.data);
            if (msg.type === "SYNC_STATE") renderState(msg.payload);
        };
    }

    function renderState(session) {
        activeSession = session;
        if (!currentUserId) {
            currentUserId = session.guest ? (session.host.id === currentUserId ? session.host.id : session.guest.id) : session.host.id;
        }
        opponentUserId = (currentUserId === session.host.id) ? (session.guest ? session.guest.id : null) : session.host.id;

        document.getElementById("timer-label").innerText = `⏱️ ${session.time_limit}s`;
        const isMyTurn = session.turn_user_id === currentUserId;

        if (session.status === "WAITING") {
            document.getElementById("turn-indicator").innerText = "対戦相手の接続を待機中...";
        } else if (session.status === "DRAFT") {
            document.getElementById("draft-container").style.display = "block";
            document.getElementById("battle-container").style.display = "none";
            document.getElementById("turn-indicator").innerText = isMyTurn ? "カードを選択してください" : "相手がカードを撰択中";

            document.getElementById("draft-cards-target").innerHTML = isMyTurn ? session.draft_options.map(c => `
                <div class="duel-card" onclick="dispatchDraftPick('${c.id}')" style="width: 100px; height: 130px;">
                    <div class="card-cost">${c.cost}</div>
                    <div class="card-title">${c.name}</div>
                    <div class="card-desc">${c.desc}</div>
                    ${c.atk ? `<div class="card-stats"><span class="val-atk">⚔️${c.atk}</span><span class="val-hp">🛡️${c.hp}</span></div>` : ''}
                </div>
            `).join('') : '';
        } else if (session.status === "BATTLE" || session.status === "ENDED") {
            document.getElementById("draft-container").style.display = "none";
            document.getElementById("battle-container").style.display = "block";
            
            document.getElementById("turn-indicator").innerText = isMyTurn ? "あなたのターン" : "相手のターン";
            document.getElementById("end-turn-button").disabled = !isMyTurn || session.status === "ENDED";

            document.getElementById("opp-name-display").innerText = opponentUserId === session.host.id ? session.host.name : (session.guest ? session.guest.name : "Opponent");
            document.getElementById("opp-hp-display").innerText = session.hp[opponentUserId] || 0;
            document.getElementById("opp-deck-label").innerText = `Deck: ${session.deck_counts[opponentUserId] || 0}`;

            document.getElementById("my-hp-display").innerText = session.hp[currentUserId] || 0;
            document.getElementById("my-mp-display").innerText = `${session.mp[currentUserId] || 0}/${session.max_mp[currentUserId] || 0}`;

            // 敵盤面
            document.getElementById("opp-board-target").innerHTML = (session.boards[opponentUserId] || []).map(u => `
                <div class="duel-card ${u.taunt ? 'taunt' : ''}" onclick="handleTargetClick('unit', '${u.instance_id}')">
                    <div class="card-title">${u.name}</div>
                    <div class="card-stats"><span class="val-atk">⚔️${u.atk}</span><span class="val-hp">🛡️${u.curr_hp}/${u.max_hp}</span></div>
                </div>
            `).join('');

            // 自盤面
            document.getElementById("my-board-target").innerHTML = (session.boards[currentUserId] || []).map(u => `
                <div class="duel-card ${u.can_attack && isMyTurn ? 'active-atk' : ''} ${selectedAttackerId === u.instance_id ? 'selected' : ''}" 
                     onclick="selectAttacker('${u.instance_id}', ${u.can_attack && isMyTurn})">
                    <div class="card-title">${u.name}</div>
                    <div class="card-stats"><span class="val-atk">⚔️${u.atk}</span><span class="val-hp">🛡️${u.curr_hp}/${u.max_hp}</span></div>
                </div>
            `).join('');

            // 手札
            document.getElementById("my-hand-target").innerHTML = (session.hands[currentUserId] || []).map(c => `
                <div class="duel-card ${selectedHandCardId === c.instance_id ? 'selected' : ''}" onclick="selectHandCard('${c.instance_id}')">
                    <div class="card-cost">${c.cost}</div>
                    <div class="card-title">${c.name}</div>
                    <div class="card-desc">${c.desc}</div>
                    ${c.atk ? `<div class="card-stats"><span class="val-atk">⚔️${c.atk}</span><span class="val-hp">🛡️${c.hp}</span></div>` : ''}
                </div>
            `).join('');

            if (session.status === "ENDED") {
                document.getElementById("turn-indicator").innerText = session.winner_id === currentUserId ? "VICTORY" : (session.winner_id ? "DEFEAT" : "DRAW");
            }
        }
    }

    function dispatchDraftPick(cardId) {
        socket.send(JSON.stringify({ action: "PICK_CARD", card_id: cardId }));
    }

    function selectHandCard(instanceId) {
        if (activeSession.turn_user_id !== currentUserId) return;
        const card = activeSession.hands[currentUserId].find(c => c.instance_id === instanceId);
        
        if (card.type === "unit" || !card.need_target) {
            socket.send(JSON.stringify({ action: "PLAY_HAND", card_instance_id: instanceId }));
            selectedHandCardId = null;
        } else {
            selectedHandCardId = instanceId;
            selectedAttackerId = null;
        }
    }

    function selectAttacker(instanceId, canAttack) {
        if (!canAttack) return;
        selectedAttackerId = instanceId;
        selectedHandCardId = null;
    }

    function handleTargetClick(targetType, targetId) {
        if (selectedHandCardId) {
            socket.send(JSON.stringify({
                action: "PLAY_HAND",
                card_instance_id: selectedHandCardId,
                target: { type: targetType, id: targetId }
            }));
            selectedHandCardId = null;
        } else if (selectedAttackerId) {
            socket.send(JSON.stringify({
                action: "DECLARE_ATTACK",
                attacker_id: selectedAttackerId,
                target: { type: targetType, id: targetId }
            }));
            selectedAttackerId = null;
        }
    }

    function dispatchEndTurn() {
        selectedHandCardId = null;
        selectedAttackerId = null;
        socket.send(JSON.stringify({ action: "END_TURN" }));
    }
</script>
</body>
</html>
