<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>村岡王国 - 究極カード対戦 (Card Battle)</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Black+Ops+One&family=M+PLUS+1p:wght@800;900&display=swap');

        :root {
            --neon-pink: #ff007f;
            --neon-cyan: #00f3ff;
            --neon-yellow: #ffe600;
            --neon-green: #00ff66;
            --neon-red: #ff003c;
            --bg-dark: #07030e;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'M PLUS 1p', 'Black Ops One', sans-serif;
            background: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 50% 50%, #1a0022 0%, #000 100%),
                linear-gradient(0deg, rgba(255, 0, 127, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 243, 255, 0.05) 1px, transparent 1px);
            background-size: 100% 100%, 16px 16px, 16px 16px;
            color: #fff;
            height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            user-select: none;
        }

        /* 📱 アプリメイン枠 */
        .container {
            width: 100%;
            max-width: 480px;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            padding: 8px;
            gap: 8px;
        }

        .card-main {
            background: rgba(15, 6, 25, 0.92);
            border: 2px solid var(--neon-pink);
            border-radius: 16px;
            padding: 10px;
            box-shadow: 0 0 25px rgba(255, 0, 127, 0.35);
            display: flex;
            flex-direction: column;
            gap: 8px;
            height: 100%;
            overflow: hidden;
            position: relative;
        }

        /* ヘッダー */
        .header-area {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--neon-cyan);
            padding-bottom: 4px;
            flex-shrink: 0;
        }

        .header-title {
            font-size: 1.1rem;
            font-weight: 900;
            color: var(--neon-yellow);
            text-shadow: 0 0 8px var(--neon-yellow);
        }

        .btn-rule-open {
            background: rgba(0, 243, 255, 0.15);
            border: 1px solid var(--neon-cyan);
            color: var(--neon-cyan);
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: bold;
            cursor: pointer;
        }

        /* ステータス表示 */
        .status-display {
            background: #000;
            border: 1.5px solid var(--neon-cyan);
            border-radius: 8px;
            padding: 6px;
            text-align: center;
            flex-shrink: 0;
            box-shadow: inset 0 0 10px rgba(0, 243, 255, 0.2);
        }

        .status-text {
            font-size: 0.85rem;
            font-weight: 900;
            color: var(--neon-yellow);
            text-shadow: 0 0 6px currentColor;
            line-height: 1.2;
        }

        /* ⚔️ 対戦フィールド */
        .field {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            flex-shrink: 0;
        }

        .player-box {
            background: rgba(25, 20, 42, 0.85);
            border: 1px solid rgba(0, 243, 255, 0.4);
            border-radius: 10px;
            padding: 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .player-name {
            font-size: 0.8rem;
            color: var(--neon-cyan);
            font-weight: bold;
            width: 100%;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .hp-bar-container {
            width: 100%;
            height: 14px;
            background: #111;
            border-radius: 7px;
            overflow: hidden;
            border: 1px solid #333;
            position: relative;
        }

        .hp-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--neon-red), var(--neon-green));
            width: 100%;
            transition: width 0.3s ease-out;
        }

        .hp-text {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            font-size: 0.6rem;
            text-align: center;
            line-height: 14px;
            font-weight: bold;
            color: #fff;
            text-shadow: 0 0 2px #000;
        }

        .card-slot {
            width: 60px;
            height: 80px;
            border: 2px dashed rgba(255,255,255,0.25);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,0.4);
            font-size: 1.5rem;
            margin-top: 2px;
        }

        /* 🎴 手札エリア */
        .hand-container {
            display: flex;
            gap: 8px;
            justify-content: center;
            align-items: center;
            background: rgba(0,0,0,0.3);
            padding: 8px;
            border-radius: 10px;
            border: 1px solid rgba(255,0,127,0.25);
            min-height: 95px;
            flex-shrink: 0;
        }

        .card-item {
            flex: 1;
            max-width: 80px;
            height: 85px;
            background: linear-gradient(135deg, #252138, #3c395c);
            border: 2px solid var(--neon-cyan);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-around;
            padding: 4px;
            cursor: pointer;
            transition: transform 0.15s ease, border-color 0.15s ease;
        }

        .card-item.selected {
            border-color: var(--neon-yellow);
            box-shadow: 0 0 12px var(--neon-yellow);
            transform: translateY(-6px);
        }

        .card-item.disabled {
            opacity: 0.3;
            filter: grayscale(1);
            cursor: not-allowed;
        }

        /* 📜 スクロール可能な部屋一覧（ここがしっかり見えるよう修正） */
        .room-list-box {
            background: rgba(0,0,0,0.5);
            border: 1px solid rgba(0, 243, 255, 0.3);
            border-radius: 8px;
            padding: 6px;
            flex: 1; /* 残り高さを埋める */
            min-height: 80px;
            overflow-y: auto; /* 縦スクロール可能に */
        }

        .room-list-title {
            font-size: 0.7rem;
            color: #aaa;
            text-align: center;
            margin-bottom: 4px;
            position: sticky;
            top: 0;
            background: rgba(0,0,0,0.8);
            padding: 2px;
        }

        .room-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 8px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            font-size: 0.75rem;
            background: rgba(255,255,255,0.02);
            margin-bottom: 4px;
            border-radius: 4px;
        }

        .btn-join {
            background: var(--neon-green);
            color: #000;
            border: none;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 900;
            cursor: pointer;
        }

        /* 🎛️ 操作エリア */
        .controls {
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex-shrink: 0;
            margin-top: auto;
        }

        .input-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
        }

        select, input {
            width: 100%;
            padding: 8px;
            border-radius: 6px;
            border: 1px solid var(--neon-cyan);
            background: #090914;
            color: #fff;
            font-size: 0.8rem;
            font-weight: bold;
        }

        button.main-btn {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 8px;
            font-weight: 900;
            font-size: 0.9rem;
            cursor: pointer;
        }

        .btn-action { background: linear-gradient(135deg, #ff0055, #ff00a0); color: #fff; box-shadow: 0 0 10px var(--neon-pink); }
        .btn-submit { background: linear-gradient(135deg, #00ff66, #009933); color: #000; box-shadow: 0 0 10px var(--neon-green); }
        .btn-submit:disabled { opacity: 0.4; box-shadow: none; cursor: not-allowed; }
        .btn-back { background: #111; color: #888; border: 1px solid #333; font-size: 0.75rem; padding: 6px; }

        /* モーダル */
        .rule-modal {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.95);
            border-radius: 16px;
            padding: 16px;
            display: none;
            flex-direction: column;
            gap: 10px;
            z-index: 100;
            overflow-y: auto;
        }

        .rule-modal.active { display: flex; }
        .rule-modal h2 { color: var(--neon-yellow); border-bottom: 2px solid var(--neon-pink); padding-bottom: 4px; font-size: 1.1rem; }
        .rule-modal ul { font-size: 0.8rem; line-height: 1.5; color: #ddd; padding-left: 16px; }
    </style>
</head>
<body>

<div class="container">
    <div class="card-main">
        <div class="header-area">
            <div class="header-title">⚔️ 属性バトル ⚔️</div>
            <button class="btn-rule-open" onclick="toggleRule(true)">📖 ルール</button>
        </div>

        <div class="status-display">
            <div id="status-text" class="status-text">部屋を作成するか、一覧から参加してください</div>
        </div>

        <div class="field">
            <div class="player-box">
                <div id="host-name" class="player-name">Host: 待機中</div>
                <div class="hp-bar-container">
                    <div id="host-hp-fill" class="hp-bar-fill"></div>
                    <div id="host-hp-text" class="hp-text">100/100</div>
                </div>
                <div id="host-card" class="card-slot">❓</div>
            </div>
            <div class="player-box">
                <div id="guest-name" class="player-name">Guest: 待機中</div>
                <div class="hp-bar-container">
                    <div id="guest-hp-fill" class="hp-bar-fill"></div>
                    <div id="guest-hp-text" class="hp-text">100/100</div>
                </div>
                <div id="guest-card" class="card-slot">❓</div>
            </div>
        </div>

        <div id="hand-area" class="hand-container"></div>

        <div id="room-list-box" class="room-list-box">
            <div class="room-list-title">--- 待機中の対戦部屋 ---</div>
            <div id="room-items"></div>
        </div>

        <div class="controls">
            <div class="input-row" id="setup-inputs">
                <select id="wallet-select"></select>
                <input type="number" id="bet-amount" value="100" min="10" placeholder="賭け金">
            </div>
            <button id="main-btn" class="main-btn btn-action">🚀 部屋を作成して待機</button>
            <button id="submit-card-btn" class="main-btn btn-submit" style="display:none;" disabled>🔥 カードを提出する</button>
            <button class="main-btn btn-back" onclick="location.href='/casino'">◀ カジノ一覧へ戻る</button>
        </div>

        <div id="rule-modal" class="rule-modal">
            <h2>📜 属性バトルのルール</h2>
            <ul>
                <li><strong>属性相性 (じゃんけん):</strong><br>🔥 炎は 🌲 樹に勝ち、🌲 樹は 💧 水に勝ち、💧 水は 🔥 炎に勝ちます。</li>
                <li><strong>ダメージ計算:</strong><br>相性勝利した側は<strong>【ATK × 1.5倍】</strong>を与え、相手の攻撃を打ち消します。引き分け時は互いに直撃を受けます。</li>
                <li><strong>勝利条件:</strong><br>先に相手のHPを0にした側が全額（2倍）獲得！</li>
            </ul>
            <button class="main-btn btn-action" onclick="toggleRule(false)" style="margin-top:auto;">閉じる</button>
        </div>
    </div>
</div>

<script>
    const token = localStorage.getItem("access_token");
    if (!token) window.location.href = "/";

    let ws = null;
    let currentRoomId = null;
    let myUserId = null;
    let selectedHandIndex = null;
    let currentHandData = [];

    const ELEMENT_ICONS = { FIRE: '🔥', WATER: '💧', TREE: '🌲' };

    document.addEventListener("DOMContentLoaded", () => {
        loadWallets();
        fetchRooms();
        setInterval(fetchRooms, 3000);

        document.getElementById("main-btn").addEventListener("click", createRoom);
        document.getElementById("submit-card-btn").addEventListener("click", submitCard);
    });

    function toggleRule(show) {
        document.getElementById("rule-modal").classList.toggle("active", show);
    }

    async function loadWallets() {
        try {
            const res = await fetch("/api/wallets", { headers: { "Authorization": `Bearer ${token}` } });
            if (!res.ok) return;
            const wallets = await res.json();
            const select = document.getElementById("wallet-select");
            select.innerHTML = wallets.map(w => `<option value="${w.wallet_id}">${escapeHtml(w.wallet_name)}: ${w.balance}G</option>`).join('');
        } catch (e) { console.error(e); }
    }

    async function fetchRooms() {
        if (ws) return;
        try {
            const res = await fetch("/api/card/rooms");
            if (!res.ok) return;
            const rooms = await res.json();
            const container = document.getElementById("room-items");
            if (rooms.length === 0) {
                container.innerHTML = '<div style="font-size:0.7rem; color:#666; text-align:center; padding:8px;">待機中の部屋はありません</div>';
                return;
            }
            container.innerHTML = rooms.map(r => `
                <div class="room-item">
                    <span>${escapeHtml(r.host_name)} (${r.bet_amount}G)</span>
                    <button class="btn-join" onclick="joinRoom('${r.room_id}')">参加</button>
                </div>
            `).join('');
        } catch (e) { console.error(e); }
    }

    async function createRoom() {
        const walletId = document.getElementById("wallet-select").value;
        const amount = parseInt(document.getElementById("bet-amount").value, 10);
        if (!walletId || isNaN(amount) || amount <= 0) return alert("賭け金を正しく入力してください");

        const res = await fetch("/api/card/create", {
            method: "POST",
            headers: { "Content-Type": "application/json", "Authorization": `Bearer ${token}` },
            body: JSON.stringify({ wallet_id: walletId, bet_amount: amount })
        });
        const data = await res.json();
        if (!res.ok) return alert(data.detail);

        connectWebSocket(data.room_id);
    }

    function joinRoom(roomId) {
        connectWebSocket(roomId);
    }

    function connectWebSocket(roomId) {
        currentRoomId = roomId;
        const protocol = location.protocol === "https:" ? "wss:" : "ws:";
        ws = new WebSocket(`${protocol}//${location.host}/ws/card/${roomId}?token=${token}`);

        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);
            if (data.type === "ERROR") {
                alert(data.message);
                ws = null;
                return;
            }
            renderState(data);
        };

        ws.onclose = () => { ws = null; };
    }

    function renderState(state) {
        myUserId = state.your_user_id;
        document.getElementById("status-text").innerText = state.message;

        document.getElementById("host-name").innerText = state.host_name || "Host";
        document.getElementById("guest-name").innerText = state.guest_name || "待機中...";

        document.getElementById("host-hp-fill").style.width = `${state.host_hp}%`;
        document.getElementById("host-hp-text").innerText = `${state.host_hp}/100`;
        document.getElementById("guest-hp-fill").style.width = `${state.guest_hp}%`;
        document.getElementById("guest-hp-text").innerText = `${state.guest_hp}/100`;

        document.getElementById("host-card").innerText = state.host_submitted ? "✅" : "❓";
        document.getElementById("guest-card").innerText = state.guest_submitted ? "✅" : "❓";

        const isHost = (myUserId === state.host_id);
        currentHandData = isHost ? state.host_hand : state.guest_hand;
        renderHand(currentHandData, state.status === "BATTLE");

        if (state.status === "BATTLE" || state.status === "ENDED") {
            document.getElementById("setup-inputs").style.display = "none";
            document.getElementById("room-list-box").style.display = "none";
            document.getElementById("main-btn").style.display = "none";
            document.getElementById("submit-card-btn").style.display = "block";
        }
    }

    function renderHand(hand, isActive) {
        const handArea = document.getElementById("hand-area");
        if (!hand || hand.length === 0) return handArea.innerHTML = "";
        
        handArea.innerHTML = hand.map((card, idx) => `
            <div class="card-item ${selectedHandIndex === idx ? 'selected' : ''} ${!isActive ? 'disabled' : ''}" onclick="selectCard(${idx})">
                <div style="font-size: 1.3rem;">${ELEMENT_ICONS[card.type] || '❓'}</div>
                <div style="font-size: 0.75rem; font-weight:900; color:var(--neon-yellow);">ATK ${card.atk}</div>
            </div>
        `).join('');
    }

    function selectCard(index) {
        selectedHandIndex = index;
        document.getElementById("submit-card-btn").disabled = false;
        renderHand(currentHandData, true);
    }

    function submitCard() {
        if (selectedHandIndex === null || !ws) return;
        ws.send(JSON.stringify({ action: "SUBMIT_CARD", hand_index: selectedHandIndex }));
        document.getElementById("submit-card-btn").disabled = true;
        selectedHandIndex = null;
    }

    function escapeHtml(str) {
        return str ? str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;") : '';
    }
</script>
</body>
</html>
