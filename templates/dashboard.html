<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>村岡王国 - 国民証</title>
    <style>
        body { font-family: sans-serif; background-color: #1a1a1a; color: #e0e0e0; display: flex; justify-content: center; padding: 20px 0; margin: 0; }
        .container { width: 360px; display: flex; flex-direction: column; gap: 16px; }
        .card { background: #2a2a2a; border: 2px solid #555; border-radius: 12px; padding: 20px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
        .header { font-size: 1.1rem; font-weight: bold; color: #d4af37; text-align: center; border-bottom: 1px solid #444; padding-bottom: 8px; margin-bottom: 12px; }
        .icon-box { font-size: 3rem; text-align: center; margin: 8px 0; }
        .info-group { margin: 12px 0; font-size: 0.85rem; }
        .label { color: #888; font-size: 0.75rem; }
        .value { font-weight: bold; margin-bottom: 6px; word-break: break-all; }
        .badge { display: inline-block; background-color: #8b0000; color: #fff; padding: 2px 8px; border-radius: 4px; font-size: 0.8rem; }
        input, select { width: 100%; padding: 8px; border-radius: 6px; border: 1px solid #444; background: #333; color: #fff; box-sizing: border-box; margin-top: 4px; margin-bottom: 10px; font-size: 0.85rem; }
        button { width: 100%; padding: 10px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; background: #d4af37; color: #1a1a1a; font-size: 0.85rem; margin-top: 6px; }
        button:hover { background: #f1c40f; }
        .btn-bank { background: #27ae60; color: #fff; }
        .btn-bank:hover { background: #2ecc71; }
        .btn-board { background: #2980b9; color: #fff; }
        .btn-board:hover { background: #3498db; }
        .btn-market { background: #8e44ad; color: #fff; }
        .btn-market:hover { background: #9b59b6; }
        .btn-logout { background: #444; color: #ccc; }
        .btn-logout:hover { background: #555; }
        .secret-tag { color: #e74c3c; font-size: 0.7rem; }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <div class="header">村岡王国 国民証</div>
        <div class="icon-box">⛏️</div>
        
        <div class="info-group">
            <div class="label">国民ID (Email)</div>
            <div class="value" id="user-email">-</div>

            <div class="label">現在の称号</div>
            <div class="value"><span class="badge">鉱山労働奴隷</span></div>
        </div>

        <div class="label">納税報酬の受取口座</div>
        <select id="tax-wallet-select"></select>

        <button onclick="payTax()">💰 本日の納税を行う（+100G）</button>
        <button class="btn-bank" onclick="location.href='/wallet'">🏦 王国中央銀行（資金管理）</button>
        <button class="btn-board" onclick="location.href='/board'">📜 王国回覧板（掲示板）</button>
        <button class="btn-market" onclick="location.href='/market'">⚖️ 王国自由市場（契約取引）</button>
    </div>

    <div class="card">
        <div class="header">国民登録情報の変更</div>
        <div class="label">表のニックネーム (全体公開)</div>
        <input type="text" id="nickname" placeholder="例: 鉱山ハナコ">

        <div class="label">本名 <span class="secret-tag">※国王のみ知る(完全非公開)</span></div>
        <input type="text" id="real-name" placeholder="例: 村岡 太郎">

        <button onclick="saveProfile()">情報を保存する</button>
    </div>

    <button class="btn-logout" onclick="logout()">王国を離脱（ログアウト）</button>
</div>

<script>
    const token = localStorage.getItem("access_token");
    if (!token) {
        window.location.href = "/";
    } else {
        document.getElementById("user-email").innerText = localStorage.getItem("user_email") || "";
        loadProfile();
        loadWalletsForTax();
    }

    async function loadProfile() {
        const res = await fetch("/api/profile", { headers: { "Authorization": `Bearer ${token}` } });
        if (res.ok) {
            const data = await res.json();
            document.getElementById("nickname").value = data.nickname || "";
            document.getElementById("real-name").value = data.real_name || "";
        }
    }

    async function loadWalletsForTax() {
        const res = await fetch("/api/wallets", { headers: { "Authorization": `Bearer ${token}` } });
        if (res.ok) {
            const wallets = await res.json();
            const select = document.getElementById("tax-wallet-select");
            select.innerHTML = wallets.map(w => `<option value="${w.wallet_id}">${escapeHtml(w.wallet_name)} (${w.wallet_id})</option>`).join('');
        }
    }

    async function saveProfile() {
        const nickname = document.getElementById("nickname").value;
        const real_name = document.getElementById("real-name").value;
        const res = await fetch("/api/profile", {
            method: "POST",
            headers: { "Content-Type": "application/json", "Authorization": `Bearer ${token}` },
            body: JSON.stringify({ nickname, real_name })
        });
        const data = await res.json();
        alert(data.message);
        loadProfile();
    }

    async function payTax() {
        const wallet_id = document.getElementById("tax-wallet-select").value;
        if (!wallet_id) return alert("受取口座を選択してください");

        const res = await fetch("/api/pay-tax", {
            method: "POST",
            headers: { "Content-Type": "application/json", "Authorization": `Bearer ${token}` },
            body: JSON.stringify({ wallet_id })
        });
        const data = await res.json();
        alert(res.ok ? data.message : data.detail);
    }

    function logout() {
        localStorage.clear();
        window.location.href = "/";
    }

    function escapeHtml(str) { return str ? str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;") : ''; }
</script>

</body>
</html>
