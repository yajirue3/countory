<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>村岡王国 - 国民証</title>
    <style>
        body { font-family: sans-serif; background-color: #1a1a1a; color: #e0e0e0; display: flex; justify-content: center; padding: 20px 0; margin: 0; }
        .container { width: 360px; display: flex; flex-direction: column; gap: 16px; }
        .card { background: #2a2a2a; border: 2px solid #555; border-radius: 12px; padding: 20px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
        .header { font-size: 1.1rem; font-weight: bold; color: #d4af37; text-align: center; border-bottom: 1px solid #444; padding-bottom: 8px; margin-bottom: 12px; }
        .icon-box { font-size: 3rem; text-align: center; margin: 8px 0; }
        .info-group { margin: 12px 0; font-size: 0.85rem; }
        .label { color: #888; font-size: 0.75rem; }
        .value { font-weight: bold; margin-bottom: 6px; word-break: break-all; }
        .badge { display: inline-block; background-color: #8b0000; color: #fff; padding: 2px 8px; border-radius: 4px; font-size: 0.8rem; }
        input, select { width: 100%; padding: 8px; border-radius: 6px; border: 1px solid #444; background: #333; color: #fff; box-sizing: border-box; margin-top: 4px; margin-bottom: 10px; font-size: 0.85rem; }
        
        button { width: 100%; padding: 10px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; background: #d4af37; color: #1a1a1a; font-size: 0.85rem; margin-top: 6px; }
        button:hover { background: #f1c40f; }

        /* ナビゲーション用のグリッドレイアウト */
        .nav-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
        .nav-grid button { margin-top: 0; padding: 12px 6px; font-size: 0.8rem; line-height: 1.2; }

        .btn-tax { background: linear-gradient(180deg, #f39c12 0%, #d35400 100%); color: #fff; margin-top: 6px; }
        .btn-tax:hover { background: linear-gradient(180deg, #f1c40f 0%, #e67e22 100%); }

        .btn-bank { background: #27ae60; color: #fff; }
        .btn-bank:hover { background: #2ecc71; }
        .btn-inventory { background: #d35400; color: #fff; }
        .btn-inventory:hover { background: #e67e22; }
        .btn-board { background: #2980b9; color: #fff; }
        .btn-board:hover { background: #3498db; }
        .btn-market { background: #8e44ad; color: #fff; }
        .btn-market:hover { background: #9b59b6; }
        .btn-casino { background: #c0392b; color: #fff; grid-column: span 2; }
        .btn-casino:hover { background: #e74c3c; }

        /* 国王専用ボタン */
        .btn-admin { background: linear-gradient(180deg, #d4af37 0%, #8a7322 100%); color: #1a1a1a; grid-column: span 2; border: 1px solid #ffd700; margin-top: 4px; display: none; }
        .btn-admin:hover { background: linear-gradient(180deg, #ffd700 0%, #a68a28 100%); }

        .btn-logout { background: #444; color: #ccc; }
        .btn-logout:hover { background: #555; }
        .secret-tag { color: #e74c3c; font-size: 0.7rem; }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <div class="header">村岡王国 国民証</div>
        <div class="icon-box">⛏️</div>
        
        <div class="info-group">
            <div class="label">国民ID (Email)</div>
            <div class="value" id="user-email">-</div>

            <div class="label">現在の称号</div>
            <div class="value"><span class="badge" id="user-rank">読み込み中...</span></div>
        </div>

        <div class="label">納税報酬の受取口座</div>
        <select id="tax-wallet-select">
            <option value="">口座を読み込み中...</option>
        </select>

        <button class="btn-tax" onclick="payTax()">💰 本日の納税を行う（+100G）</button>

        <!-- メニューボタン（2列グリッド化） -->
        <div class="nav-grid">
            <button class="btn-bank" onclick="location.href='/wallet'">🏦 王国中央銀行</button>
            <button class="btn-inventory" onclick="location.href='/inventory'">🎒 所持品（バッグ）</button>
            <button class="btn-board" onclick="location.href='/board'">📜 王国回覧板</button>
            <button class="btn-market" onclick="location.href='/market'">⚖️ 王国自由市場</button>
            <button class="btn-casino" onclick="location.href='/casino'">🎰 王国カジノ（一攫千金）</button>
            
            <!-- 国王専用ボタン（初期状態は非表示） -->
            <button id="btn-admin-items" class="btn-admin" onclick="location.href='/admin_items'">👑 アイテム管理（国王専用）</button>
        </div>
    </div>

    <div class="card">
        <div class="header">国民登録情報の変更</div>
        <div class="label">表のニックネーム (全体公開)</div>
        <input type="text" id="nickname" placeholder="例: 鉱山ハナコ">

        <div class="label">本名 <span class="secret-tag">※国王のみ知る(完全非公開)</span></div>
        <input type="text" id="real-name" placeholder="例: 村岡 太郎">

        <button onclick="saveProfile()">情報を保存する</button>
    </div>

    <button class="btn-logout" onclick="logout()">王国を離脱（ログアウト）</button>
</div>

<script>
    // エスケープ関数を最上部に定義
    function escapeHtml(str) { 
        return str ? str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;") : ''; 
    }

    const token = localStorage.getItem("access_token");
    if (!token) {
        window.location.href = "/";
    } else {
        document.getElementById("user-email").innerText = localStorage.getItem("user_email") || "";
        loadProfile();
        loadWalletsForTax();
    }

    function getRankName(balance) {
        if (balance <= 100) return "鉱山労働奴隷";
        if (balance <= 500) return "商人に雇われた奴隷";
        if (balance <= 1000) return "平民";
        if (balance <= 1500) return "金持ち";
        if (balance <= 10000) return "貴族";
        return "王族";
    }

    async function loadProfile() {
        try {
            const res = await fetch("/api/profile", { headers: { "Authorization": `Bearer ${token}` } });
            if (res.ok) {
                const data = await res.json();
                document.getElementById("nickname").value = data.nickname || "";
                document.getElementById("real-name").value = data.real_name || "";

                // 国王権限チェック（is_king または role === 'king' 等の判定）
                if (data.is_king || data.role === "king") {
                    document.getElementById("btn-admin-items").style.display = "block";
                }
            }
        } catch (e) {
            console.error(e);
        }
    }

    async function loadWalletsForTax() {
        try {
            const res = await fetch("/api/wallets", { headers: { "Authorization": `Bearer ${token}` } });
            if (res.ok) {
                const wallets = await res.json();
                
                const totalBalance = wallets.reduce((sum, w) => sum + (w.balance || 0), 0);
                document.getElementById("user-rank").innerText = getRankName(totalBalance);

                const select = document.getElementById("tax-wallet-select");
                if (wallets.length === 0) {
                    select.innerHTML = '<option value="">口座がありません</option>';
                    return;
                }

                select.innerHTML = wallets.map(w => 
                    `<option value="${w.wallet_id}">${escapeHtml(w.wallet_name)} (${w.wallet_id}) - 残高:${w.balance}G</option>`
                ).join('');
            }
        } catch (e) {
            console.error(e);
        }
    }

    async function saveProfile() {
        const nickname = document.getElementById("nickname").value;
        const real_name = document.getElementById("real-name").value;
        try {
            const res = await fetch("/api/profile", {
                method: "POST",
                headers: { "Content-Type": "application/json", "Authorization": `Bearer ${token}` },
                body: JSON.stringify({ nickname, real_name })
            });
            const data = await res.json();
            alert(data.message);
            loadProfile();
        } catch (e) {
            console.error(e);
        }
    }

    async function payTax() {
        const wallet_id = document.getElementById("tax-wallet-select").value;
        if (!wallet_id) return alert("受取口座を選択してください");

        try {
            const res = await fetch("/api/pay-tax", {
                method: "POST",
                headers: { "Content-Type": "application/json", "Authorization": `Bearer ${token}` },
                body: JSON.stringify({ wallet_id })
            });
            const data = await res.json();
            alert(res.ok ? data.message : "エラー: " + data.detail);
            if (res.ok) loadWalletsForTax();
        } catch (e) {
            console.error(e);
        }
    }

    function logout() {
        localStorage.clear();
        window.location.href = "/";
    }
</script>

</body>
</html>
