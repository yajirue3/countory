<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>村岡王国 - 国立機械工場</title>
    <style>
        :root {
            --bg-color: #1a1d20;
            --panel-bg: #24282e;
            --border-color: #3b414a;
            --accent-color: #4a90e2;
            --accent-orange: #d97706;
            --success-color: #10b981;
            --text-main: #d1d5db;
            --text-dim: #6b7280;
        }

        body { 
            background: var(--bg-color); 
            color: var(--text-main); 
            font-family: 'Consolas', 'Courier New', monospace; 
            padding: 20px; 
            display: flex;
            justify-content: center;
            margin: 0;
        }

        .factory-container { 
            width: 100%;
            max-width: 640px; 
            background: var(--panel-bg); 
            padding: 24px; 
            border-radius: 4px; 
            border: 2px solid var(--border-color);
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5), 0 8px 20px rgba(0,0,0,0.6);
            box-sizing: border-box;
        }

        .header-panel {
            border-bottom: 2px dashed var(--border-color);
            padding-bottom: 12px;
            margin-bottom: 16px;
            text-align: left;
        }

        .header-panel h2 {
            margin: 0 0 8px 0;
            font-size: 1.1rem;
            letter-spacing: 1px;
            color: #f3f4f6;
        }

        select {
            background: #111827;
            color: #3b82f6;
            border: 1px solid var(--border-color);
            padding: 6px 10px;
            font-family: inherit;
            width: 100%;
            box-sizing: border-box;
            border-radius: 4px;
        }

        .track-container {
            background: #111827;
            height: 32px;
            border: 1px solid var(--border-color);
            margin: 16px 0;
            position: relative;
            display: flex;
            align-items: center;
            padding: 0 4px;
        }

        .track-node {
            flex: 1;
            height: 12px;
            background: #1f2937;
            margin: 0 2px;
            border: 1px solid #374151;
            transition: all 0.3s;
        }

        .track-node.active {
            background: var(--accent-color);
            box-shadow: 0 0 8px var(--accent-color);
        }

        .track-node.completed {
            background: #374151;
        }

        .control-panel { 
            background: #1e2227; 
            padding: 20px; 
            border: 1px solid var(--border-color); 
            text-align: left;
            margin-bottom: 16px;
        }

        .panel-title {
            font-size: 0.9rem;
            color: var(--accent-orange);
            margin-bottom: 12px;
            border-left: 3px solid var(--accent-orange);
            padding-left: 8px;
        }

        .btn-machinery { 
            background: #374151; 
            color: #f9fafb; 
            border: 1px solid #4b5563; 
            border-bottom: 3px solid #1f2937;
            padding: 10px 16px; 
            font-weight: bold; 
            font-family: inherit;
            cursor: pointer; 
            margin: 4px 4px 4px 0; 
            display: inline-block;
            transition: all 0.1s;
        }

        .btn-machinery:active { 
            transform: translateY(2px);
            border-bottom-width: 1px;
        }

        .btn-machinery:hover { 
            background: #4b5563; 
        }

        .btn-action {
            background: #2563eb;
            border-color: #1d4ed8;
        }

        .btn-action:hover {
            background: #1d4ed8;
        }

        .gauge-container { 
            width: 100%; 
            background: #111827; 
            height: 24px; 
            border: 1px solid var(--border-color); 
            position: relative; 
            margin: 12px 0;
        }

        .gauge-target { 
            position: absolute; 
            left: 45%; 
            width: 10%; 
            height: 100%; 
            background: rgba(16, 185, 129, 0.3); 
            border-left: 1px solid var(--success-color);
            border-right: 1px solid var(--success-color);
        }

        .gauge-pointer { 
            position: absolute; 
            width: 2px; 
            height: 100%; 
            background: #ef4444; 
            left: 0%; 
        }

        .console-log {
            background: #0d1117;
            border: 1px solid var(--border-color);
            padding: 8px 12px;
            height: 100px;
            overflow-y: auto;
            font-size: 0.8rem;
            color: #10b981;
            text-align: left;
        }

        .btn-back {
            background: #374151;
            color: #ccc;
            border: none;
            padding: 8px 16px;
            margin-top: 12px;
            cursor: pointer;
            width: 100%;
            font-family: inherit;
        }
    </style>
</head>
<body>

<div class="factory-container">
    <div class="header-panel">
        <h2>SYS_MURAOKA // NATIONAL_FACTORY_01</h2>
        <div>
            <label style="font-size: 0.8rem; color: var(--text-dim);">DESTINATION_ACCOUNT:</label>
            <select id="walletSelect"></select>
        </div>
    </div>

    <div class="track-container">
        <div id="node1" class="track-node"></div>
        <div id="node2" class="track-node"></div>
        <div id="node3" class="track-node"></div>
        <div id="node4" class="track-node"></div>
        <div id="node5" class="track-node"></div>
    </div>

    <div class="control-panel">
        <div class="panel-title" id="stepTitle">INITIALIZING...</div>
        <div id="actionArea"></div>
    </div>

    <div class="console-log" id="consoleLog">
        > SYSTEM READY.<br>
    </div>

    <button class="btn-back" onclick="location.href='/dashboard'">◀ 国民証に戻る</button>
</div>

<script>
const token = localStorage.getItem("access_token") || localStorage.getItem("token");

if (!token) {
    window.location.href = "/";
}

let currentSession = null;
let gaugeVal = 0, gaugeDir = 2, gaugeInterval = null;
let tapCount = 0;

async function initFactory() {
    await loadWallets();
    await fetchStatus();
}

function logMessage(msg) {
    const log = document.getElementById('consoleLog');
    log.innerHTML += `> ${msg}<br>`;
    log.scrollTop = log.scrollHeight;
}

function escapeHtml(str) { 
    return str ? str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;") : ''; 
}

async function loadWallets() {
    try {
        const res = await fetch('/api/wallets', { headers: { 'Authorization': `Bearer ${token}` } });
        if (!res.ok) {
            logMessage("<span style='color:#ef4444;'>ERROR: Failed to load wallets. Status: " + res.status + "</span>");
            return;
        }
        const wallets = await res.json();
        const sel = document.getElementById('walletSelect');
        if (wallets.length === 0) {
            sel.innerHTML = '<option value="">口座が存在しません</option>';
            return;
        }
        sel.innerHTML = wallets.map(w => `<option value="${w.wallet_id}">${escapeHtml(w.wallet_name)} (${w.wallet_id}) - 残高:${Math.floor(w.balance)}G</option>`).join('');
    } catch(e) {
        logMessage("<span style='color:#ef4444;'>ERROR: Failed to load wallets.</span>");
    }
}

async function fetchStatus() {
    try {
        const res = await fetch('/api/factory/status', { headers: { 'Authorization': `Bearer ${token}` } });
        const data = await res.json();
        currentSession = data.session;
        renderStep();
    } catch(e) {
        logMessage("<span style='color:#ef4444;'>ERROR: Connection failed.</span>");
    }
}

function updateNodes(currentStep) {
    for (let i = 1; i <= 5; i++) {
        const node = document.getElementById(`node${i}`);
        node.className = 'track-node';
        if (i < currentStep) node.classList.add('completed');
        if (i === currentStep) node.classList.add('active');
    }
}

function renderStep() {
    const step = currentSession.current_step;
    document.getElementById('stepTitle').innerText = currentSession.title;
    updateNodes(step);

    const area = document.getElementById('actionArea');
    area.innerHTML = '';

    if (step === 1) {
        area.innerHTML = `<p style="font-size:0.9rem;">指定仕様: <b style="color:var(--accent-color);">${currentSession.target_part}</b></p>` +
            currentSession.options.map(opt => `<button class="btn-machinery" onclick="submitStep(${step}, '${opt}')">${opt}</button>`).join('');
    } else if (step === 2) {
        area.innerHTML = `<p style="font-size:0.9rem;">${currentSession.math_question}</p>
            <input type="number" id="mathAns" step="1" style="background:#111827; color:#fff; border:1px solid var(--border-color); padding:8px; width:80px; font-family:inherit;">
            <button class="btn-machinery btn-action" onclick="submitStep(${step}, parseInt(document.getElementById('mathAns').value, 10))">入力実行</button>`;
    } else if (step === 3) {
        area.innerHTML = `<p style="font-size:0.85rem; color:var(--text-dim);">${currentSession.instruction}</p>
            <div class="gauge-container"><div class="gauge-target"></div><div id="pointer" class="gauge-pointer"></div></div>
            <button class="btn-machinery btn-action" onclick="stopGauge(${step})">クラッチ結合 [LOCK]</button>`;
        startGauge();
    } else if (step === 4) {
        tapCount = 0;
        area.innerHTML = `<p style="font-size:0.85rem; color:var(--text-dim);">${currentSession.instruction}</p>
            <p style="font-size:1.1rem; font-weight:bold;">圧力: <span id="taps" style="color:var(--accent-orange);">0</span> / 10 Bar</p>
            <button class="btn-machinery btn-action" onclick="countTap(${step})">加圧ストローク [PUMP]</button>`;
    } else if (step === 5) {
        area.innerHTML = `<p style="font-size:0.85rem; color:var(--text-dim);">${currentSession.instruction}</p>
            <button class="btn-machinery" style="background:var(--success-color); border-color:#059669; color:#000;" onclick="submitStep(${step}, true)">出荷シーケンス起動</button>`;
    }
}

function startGauge() {
    gaugeVal = 0;
    gaugeDir = 2;
    clearInterval(gaugeInterval);
    gaugeInterval = setInterval(() => {
        gaugeVal += gaugeDir;
        if (gaugeVal >= 100 || gaugeVal <= 0) gaugeDir *= -1;
        const ptr = document.getElementById('pointer');
        if (ptr) ptr.style.left = `${gaugeVal}%`;
    }, 20);
}

function stopGauge(step) {
    clearInterval(gaugeInterval);
    submitStep(step, Math.floor(gaugeVal)); // 端数をカットして整数化
}

function countTap(step) {
    tapCount++;
    document.getElementById('taps').innerText = tapCount;
    if (tapCount >= 10) {
        submitStep(step, tapCount);
    }
}

async function submitStep(step, answer) {
    const walletId = document.getElementById('walletSelect').value;
    
    if (step === 5 && !walletId) {
        logMessage("<span style='color:#ef4444;'>ERROR: 出荷先口座を選択してください。</span>");
        return;
    }

    try {
        const res = await fetch('/api/factory/process', {
            method: 'POST',
            headers: { 
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${token}` 
            },
            body: JSON.stringify({ step: step, answer: answer, wallet_id: walletId })
        });
        
        const data = await res.json();
        
        if (!res.ok) {
            logMessage(`<span style="color:#ef4444;">${data.detail}</span>`);
            await fetchStatus();
            return;
        }

        if (data.completed) {
            logMessage(`<span style="color:var(--success-color);">${data.message}</span>`);
            await loadWallets();
        } else {
            logMessage(`工程 [STEP 0${step}] 正常完了。次工程へ移行。`);
        }

        currentSession = data.next_step;
        renderStep();
    } catch(e) {
        logMessage("<span style='color:#ef4444;'>ERROR: リクエストの送信に失敗しました。</span>");
    }
}

window.onload = initFactory;
</script>
</body>
</html>
