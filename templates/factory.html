<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>村岡王国 - 国立機械工場</title>
    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        :root {
            --bg-color: #0b0c10;
            --panel-bg: #1f2833;
            --border-color: #45a29e;
            --accent-color: #66fcf1;
            --accent-orange: #d97706;
            --text-main: #c5c6c7;
        }

        body { 
            background: var(--bg-color); color: var(--text-main); 
            font-family: 'Consolas', 'Courier New', monospace; 
            padding: 10px; display: flex; justify-content: center; margin: 0; overflow-x: hidden;
        }

        .factory-container { 
            width: 100%; max-width: 680px; background: var(--panel-bg); 
            border: 2px solid var(--border-color);
            box-shadow: 0 0 20px rgba(102, 252, 241, 0.1); box-sizing: border-box;
            display: flex; flex-direction: column;
        }

        #viewport-3d {
            width: 100%; height: 280px; background: #000;
            border-bottom: 2px solid var(--border-color);
            position: relative; overflow: hidden;
        }

        .cctv-osd {
            position: absolute; top: 10px; left: 10px; right: 10px; pointer-events: none;
            color: #fff; font-size: 0.8rem; text-shadow: 1px 1px 2px #000;
            display: flex; justify-content: space-between; font-weight: bold;
            opacity: 0.8;
        }
        .cctv-osd .red-dot {
            display: inline-block; width: 10px; height: 10px; background: #ff003c; border-radius: 50%;
            animation: blink 1s infinite; margin-right: 6px; box-shadow: 0 0 8px #ff003c;
        }
        @keyframes blink { 50% { opacity: 0.3; } }

        .ui-section { padding: 15px; }
        .header-panel {
            border-bottom: 1px dashed var(--border-color); padding-bottom: 10px; margin-bottom: 10px;
            display: flex; justify-content: space-between; align-items: flex-end;
        }
        .header-panel h2 { margin: 0; font-size: 1.2rem; color: var(--accent-color); }

        select { background: #0b0c10; color: var(--accent-color); border: 1px solid var(--border-color); padding: 4px 8px; font-family: inherit; }

        .wear-container { font-size: 0.8rem; margin-top: 5px; color: var(--accent-orange); display: flex; align-items: center; gap: 10px; }
        .wear-bar-bg { flex: 1; height: 10px; background: #111; border: 1px solid #333; }
        .wear-bar-fill { height: 100%; background: var(--accent-orange); width: 0%; transition: width 0.3s; }

        .track-container { background: #0b0c10; height: 16px; border: 1px solid var(--border-color); margin: 15px 0; display: flex; align-items: center; padding: 0 2px; }
        .track-node { flex: 1; height: 6px; background: #222; margin: 0 2px; transition: all 0.3s; }
        .track-node.active { background: var(--accent-color); box-shadow: 0 0 10px var(--accent-color); }
        .track-node.completed { background: #45a29e; }

        .control-panel { background: #15181c; padding: 15px; border: 1px solid #333; min-height: 130px; }
        .panel-title { font-size: 0.95rem; color: var(--accent-color); margin-bottom: 12px; border-left: 4px solid var(--accent-color); padding-left: 8px; }

        .btn-machinery { 
            background: #2b323c; color: #fff; border: 1px solid #45a29e; border-bottom: 4px solid #1a1f26;
            padding: 10px 14px; font-weight: bold; font-family: inherit; cursor: pointer; 
            margin: 4px; transition: all 0.1s; font-size: 0.85rem;
        }
        .btn-machinery:active { transform: translateY(3px); border-bottom-width: 1px; }
        .btn-machinery:hover { background: #3c4654; }
        
        .btn-action { background: #145250; border-color: #66fcf1; }
        .btn-action:hover { background: #1a6b68; }
        .btn-maint { background: #7a1f1f; border-color: #ff4d4d; width: 100%; margin: 10px 0; display: none; }

        .color-selectors { display: flex; gap: 4px; margin-bottom: 10px; }
        .color-sel { flex: 1; text-align: center; font-size: 0.8rem; font-weight: bold; }

        .gauge-container { width: 100%; background: #0b0c10; height: 24px; border: 1px solid var(--border-color); position: relative; margin: 12px 0; overflow: hidden; }
        .gauge-target { position: absolute; left: 45%; width: 10%; height: 100%; background: rgba(102, 252, 241, 0.2); border-left: 2px solid var(--accent-color); border-right: 2px solid var(--accent-color); }
        .gauge-pointer { position: absolute; width: 3px; height: 100%; background: #ff003c; left: 0%; box-shadow: 0 0 5px #ff003c; }

        .console-log { background: #0b0c10; border: 1px solid #333; padding: 10px; height: 80px; overflow-y: auto; font-size: 0.8rem; color: #45a29e; margin-top: 10px; }
        .btn-back { background: #222; color: #888; border: 1px solid #444; padding: 10px; margin-top: 10px; cursor: pointer; width: 100%; font-family: inherit; }
        .btn-back:hover { color: #fff; background: #333; }

        .shake { animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes shake {
            10%, 90% { transform: translate3d(-2px, 2px, 0) rotate(-1deg); }
            20%, 80% { transform: translate3d(3px, -2px, 0) rotate(1deg); }
            30%, 50%, 70% { transform: translate3d(-5px, 3px, 0) rotate(-2deg); }
            40%, 60% { transform: translate3d(5px, -3px, 0) rotate(2deg); }
        }
    </style>
</head>
<body>

<div class="factory-container" id="main-container">
    <div id="viewport-3d">
        <div class="cctv-osd">
            <div><span class="red-dot"></span>SYS_REC</div>
            <div id="cctv-cam">CAM-01 [RECEIVE]</div>
        </div>
    </div>

    <div class="ui-section">
        <div class="header-panel">
            <div>
                <h2>FACTORY_MURAOKA_01</h2>
                <div class="wear-container">
                    <span>TOOL WEAR:</span>
                    <div class="wear-bar-bg"><div class="wear-bar-fill" id="wearBar"></div></div>
                    <span id="wearText">0%</span>
                </div>
            </div>
            <div>
                <label style="font-size: 0.7rem; color: var(--text-dim); display:block;">DEST_ACCOUNT:</label>
                <select id="walletSelect"></select>
            </div>
        </div>

        <button id="btnMaint" class="btn-machinery btn-maint" onclick="performMaintenance()">⚠️ 設備摩耗限界 - 手動パージ実行</button>

        <div class="track-container">
            <div id="node1" class="track-node"></div><div id="node2" class="track-node"></div>
            <div id="node3" class="track-node"></div><div id="node4" class="track-node"></div>
            <div id="node5" class="track-node"></div>
        </div>

        <div class="control-panel">
            <div class="panel-title" id="stepTitle">INITIALIZING...</div>
            <div id="actionArea"></div>
        </div>

        <div class="console-log" id="consoleLog">> SYSTEM BOOT.<br></div>
        <button class="btn-back" onclick="location.href='/dashboard'">◀ 退出</button>
    </div>
</div>

<script>
// --- Web Audio API ---
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playSound(type) {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);
    const now = audioCtx.currentTime;

    if (type === 'click') {
        osc.type = 'square'; osc.frequency.setValueAtTime(900, now); osc.frequency.exponentialRampToValueAtTime(300, now + 0.05);
        gain.gain.setValueAtTime(0.1, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
        osc.start(now); osc.stop(now + 0.05);
    } else if (type === 'error') {
        osc.type = 'sawtooth'; osc.frequency.setValueAtTime(100, now);
        gain.gain.setValueAtTime(0.2, now); gain.gain.linearRampToValueAtTime(0, now + 0.4);
        osc.start(now); osc.stop(now + 0.4);
    } else if (type === 'heavy') { 
        osc.type = 'square'; osc.frequency.setValueAtTime(150, now); osc.frequency.exponentialRampToValueAtTime(20, now + 0.3);
        gain.gain.setValueAtTime(0.4, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
        osc.start(now); osc.stop(now + 0.3);
    }
}

// --- Three.js Setup (ディテールアップ版) ---
const vp = document.getElementById('viewport-3d');
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x050505, 5, 20);
const camera = new THREE.PerspectiveCamera(45, vp.clientWidth / vp.clientHeight, 0.1, 100);
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setSize(vp.clientWidth, vp.clientHeight);
renderer.setClearColor(0x050505);
renderer.shadowMap.enabled = true; // 影を有効化
vp.appendChild(renderer.domElement);

// Lighting
const ambientLight = new THREE.AmbientLight(0x222222);
scene.add(ambientLight);
const spotLight = new THREE.SpotLight(0xffffff, 1.2);
spotLight.position.set(2, 8, 4);
spotLight.angle = Math.PI / 4;
spotLight.penumbra = 0.5;
spotLight.castShadow = true;
scene.add(spotLight);

// Materials
const matBase = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.8, metalness: 0.3 });
const matSteel = new THREE.MeshStandardMaterial({ color: 0x444444, roughness: 0.5, metalness: 0.7 });
const matBrass = new THREE.MeshStandardMaterial({ color: 0x886633, roughness: 0.3, metalness: 0.9 });
const matPatliteOff = new THREE.MeshBasicMaterial({ color: 0x111111 });

// Background Stage
const floor = new THREE.Mesh(new THREE.PlaneGeometry(20, 20), matBase);
floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true;
scene.add(floor);
const backWall = new THREE.Mesh(new THREE.BoxGeometry(20, 10, 1), matBase);
backWall.position.set(0, 5, -3); backWall.receiveShadow = true;
scene.add(backWall);

// Central Object Group (切り替え用)
let centerGroup = new THREE.Group();
scene.add(centerGroup);

// Patlite
const patlite = new THREE.Group();
patlite.position.set(-2, 3, -1);
const lRed = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, 0.3), matPatliteOff); lRed.position.y = 0.9;
const lYel = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, 0.3), matPatliteOff); lYel.position.y = 0.6;
const lGrn = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, 0.3), matPatliteOff); lGrn.position.y = 0.3;
patlite.add(lRed, lYel, lGrn, new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 0.3), matSteel));
scene.add(patlite);

function setPatlite(status) {
    lRed.material = matPatliteOff; lYel.material = matPatliteOff; lGrn.material = matPatliteOff;
    if(status === 'error') lRed.material = new THREE.MeshBasicMaterial({ color: 0xff0000 });
    if(status === 'warn') lYel.material = new THREE.MeshBasicMaterial({ color: 0xffaa00 });
    if(status === 'ok') lGrn.material = new THREE.MeshBasicMaterial({ color: 0x00ff00 });
}

// Helper: Build Resistor (工程2)
function createResistor() {
    const group = new THREE.Group();
    const body = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 1.2, 16), new THREE.MeshStandardMaterial({color: 0xeebb99}));
    body.rotation.z = Math.PI / 2; body.castShadow = true; group.add(body);
    // Caps
    const cap1 = new THREE.Mesh(new THREE.CylinderGeometry(0.32, 0.32, 0.2, 16), matSteel);
    cap1.rotation.z = Math.PI / 2; cap1.position.x = 0.7; group.add(cap1);
    const cap2 = cap1.clone(); cap2.position.x = -0.7; group.add(cap2);
    // Wires
    const wire = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 1.0), matSteel);
    wire.rotation.z = Math.PI / 2; wire.position.x = 1.3; group.add(wire);
    const wire2 = wire.clone(); wire2.position.x = -1.3; group.add(wire2);
    
    // 4 Bands (Update dynamically)
    const bandGeo = new THREE.CylinderGeometry(0.31, 0.31, 0.1, 16);
    const bands = [];
    for(let i=0; i<4; i++) {
        const b = new THREE.Mesh(bandGeo, new THREE.MeshBasicMaterial({color:0x000000}));
        b.rotation.z = Math.PI / 2; b.position.x = -0.4 + (i * 0.25);
        group.add(b); bands.push(b);
    }
    return { mesh: group, bands: bands };
}

// Helper: Build Gear (工程3)
function createGear() {
    const shape = new THREE.Shape();
    const teeth = 12; const rOut = 0.8; const rIn = 0.6;
    for(let i=0; i<teeth*2; i++) {
        const a = (i / (teeth*2)) * Math.PI * 2;
        const r = i % 2 === 0 ? rOut : rIn;
        if(i===0) shape.moveTo(Math.cos(a)*r, Math.sin(a)*r);
        else shape.lineTo(Math.cos(a)*r, Math.sin(a)*r);
    }
    const extrudeSettings = { depth: 0.2, bevelEnabled: false };
    const geo = new THREE.ExtrudeGeometry(shape, extrudeSettings);
    const mesh = new THREE.Mesh(geo, matBrass);
    mesh.castShadow = true;
    return mesh;
}

let activeResistorBands = null;
let activeGears = null;

function buildSceneForStep(step) {
    while(centerGroup.children.length > 0) centerGroup.remove(centerGroup.children[0]);
    activeResistorBands = null; activeGears = null;

    if (step === 1) {
        const box = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.5, 1), matSteel);
        box.position.y = 0.25; box.castShadow = true; centerGroup.add(box);
    } else if (step === 2) {
        const rObj = createResistor();
        rObj.mesh.position.y = 1; centerGroup.add(rObj.mesh);
        activeResistorBands = rObj.bands;
    } else if (step === 3) {
        const g1 = createGear(); g1.position.set(0, 1.5, 0); centerGroup.add(g1);
        const g2 = createGear(); g2.position.set(0, 1.5, 0.3); centerGroup.add(g2);
        activeGears = [g1, g2];
    } else if (step === 4) {
        const cyl = new THREE.Mesh(new THREE.CylinderGeometry(0.6, 0.6, 2), matSteel);
        cyl.position.y = 1; cyl.castShadow = true; centerGroup.add(cyl);
        const rod = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 1.5), matBrass);
        rod.position.y = 2.5; rod.castShadow = true; centerGroup.add(rod);
        activeGears = [rod]; // Reusing var for animation
    } else if (step === 5) {
        const anvil = new THREE.Mesh(new THREE.BoxGeometry(2, 0.5, 2), matSteel);
        anvil.position.y = 0.25; anvil.castShadow = true; centerGroup.add(anvil);
        const press = new THREE.Mesh(new THREE.BoxGeometry(1.5, 2, 1.5), matSteel);
        press.position.y = 3; press.castShadow = true; centerGroup.add(press);
    }
}

const camViews = [
    { pos: [0, 4, 6], look: [0, 1, 0], text: "CAM-00 [STANDBY]" },
    { pos: [-3, 3, 3], look: [0, 0, 0], text: "CAM-01 [RECEIVE]" },
    { pos: [0, 2, 2.5], look: [0, 1, 0], text: "CAM-02 [CALIBRATE]" },
    { pos: [2, 2, 3], look: [0, 1.5, 0], text: "CAM-03 [CLUTCH]" },
    { pos: [0, 3, 4], look: [0, 1.5, 0], text: "CAM-04 [PRESSURE]" },
    { pos: [3, 4, 4], look: [0, 1, 0], text: "CAM-05 [PRESS_OUT]" }
];

function setCamera(step) {
    const v = camViews[step] || camViews[0];
    camera.position.set(...v.pos);
    camera.lookAt(...v.look);
    document.getElementById('cctv-cam').innerText = v.text;
    playSound('click');
}

// Loop
function animate() {
    requestAnimationFrame(animate);
    if(activeGears && activeGears.length === 2 && !isLocked) {
        activeGears[0].rotation.z += 0.05;
        activeGears[1].rotation.z -= 0.03; // Sync visually later
    }
    renderer.render(scene, camera);
}
animate();

// --- Application Logic ---
const token = localStorage.getItem("access_token") || localStorage.getItem("token");
if (!token) window.location.href = "/";

let currentSession = null;
let gaugeVal = 0, gaugeDir = 2, gaugeInterval = null;
let tapCount = 0;
let isLocked = false;

const colorCodes = [
    {n:"黒", v:0, c:"#000000", tc:"#fff"}, {n:"茶", v:1, c:"#654321", tc:"#fff"},
    {n:"赤", v:2, c:"#ff0000", tc:"#fff"}, {n:"橙", v:3, c:"#ff8c00", tc:"#000"},
    {n:"黄", v:4, c:"#ffd700", tc:"#000"}, {n:"緑", v:5, c:"#008000", tc:"#fff"},
    {n:"青", v:6, c:"#0000ff", tc:"#fff"}, {n:"紫", v:7, c:"#800080", tc:"#fff"},
    {n:"灰", v:8, c:"#808080", tc:"#fff"}, {n:"白", v:9, c:"#ffffff", tc:"#000"},
    {n:"金", v:10, c:"#d4af37", tc:"#000"}, {n:"銀", v:11, c:"#c0c0c0", tc:"#000"}
];

async function initFactory() {
    await loadWallets();
    await fetchStatus();
}

function logMessage(msg) {
    const log = document.getElementById('consoleLog');
    log.innerHTML += `> ${msg}<br>`; log.scrollTop = log.scrollHeight;
}

async function loadWallets() {
    try {
        const res = await fetch('/api/wallets', { headers: { 'Authorization': `Bearer ${token}` } });
        if (!res.ok) return;
        const wallets = await res.json();
        const sel = document.getElementById('walletSelect');
        sel.innerHTML = wallets.length === 0 ? '<option value="">口座なし</option>' : wallets.map(w => `<option value="${w.wallet_id}">${w.wallet_name} - ${Math.floor(w.balance)}G</option>`).join('');
    } catch(e) {}
}

async function fetchStatus() {
    try {
        const res = await fetch('/api/factory/status', { headers: { 'Authorization': `Bearer ${token}` } });
        const data = await res.json();
        currentSession = data.session;
        updateWear(data.wear);
        renderStep();
    } catch(e) { logMessage("<span style='color:#ff003c;'>ERROR: Connection failed.</span>"); }
}

function updateWear(wear) {
    document.getElementById('wearBar').style.width = `${wear}%`;
    document.getElementById('wearText').innerText = `${wear}%`;
    if (wear >= 100) {
        document.getElementById('btnMaint').style.display = 'block';
        isLocked = true; setPatlite('error');
    } else {
        document.getElementById('btnMaint').style.display = 'none';
        isLocked = false; setPatlite('warn');
    }
}

async function performMaintenance() {
    playSound('heavy');
    try {
        const res = await fetch('/api/factory/maintain', { method: 'POST', headers: { 'Authorization': `Bearer ${token}` } });
        const data = await res.json();
        logMessage(`<span style="color:var(--success-color);">${data.message}</span>`);
        updateWear(data.wear); setPatlite('ok');
    } catch(e) {}
}

function updateNodes(currentStep) {
    for (let i = 1; i <= 5; i++) {
        const node = document.getElementById(`node${i}`);
        node.className = 'track-node';
        if (i < currentStep) node.classList.add('completed');
        if (i === currentStep) node.classList.add('active');
    }
}

function renderStep() {
    if(!currentSession) return;
    const step = currentSession.current_step;
    document.getElementById('stepTitle').innerText = currentSession.title;
    updateNodes(step);
    buildSceneForStep(step);
    setCamera(step);
    if(!isLocked) setPatlite('warn');

    const area = document.getElementById('actionArea');
    area.innerHTML = '';

    if (step === 1) {
        area.innerHTML = currentSession.options.map(opt => `<button class="btn-machinery" onclick="submitStep(${step}, '${opt}')">${opt}</button>`).join('');
    } else if (step === 2) {
        const opts = colorCodes.slice(0,10).map(c => `<option value="${c.v}" style="background:${c.c}; color:${c.tc}">${c.n}</option>`).join('');
        const mOpts = colorCodes.slice(0,5).map(c => `<option value="${c.v}" style="background:${c.c}; color:${c.tc}">x10^${c.v} (${c.n})</option>`).join('');
        const tolOpts = `<option value="10" style="background:#d4af37; color:#000">金(±5%)</option><option value="11" style="background:#c0c0c0; color:#000">銀(±10%)</option>`;
        
        area.innerHTML = `<p style="font-size:0.85rem; color:var(--accent-color);">${currentSession.math_question}</p>
            <div class="color-selectors">
                <select id="col1" class="color-sel" onchange="updateBandColors()">${opts}</select>
                <select id="col2" class="color-sel" onchange="updateBandColors()">${opts}</select>
                <select id="colM" class="color-sel" onchange="updateBandColors()">${mOpts}</select>
                <select id="colT" class="color-sel" onchange="updateBandColors()">${tolOpts}</select>
            </div>
            <button class="btn-machinery btn-action" onclick="submitColorCode()">カラーバンド書込</button>`;
        updateBandColors();
    } else if (step === 3) {
        area.innerHTML = `<p style="font-size:0.8rem; color:var(--text-dim);">${currentSession.instruction}</p>
            <div class="gauge-container"><div class="gauge-target"></div><div id="pointer" class="gauge-pointer"></div></div>
            <button class="btn-machinery btn-action" onclick="stopGauge(${step})">クラッチ結合 [LOCK]</button>`;
        startGauge();
    } else if (step === 4) {
        tapCount = 0;
        area.innerHTML = `<p style="font-size:0.8rem; color:var(--text-dim);">${currentSession.instruction}</p>
            <p style="font-size:1.2rem; font-weight:bold; color:var(--accent-orange)">圧力: <span id="taps">0</span> / 10 Bar</p>
            <button class="btn-machinery btn-action" onclick="countTap(${step})">加圧ストローク [PUMP]</button>`;
    } else if (step === 5) {
        area.innerHTML = `<p style="font-size:0.8rem; color:var(--text-dim);">${currentSession.instruction}</p>
            <button class="btn-machinery" style="background:var(--accent-color); border-color:#fff; color:#000;" onclick="submitStep(${step}, true)">出荷打刻・転送</button>`;
    }
}

function updateBandColors() {
    if(!activeResistorBands) return;
    const v1 = parseInt(document.getElementById('col1').value);
    const v2 = parseInt(document.getElementById('col2').value);
    const vm = parseInt(document.getElementById('colM').value);
    const vt = parseInt(document.getElementById('colT').value);
    const vals = [v1, v2, vm, vt];
    for(let i=0; i<4; i++) {
        activeResistorBands[i].material.color.set(colorCodes.find(c=>c.v === vals[i]).c);
    }
}

function submitColorCode() {
    const v1 = parseInt(document.getElementById('col1').value);
    const v2 = parseInt(document.getElementById('col2').value);
    const vm = parseInt(document.getElementById('colM').value);
    const vt = parseInt(document.getElementById('colT').value);
    submitStep(2, [v1, v2, vm, vt]);
}

function startGauge() {
    gaugeVal = 0; gaugeDir = 2; clearInterval(gaugeInterval);
    gaugeInterval = setInterval(() => {
        gaugeVal += gaugeDir;
        if (gaugeVal >= 100 || gaugeVal <= 0) gaugeDir *= -1;
        const ptr = document.getElementById('pointer');
        if (ptr) ptr.style.left = `${gaugeVal}%`;
        if (gaugeVal % 20 === 0) playSound('click');
    }, 20);
}

function stopGauge(step) {
    clearInterval(gaugeInterval);
    submitStep(step, Math.floor(gaugeVal));
}

function countTap(step) {
    if(isLocked) return;
    tapCount++; playSound('heavy');
    if(activeGears && activeGears[0]) activeGears[0].position.y -= 0.1; // visual pump
    setTimeout(()=>{ if(activeGears && activeGears[0]) activeGears[0].position.y += 0.1; }, 100);
    document.getElementById('taps').innerText = tapCount;
    if (tapCount >= 10) submitStep(step, tapCount);
}

function triggerShake() {
    const container = document.getElementById("main-container");
    container.classList.remove("shake"); void container.offsetWidth; container.classList.add("shake");
}

async function submitStep(step, answer) {
    if (isLocked) return;
    const walletId = document.getElementById('walletSelect').value;
    
    if (step === 5 && !walletId) {
        logMessage("<span style='color:#ff003c;'>ERROR: 出荷先口座を選択してください。</span>");
        playSound('error'); setPatlite('error'); return;
    }

    try {
        const res = await fetch('/api/factory/process', {
            method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
            body: JSON.stringify({ step: step, answer: answer, wallet_id: walletId })
        });
        
        const data = await res.json();
        
        if (!res.ok) {
            logMessage(`<span style="color:#ff003c;">${data.detail}</span>`);
            playSound('error'); setPatlite('error');
            if(data.detail.includes("WEAR")) updateWear(100);
            else {
                centerGroup.position.y -= 2; // scrap drop
                setTimeout(()=> { centerGroup.position.y = 0; fetchStatus(); }, 1500);
            }
            return;
        }

        updateWear(data.wear);
        playSound('click'); setPatlite('ok');

        if (step === 5) { playSound('heavy'); triggerShake(); }

        if (data.completed) {
            logMessage(`<span style="color:var(--success-color);">${data.message}</span>`);
            await loadWallets();
        } else {
            logMessage(`工程 [STEP 0${step}] 正常完了。次工程へ移行。`);
        }

        currentSession = data.next_step;
        setTimeout(() => renderStep(), 800);
    } catch(e) { logMessage("<span style='color:#ff003c;'>ERROR: リクエスト送信失敗。</span>"); }
}

window.onload = initFactory;
</script>
</body>
</html>
