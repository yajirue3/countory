<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>村岡王国 - 国立機械工場</title>
    <style>
        body { background: #1f242d; color: #fff; font-family: sans-serif; padding: 20px; text-align: center; }
        .factory-container { max-width: 600px; margin: 0 auto; background: #2d323e; padding: 20px; border-radius: 12px; border: 2px solid #444; }
        
        /* ベルトコンベアアニメーション */
        .conveyor-belt {
            height: 80px; background: #111; margin: 20px 0; border-radius: 8px; position: relative; overflow: hidden;
            border-bottom: 5px dashed #ffa500; animation: belt-move 2s linear infinite;
        }
        @keyframes belt-move { from { background-position: 0 0; } to { background-position: 50px 0; } }

        .product-item {
            width: 50px; height: 50px; background: #ff4757; position: absolute; top: 15px; left: 10%;
            border-radius: 8px; transition: left 0.5s ease-in-out, transform 0.3s;
        }
        .product-item.assembling { animation: pulse 0.5s infinite alternate; }
        @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.1); } }

        .step-box { background: #3a404d; padding: 20px; border-radius: 8px; margin-top: 15px; }
        .btn { background: #ffa500; color: #000; border: none; padding: 10px 20px; font-weight: bold; border-radius: 4px; cursor: pointer; margin: 5px; }
        .btn:hover { background: #ff8c00; }
        
        /* ゲージスタイル */
        .gauge-bar { width: 100%; background: #555; height: 20px; border-radius: 10px; position: relative; overflow: hidden; }
        .gauge-target { position: absolute; left: 40%; width: 20%; height: 100%; background: #2ed573; }
        .gauge-pointer { position: absolute; width: 5px; height: 100%; background: #fff; left: 0%; }
    </style>
</head>
<body>

<div class="factory-container">
    <h2>⚙️ 村岡王国 国立第1工場</h2>
    <p>振込先口座: <select id="walletSelect"></select></p>

    <!-- コンベア視覚表示 -->
    <div class="conveyor-belt">
        <div id="product" class="product-item"></div>
    </div>

    <h3 id="stepTitle">工程読み込み中...</h3>

    <div class="step-box" id="actionArea">
        <!-- JSで各工程のUIを動的挿入 -->
    </div>
</div>

<script>
let currentSession = null;
let gaugeVal = 0, gaugeDir = 2, gaugeInterval = null;
let tapCount = 0;

async function initFactory() {
    await loadWallets();
    await fetchStatus();
}

async function loadWallets() {
    const res = await fetch('/api/wallets', { headers: { 'Authorization': `Bearer ${localStorage.getItem('token')}` } });
    const wallets = await res.json();
    const sel = document.getElementById('walletSelect');
    sel.innerHTML = wallets.map(w => `<option value="${w.wallet_id}">${w.wallet_name} (${w.balance}G)</option>`).join('');
}

async function fetchStatus() {
    const res = await fetch('/api/factory/status', { headers: { 'Authorization': `Bearer ${localStorage.getItem('token')}` } });
    const data = await res.json();
    currentSession = data.session;
    renderStep();
}

function renderStep() {
    const step = currentSession.current_step;
    document.getElementById('stepTitle').innerText = currentSession.title;
    
    // コンベア上の位置調整アニメーション
    const prod = document.getElementById('product');
    prod.style.left = `${(step - 1) * 20 + 10}%`;
    prod.classList.remove('assembling');

    const area = document.getElementById('actionArea');
    area.innerHTML = '';

    if (step === 1) {
        area.innerHTML = `<p>指定パーツ: <b>${currentSession.target_part}</b></p>` +
            currentSession.options.map(opt => `<button class="btn" onclick="submitStep(${step}, '${opt}')">${opt}</button>`).join('');
    } else if (step === 2) {
        area.innerHTML = `<p>問題: <b>${currentSession.math_question}</b></p>
            <input type="number" id="mathAns" style="padding:8px; width:80px;">
            <button class="btn" onclick="submitStep(${step}, parseInt(document.getElementById('mathAns').value))">回答</button>`;
    } else if (step === 3) {
        area.innerHTML = `<p>${currentSession.instruction}</p>
            <div class="gauge-bar"><div class="gauge-target"></div><div id="pointer" class="gauge-pointer"></div></div><br>
            <button class="btn" onclick="stopGauge(${step})">STOP</button>`;
        startGauge();
    } else if (step === 4) {
        tapCount = 0;
        area.innerHTML = `<p>${currentSession.instruction}</p>
            <p>タップ数: <span id="taps">0</span> / 10</p>
            <button class="btn" onclick="countTap(${step})">圧着！</button>`;
    } else if (step === 5) {
        area.innerHTML = `<p>${currentSession.instruction}</p>
            <button class="btn" style="background:#2ed573;" onclick="submitStep(${step}, true)">出荷する！</button>`;
    }
}

function startGauge() {
    gaugeVal = 0;
    clearInterval(gaugeInterval);
    gaugeInterval = setInterval(() => {
        gaugeVal += gaugeDir;
        if (gaugeVal >= 100 || gaugeVal <= 0) gaugeDir *= -1;
        const ptr = document.getElementById('pointer'
