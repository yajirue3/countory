<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>村岡王国 - 国立機械工場</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        :root {
            --bg-body: #050608; --panel-bg: #15181d; --panel-border: #2a323d;
            --accent-blue: #3b82f6; --accent-orange: #f59e0b; --accent-red: #ef4444;
            --text-main: #e2e8f0; --text-dim: #94a3b8;
        }

        body { 
            background: var(--bg-body); color: var(--text-main); 
            font-family: 'Consolas', monospace; margin: 0; padding: 10px; 
            display: flex; justify-content: center; min-height: 100vh; overflow-x: hidden;
        }

        .app-grid { display: grid; grid-template-columns: 1.4fr 1fr; gap: 15px; width: 100%; max-width: 1200px; }

        @media (max-width: 850px) {
            .app-grid { grid-template-columns: 1fr; }
            .viewport-section { height: 40vh; min-height: 250px; }
            .control-section { border-top: none; }
            .btn-machinery { min-height: 48px; } /* スマホ用タッチ領域 */
        }

        .viewport-section {
            background: #000; border: 2px solid var(--panel-border); border-radius: 8px;
            position: relative; box-shadow: 0 8px 32px rgba(0,0,0,0.8);
            overflow: hidden; display: flex; flex-direction: column;
        }
        #viewport-3d { width: 100%; height: 100%; flex: 1; }

        .cctv-osd {
            position: absolute; top: 12px; left: 12px; right: 12px; pointer-events: none;
            color: #fff; font-size: 0.85rem; text-shadow: 1px 1px 0 #000, -1px -1px 0 #000;
            display: flex; justify-content: space-between; z-index: 10;
        }
        .red-dot {
            display: inline-block; width: 10px; height: 10px; background: #ff003c; border-radius: 50%;
            animation: blink 1s infinite; margin-right: 6px;
        }
        @keyframes blink { 50% { opacity: 0.3; } }

        .control-section {
            background: var(--panel-bg); border: 2px solid var(--panel-border);
            border-radius: 8px; padding: 15px; display: flex; flex-direction: column;
        }
        .header-panel {
            border-bottom: 1px dashed var(--panel-border); padding-bottom: 12px; margin-bottom: 12px;
            display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 10px;
        }
        .header-panel h2 { margin: 0; font-size: 1.1rem; color: var(--accent-blue); width: 100%; }

        select { 
            background: #0b0d10; color: var(--accent-blue); border: 1px solid var(--panel-border); 
            padding: 8px; font-family: inherit; border-radius: 4px; width: 100%;
        }

        .wear-container { font-size: 0.8rem; color: var(--accent-orange); display: flex; align-items: center; gap: 8px; width: 100%; }
        .wear-bar-bg { flex: 1; height: 8px; background: #0b0d10; border: 1px solid #333; }
        .wear-bar-fill { height: 100%; background: var(--accent-orange); width: 0%; transition: width 0.4s ease; }

        .track-container { 
            background: #0b0d10; height: 12px; border: 1px solid var(--panel-border);
            margin: 10px 0 15px 0; display: flex; padding: 2px; gap: 2px;
        }
        .track-node { flex: 1; background: #222; transition: all 0.3s; }
        .track-node.active { background: var(--accent-blue); box-shadow: 0 0 8px var(--accent-blue); }
        .track-node.completed { background: #334155; }

        .action-area { 
            flex: 1; background: #0f1115; padding: 15px; border: 1px solid #1e293b; 
            border-radius: 6px; display: flex; flex-direction: column; gap: 10px;
        }
        .panel-title { font-size: 0.95rem; color: var(--accent-blue); border-left: 3px solid var(--accent-blue); padding-left: 8px; margin: 0;}
        .instruction-box { background: #1e293b; padding: 10px; font-size: 0.85rem; line-height: 1.5; border-radius: 4px; border-left: 3px solid var(--accent-orange);}
        
        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .btn-machinery { 
            background: #1e293b; color: #f8fafc; border: 1px solid #334155; border-bottom: 3px solid #0f172a;
            padding: 12px; font-weight: bold; font-family: inherit; cursor: pointer; 
            border-radius: 4px; transition: transform 0.1s; font-size: 0.85rem;
        }
        .btn-machinery:active { transform: translateY(2px); border-bottom-width: 1px; }
        .btn-machinery:disabled { opacity: 0.5; cursor: not-allowed; transform: none !important; border-bottom-width: 3px !important; }
        
        .btn-action { background: #1d4ed8; border-color: #3b82f6; grid-column: span 2; }
        .btn-maint { background: #991b1b; border-color: #f87171; grid-column: span 2; display: none; margin-bottom: 10px;}

        .color-selectors { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
        .color-sel { text-align: center; font-size: 0.8rem; height: 36px; }

        .gauge-container { width: 100%; background: #000; height: 24px; border: 1px solid var(--panel-border); position: relative; overflow: hidden; }
        .gauge-target { position: absolute; left: 45%; width: 10%; height: 100%; background: rgba(59, 130, 246, 0.2); border-left: 2px solid var(--accent-blue); border-right: 2px solid var(--accent-blue); }
        .gauge-pointer { position: absolute; width: 4px; height: 100%; background: var(--accent-red); left: 0%; box-shadow: 0 0 6px var(--accent-red); }

        .console-log { 
            background: #050608; border: 1px solid #1e293b; padding: 10px; height: 80px; 
            overflow-y: auto; font-size: 0.8rem; color: #10b981; margin-top: 15px; border-radius: 4px;
        }
        .btn-back { background: #1e293b; color: #cbd5e1; border: none; padding: 12px; margin-top: 10px; cursor: pointer; border-radius: 4px; width: 100%;}
        
        .loading-overlay {
            position: absolute; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.7);
            display: flex; justify-content: center; align-items: center; color: var(--accent-blue);
            z-index: 50; display: none; font-weight: bold;
        }
    </style>
</head>
<body>

<div class="app-grid">
    <div class="viewport-section">
        <div class="cctv-osd">
            <div><span class="red-dot"></span>SYS_REC</div>
            <div id="cctv-cam">CAM-01 [RECEIVE]</div>
        </div>
        <div id="viewport-3d"></div>
        <div id="loadingOverlay" class="loading-overlay">TRANSMITTING...</div>
    </div>

    <div class="control-section">
        <div class="header-panel">
            <h2>FACTORY_MURAOKA_01</h2>
            <div class="wear-container">
                <span>WEAR:</span><div class="wear-bar-bg"><div class="wear-bar-fill" id="wearBar"></div></div><span id="wearText">0%</span>
            </div>
            <select id="walletSelect"></select>
        </div>

        <button id="btnMaint" class="btn-machinery btn-maint" onclick="performMaintenance()">⚠️ 設備摩耗限界 - 手動パージ</button>

        <div class="track-container">
            <div id="node1" class="track-node"></div><div id="node2" class="track-node"></div>
            <div id="node3" class="track-node"></div><div id="node4" class="track-node"></div>
            <div id="node5" class="track-node"></div>
        </div>

        <div class="action-area" id="actionArea"></div>

        <div class="console-log" id="consoleLog">> SYSTEM BOOT.<br></div>
        <button class="btn-back" onclick="location.href='/dashboard'">◀ ライン退出</button>
    </div>
</div>

<script>
// --- 音響 ---
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playSound(type) {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);
    const now = audioCtx.currentTime;
    if (type === 'click') {
        osc.type = 'square'; osc.frequency.setValueAtTime(600, now); osc.frequency.exponentialRampToValueAtTime(300, now+0.05);
        gain.gain.setValueAtTime(0.05, now); gain.gain.exponentialRampToValueAtTime(0.01, now+0.05);
        osc.start(now); osc.stop(now+0.05);
    } else if (type === 'heavy') { 
        osc.type = 'square'; osc.frequency.setValueAtTime(100, now); osc.frequency.exponentialRampToValueAtTime(20, now+0.2);
        gain.gain.setValueAtTime(0.2, now); gain.gain.exponentialRampToValueAtTime(0.01, now+0.2);
        osc.start(now); osc.stop(now+0.2);
    }
}

// --- Three.js (軽量＆キャッシュ＆Lerp対応) ---
const vp = document.getElementById('viewport-3d');
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x050608, 0.04);
const camera = new THREE.PerspectiveCamera(35, vp.clientWidth / vp.clientHeight, 0.1, 100);
const renderer = new THREE.WebGLRenderer({ antialias: false, alpha: false, powerPreference: "high-performance" });
renderer.setSize(vp.clientWidth, vp.clientHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // スマホでの激重対策
vp.appendChild(renderer.domElement);

window.addEventListener('resize', () => {
    camera.aspect = vp.clientWidth / vp.clientHeight; camera.updateProjectionMatrix();
    renderer.setSize(vp.clientWidth, vp.clientHeight);
});

// 照明 (軽量化のためShadowは最低限)
const ambientLight = new THREE.AmbientLight(0xffffff, 0.7); scene.add(ambientLight);
const dirLight = new THREE.DirectionalLight(0xfff0dd, 1.2); dirLight.position.set(5, 10, 5); scene.add(dirLight);

// マテリアル (テクスチャ生成廃止、基本Materialで表現)
const matIron = new THREE.MeshStandardMaterial({ color: 0x222428, roughness: 0.9, metalness: 0.4 });
const matSteel = new THREE.MeshStandardMaterial({ color: 0x777c85, roughness: 0.5, metalness: 0.8 });
const matBrass = new THREE.MeshStandardMaterial({ color: 0xa6903f, roughness: 0.4, metalness: 0.9 });
const matHighlight = new THREE.MeshStandardMaterial({ color: 0xd97706, roughness: 0.8 });

// 背景作り込み (H鋼や配管をInstance化せずとも数個置くだけで雰囲気が出る)
const bgGroup = new THREE.Group();
const colGeo = new THREE.BoxGeometry(0.5, 15, 0.5);
for(let i=0; i<4; i++){
    const col = new THREE.Mesh(colGeo, matIron);
    col.position.set(-8 + (i*5), 0, -5); bgGroup.add(col);
    const beam = new THREE.Mesh(new THREE.BoxGeometry(20, 0.5, 0.5), matIron);
    beam.position.set(0, 6, -5 + i*2); bgGroup.add(beam);
}
scene.add(bgGroup);

// --- 全工程のモデルを事前生成してキャッシュ (描画コスト削減) ---
const steps3D = {};

// 1. ベアリング
steps3D[1] = new THREE.Group();
const bOuter = new THREE.Mesh(new THREE.TorusGeometry(0.8, 0.2, 12, 24), matSteel);
bOuter.rotation.x = Math.PI/2; steps3D[1].add(bOuter);

// 2. 抵抗器
steps3D[2] = new THREE.Group();
const rBody = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.4, 1.6, 24), new THREE.MeshStandardMaterial({color:0xcca876}));
rBody.rotation.z = Math.PI/2; steps3D[2].add(rBody);
const bands = [];
for(let i=0; i<4; i++){
    const b = new THREE.Mesh(new THREE.CylinderGeometry(0.42, 0.42, 0.15, 24), new THREE.MeshBasicMaterial({color:0x0}));
    b.rotation.z = Math.PI/2; b.position.x = -0.5 + (i*0.33); steps3D[2].add(b); bands.push(b);
}

// 3. クラッチ (Extrude重いのでCylinderの組み合わせで表現)
steps3D[3] = new THREE.Group();
const gear1 = new THREE.Mesh(new THREE.CylinderGeometry(1, 1, 0.3, 16), matBrass); gear1.position.z = -0.2; gear1.rotation.x = Math.PI/2;
const gear2 = new THREE.Mesh(new THREE.CylinderGeometry(1, 1, 0.3, 16), matBrass); gear2.position.z = 0.3; gear2.rotation.x = Math.PI/2;
steps3D[3].add(gear1, gear2);

// 4. 油圧
steps3D[4] = new THREE.Group();
const cyl = new THREE.Mesh(new THREE.CylinderGeometry(0.8, 0.8, 2, 24), matIron); cyl.position.y = -0.5;
const rod = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 2, 16), matSteel); rod.position.y = 1;
steps3D[4].add(cyl, rod);

// 5. プレス
steps3D[5] = new THREE.Group();
const press = new THREE.Mesh(new THREE.BoxGeometry(2, 1.5, 1.5), matHighlight); press.position.y = 2;
steps3D[5].add(new THREE.Mesh(new THREE.BoxGeometry(3, 0.5, 2), matIron), press);

// シーンに全て追加し、非表示にする
for(let i=1; i<=5; i++) {
    steps3D[i].visible = false;
    scene.add(steps3D[i]);
}

// カメラLerp制御変数
const camTargetPos = new THREE.Vector3(0, 5, 8);
const camTargetLook = new THREE.Vector3(0, 0, 0);
const currentLook = new THREE.Vector3(0, 0, 0);

const camViews = {
    1: { pos: [-3, 4, 4], look: [0, 0, 0], text: "CAM-01 [RECEIVE]" },
    2: { pos: [0, 3, 3.5], look: [0, 0, 0], text: "CAM-02 [CALIBRATE]" },
    3: { pos: [2, 3, 4], look: [0, 0, 0], text: "CAM-03 [CLUTCH]" },
    4: { pos: [1.5, 3, 4], look: [0, 0.5, 0], text: "CAM-04 [PRESSURE]" },
    5: { pos: [3, 4, 5], look: [0, 0.5, 0], text: "CAM-05 [PRESS_OUT]" }
};

function switchStep3D(step) {
    for(let i=1; i<=5; i++) steps3D[i].visible = (i === step);
    const v = camViews[step] || camViews[1];
    camTargetPos.set(...v.pos);
    camTargetLook.set(...v.look);
    document.getElementById('cctv-cam').innerText = v.text;
}

function animate() {
    requestAnimationFrame(animate);
    
    // カメラの滑らかな移動
    camera.position.lerp(camTargetPos, 0.08);
    currentLook.lerp(camTargetLook, 0.08);
    camera.lookAt(currentLook);

    // 機械のアニメーション (表示されている時だけ動かす)
    if(steps3D[3].visible && !isLocked) { gear1.rotation.y += 0.04; gear2.rotation.y -= 0.02; }
    // ピストンの慣性戻り
    if(steps3D[4].visible && rod.position.y < 1.0) { rod.position.y += (1.0 - rod.position.y) * 0.1; }

    renderer.render(scene, camera);
}
animate();


// --- ロジック & 通信 (二重送信防止Mutex導入) ---
const token = localStorage.getItem("access_token") || localStorage.getItem("token");
if (!token) window.location.href = "/";

let currentSession = null, gaugeVal = 0, gaugeDir = 2, gaugeInterval = null, tapCount = 0;
let isLocked = false;
let isFetching = false; // ★API通信中の重複実行を防止

const colorCodes = [
    {n:"黒(0)", v:0, c:"#111"}, {n:"茶(1)", v:1, c:"#654321"}, {n:"赤(2)", v:2, c:"#cc0000"},
    {n:"橙(3)", v:3, c:"#ff8c00"}, {n:"黄(4)", v:4, c:"#ffd700"}, {n:"緑(5)", v:5, c:"#008000"},
    {n:"青(6)", v:6, c:"#0000cd"}, {n:"紫(7)", v:7, c:"#800080"}, {n:"灰(8)", v:8, c:"#808080"},
    {n:"白(9)", v:9, c:"#ffffff"}, {n:"金", v:10, c:"#d4af37"}, {n:"銀", v:11, c:"#c0c0c0"}
];

async function initFactory() {
    await fetch('/api/wallets', { headers: { 'Authorization': `Bearer ${token}` } })
        .then(r=>r.json()).then(w => {
            document.getElementById('walletSelect').innerHTML = w.length===0 ? '<option value="">口座なし</option>' : w.map(x=>`<option value="${x.wallet_id}">${x.wallet_name} - ${Math.floor(x.balance)}G</option>`).join('');
        }).catch(e=>{});
    await fetchStatus();
}

function logMessage(msg) {
    const log = document.getElementById('consoleLog');
    log.innerHTML += `> ${msg}<br>`; log.scrollTop = log.scrollHeight;
}

async function fetchStatus() {
    try {
        const res = await fetch('/api/factory/status', { headers: { 'Authorization': `Bearer ${token}` } });
        const data = await res.json();
        currentSession = data.session;
        updateWear(data.wear); renderStep();
    } catch(e) { logMessage("<span style='color:var(--accent-red);'>ERROR: 通信エラー</span>"); }
}

function updateWear(wear) {
    document.getElementById('wearBar').style.width = `${wear}%`;
    document.getElementById('wearText').innerText = `${wear}%`;
    isLocked = (wear >= 100);
    document.getElementById('btnMaint').style.display = isLocked ? 'block' : 'none';
}

async function performMaintenance() {
    if(isFetching) return; isFetching = true;
    try {
        const res = await fetch('/api/factory/maintain', { method: 'POST', headers: { 'Authorization': `Bearer ${token}` } });
        const data = await res.json();
        logMessage(`<span style="color:var(--accent-blue);">${data.message}</span>`);
        updateWear(data.wear);
    } catch(e) {} finally { isFetching = false; }
}

function renderStep() {
    if(!currentSession) return;
    const step = currentSession.current_step;
    document.getElementById('stepTitle').innerText = currentSession.title;
    switchStep3D(step);
    
    for (let i = 1; i <= 5; i++) {
        const n = document.getElementById(`node${i}`);
        n.className = 'track-node' + (i < step ? ' completed' : (i === step ? ' active' : ''));
    }

    const area = document.getElementById('actionArea');
    
    if (step === 1) {
        area.innerHTML = `<div class="instruction-box">要求仕様: <b style="color:var(--accent-orange);">${currentSession.target_part}</b></div>
            <div class="btn-grid">${currentSession.options.map(opt => `<button class="btn-machinery" onclick="submitStep(${step}, '${opt}')">${opt}</button>`).join('')}</div>`;
    } else if (step === 2) {
        const o1 = colorCodes.slice(0,10).map(c => `<option value="${c.v}" style="background:${c.c}; color:#fff">${c.n}</option>`).join('');
        const om = colorCodes.slice(0,5).map(c => `<option value="${c.v}" style="background:${c.c}; color:#fff">x10^${c.v}</option>`).join('');
        const ot = `<option value="10" style="background:#b8860b; color:#fff">金(±5%)</option><option value="11" style="background:#888; color:#fff">銀(±10%)</option>`;
        area.innerHTML = `<div class="instruction-box">${currentSession.math_question}</div>
            <div class="color-selectors">
                <select id="col1" class="color-sel" onchange="updColor()">${o1}</select>
                <select id="col2" class="color-sel" onchange="updColor()">${o1}</select>
                <select id="colM" class="color-sel" onchange="updColor()">${om}</select>
                <select id="colT" class="color-sel" onchange="updColor()">${ot}</select>
            </div><button class="btn-machinery btn-action" onclick="subCol()">カラーバンド書込</button>`;
        updColor();
    } else if (step === 3) {
        area.innerHTML = `<div class="instruction-box">${currentSession.instruction}</div>
            <div class="gauge-container"><div class="gauge-target"></div><div id="pointer" class="gauge-pointer"></div></div>
            <button class="btn-machinery btn-action" onclick="stopGauge(${step})">クラッチ結合 [LOCK]</button>`;
        startGauge();
    } else if (step === 4) {
        tapCount = 0;
        area.innerHTML = `<div class="instruction-box">${currentSession.instruction}</div>
            <div style="font-size:1.2rem; font-weight:bold; color:var(--accent-blue); text-align:center;">圧力: <span id="taps">0</span> / 10 Bar</div>
            <button class="btn-machinery btn-action" onclick="countTap(${step})">加圧ストローク [PUMP]</button>`;
    } else if (step === 5) {
        area.innerHTML = `<div class="instruction-box">${currentSession.instruction}</div>
            <button class="btn-machinery btn-action" style="background:var(--accent-orange);" onclick="submitStep(${step}, true)">出荷打刻・口座転送</button>`;
    }
}

window.updColor = function() {
    const v = [parseInt(document.getElementById('col1').value), parseInt(document.getElementById('col2').value),
               parseInt(document.getElementById('colM').value), parseInt(document.getElementById('colT').value)];
    for(let i=0; i<4; i++) bands[i].material.color.set(i<3 ? colorCodes.find(c=>c.v===v[i]).c : (v[3]===10?"#d4af37":"#c0c0c0"));
};
window.subCol = function() {
    submitStep(2, [parseInt(document.getElementById('col1').value), parseInt(document.getElementById('col2').value),
                   parseInt(document.getElementById('colM').value), parseInt(document.getElementById('colT').value)]);
};

function startGauge() {
    gaugeVal = 0; gaugeDir = 2; clearInterval(gaugeInterval);
    gaugeInterval = setInterval(() => {
        gaugeVal += gaugeDir;
        if (gaugeVal >= 100 || gaugeVal <= 0) gaugeDir *= -1;
        if(document.getElementById('pointer')) document.getElementById('pointer').style.left = `${gaugeVal}%`;
    }, 20);
}
function stopGauge(step) { clearInterval(gaugeInterval); submitStep(step, Math.floor(gaugeVal)); }

function countTap(step) {
    if(isLocked || isFetching) return;
    tapCount++; playSound('heavy');
    rod.position.y = 0.5; // 沈み込みアニメ (Lerpで自動的に戻る)
    document.getElementById('taps').innerText = tapCount;
    if (tapCount >= 10) submitStep(step, tapCount);
}

// 通信処理 (重複防止ロック付き)
async function submitStep(step, answer) {
    if (isLocked || isFetching) return;
    const walletId = document.getElementById('walletSelect').value;
    if (step === 5 && !walletId) { logMessage("<span style='color:var(--accent-red);'>ERROR: 出荷先口座を選択してください。</span>"); return; }

    isFetching = true;
    document.getElementById('loadingOverlay').style.display = 'flex'; // ローディングUI表示

    try {
        const res = await fetch('/api/factory/process', {
            method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
            body: JSON.stringify({ step: step, answer: answer, wallet_id: walletId })
        });
        const data = await res.json();
        
        if (!res.ok) {
            logMessage(`<span style="color:var(--accent-red);">${data.detail}</span>`); playSound('error');
            if(data.detail.includes("WEAR")) updateWear(100);
            else setTimeout(()=> fetchStatus(), 1000);
            return;
        }

        updateWear(data.wear); playSound('click');
        if (step === 5) { 
            playSound('heavy'); 
            press.position.y = 0.8; setTimeout(()=>{press.position.y = 2;}, 300); // プレスアニメ
        }

        if (data.completed) {
            logMessage(`<span style="color:var(--accent-blue);">${data.message}</span>`);
            fetch('/api/wallets', { headers: { 'Authorization': `Bearer ${token}` } }).then(r=>r.json()).then(w => {
                document.getElementById('walletSelect').innerHTML = w.map(x=>`<option value="${x.wallet_id}">${x.wallet_name} - ${Math.floor(x.balance)}G</option>`).join('');
            });
        }
        currentSession = data.next_step;
        renderStep();
    } catch(e) { logMessage("<span style='color:var(--accent-red);'>ERROR: 通信エラー</span>"); }
    finally {
        isFetching = false;
        document.getElementById('loadingOverlay').style.display = 'none';
    }
}

window.onload = initFactory;
</script>
</body>
</html>
