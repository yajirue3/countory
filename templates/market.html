<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>村岡王国 - 自由市場（エスクロー取引）</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .contract-card { transition: transform 0.2s; border-left: 5px solid #6c757d; }
        .contract-card.status-OPEN { border-left-color: #0d6efd; }
        .contract-card.status-SIGNED { border-left-color: #ffc107; }
        .contract-card.status-COMPLETED { border-left-color: #198754; }
        .contract-card.status-CANCELLED { border-left-color: #dc3545; }
        .star-rating { color: #ffc107; font-size: 1.2rem; }
    </style>
</head>
<body>
    <div class="container py-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>⚖️ 村岡王国 自由市場</h2>
            <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#createContractModal">＋ 新規契約発行</button>
        </div>

        <!-- タブ切り替え -->
        <ul class="nav nav-tabs mb-4" id="marketTabs">
            <li class="nav-item">
                <button class="nav-link active" onclick="switchTab('all')">全契約一覧</button>
            </li>
            <li class="nav-item">
                <button class="nav-link" onclick="switchTab('my')">マイ契約管理</button>
            </li>
        </ul>

        <!-- 契約カード表示エリア -->
        <div id="contractsContainer" class="row g-3">
            <div class="text-center text-muted py-5">データを読み込み中...</div>
        </div>
    </div>

    <!-- 契約新規作成 modal -->
    <div class="modal fade" id="createContractModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">新規契約の発行（エスクロー仮預かり）</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="createContractForm">
                        <div class="mb-3">
                            <label class="form-label">契約タイトル</label>
                            <input type="text" id="cTitle" class="form-control" required placeholder="例: 王国の畑の草むしり">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">依頼内容の詳細</label>
                            <textarea id="cDesc" class="form-control" rows="3" required></textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">報酬金額 (Gold)</label>
                            <input type="number" id="cAmount" class="form-control" min="1" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">支払元ウォレット</label>
                            <select id="cWalletSelect" class="form-select" required></select>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">発行して仮預かり実行</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- 受注 modal -->
    <div class="modal fade" id="acceptContractModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">契約の受注</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="acceptContractForm">
                        <input type="hidden" id="acceptContractId">
                        <div class="mb-3">
                            <label class="form-label">報酬受取先ウォレットを選択</label>
                            <select id="acceptWalletSelect" class="form-select" required></select>
                        </div>
                        <button type="submit" class="btn btn-warning w-100">契約を締結・受注する</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- レビュー投稿 modal -->
    <div class="modal fade" id="reviewModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">取引の評価・レビュー送信</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="reviewForm">
                        <input type="hidden" id="reviewContractId">
                        <div class="mb-3">
                            <label class="form-label">評価（星1〜5）</label>
                            <select id="reviewRating" class="form-select" required>
                                <option value="5">★★★★★ (5 - 最高)</option>
                                <option value="4">★★★★☆ (4 - 良い)</option>
                                <option value="3">★★★☆☆ (3 - 普通)</option>
                                <option value="2">★★☆☆☆ (2 - 微妙)</option>
                                <option value="1">★☆☆☆☆ (1 - 悪い)</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">コメント（任意）</label>
                            <textarea id="reviewComment" class="form-control" rows="3" placeholder="迅速かつ丁寧な対応でした。"></textarea>
                        </div>
                        <button type="submit" class="btn btn-success w-100">評価を送信する</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const API_URL = ""; // 同一ドメイン運用の場合は空、別ドメインの場合は "http://localhost:8000" 等
        let token = localStorage.getItem("access_token");
        let currentTab = "all";
        let userWallets = [];
        let currentUserId = "";
        let isKing = false;

        async function init() {
            if (!token) {
                alert("ログインが必要です");
                return;
            }
            await loadWallets();
            await loadContracts();
        }

        async function fetchAPI(endpoint, options = {}) {
            options.headers = {
                ...options.headers,
                "Authorization": `Bearer ${token}`,
                "Content-Type": "application/json"
            };
            const res = await fetch(`${API_URL}${endpoint}`, options);
            if (res.status === 401) {
                alert("セッションが切れました。ログインし直してください。");
                return null;
            }
            return res;
        }

        async function loadWallets() {
            const res = await fetchAPI("/api/wallets");
            if (!res || !res.ok) return;
            userWallets = await res.json();

            const cSelect = document.getElementById("cWalletSelect");
            const aSelect = document.getElementById("acceptWalletSelect");
            cSelect.innerHTML = "";
            aSelect.innerHTML = "";

            userWallets.forEach(w => {
                const opt = `<option value="${w.wallet_id}">${w.wallet_name} (残高: ${w.balance} Gold)</option>`;
                cSelect.innerHTML += opt;
                aSelect.innerHTML += opt;
            });
        }

        async function loadContracts() {
            const endpoint = currentTab === "all" ? "/api/contracts" : "/api/my-contracts";
            const res = await fetchAPI(endpoint);
            if (!res || !res.ok) return;

            const container = document.getElementById("contractsContainer");
            container.innerHTML = "";

            let contracts = [];
            if (currentTab === "all") {
                const data = await res.json();
                contracts = data.contracts;
                currentUserId = data.current_user_id;
                isKing = data.is_king;
            } else {
                contracts = await res.json();
            }

            if (contracts.length === 0) {
                container.innerHTML = '<div class="text-center text-muted py-5">該当する契約はありません</div>';
                return;
            }

            contracts.forEach(c => {
                container.innerHTML += renderContractCard(c);
            });
        }

        function renderContractCard(c) {
            const isCreator = c.creator_user_id === currentUserId;
            const isAcceptor = c.acceptor_user_id === currentUserId;
            const isParty = isCreator || isAcceptor;

            let statusBadge = "";
            if (c.status === "OPEN") statusBadge = '<span class="badge bg-primary">募集中</span>';
            else if (c.status === "SIGNED") statusBadge = '<span class="badge bg-warning text-dark">履行中</span>';
            else if (c.status === "COMPLETED") statusBadge = '<span class="badge bg-success">完了</span>';
            else if (c.status === "CANCELLED") statusBadge = '<span class="badge bg-danger">キャンセル済</span>';

            // レビューのレンダリング
            let reviewsHtml = "";
            let hasMyReview = false;
            if (c.reviews && c.reviews.length > 0) {
                reviewsHtml = '<div class="mt-2 pt-2 border-top"><small class="text-muted fw-bold">取引レビュー:</small>';
                c.reviews.forEach(r => {
                    if (r.reviewer_user_id === currentUserId) hasMyReview = true;
                    const stars = "★".repeat(r.rating) + "☆".repeat(5 - r.rating);
                    reviewsHtml += `<div class="small"><span class="star-rating">${stars}</span> ${r.comment || ''}</div>`;
                });
                reviewsHtml += '</div>';
            }

            // ボタンの出し分け
            let actionButtons = "";

            // 1. キャンセルボタン (OPENかつ作成者)
            if (c.status === "OPEN" && isCreator) {
                actionButtons += `<button class="btn btn-outline-danger btn-sm me-1" onclick="cancelContract(${c.id})">キャンセル・返金</button>`;
            }

            // 2. 受注ボタン (OPENかつ作成者以外)
            if (c.status === "OPEN" && !isCreator) {
                actionButtons += `<button class="btn btn-warning btn-sm me-1" onclick="openAcceptModal(${c.id})">受注する</button>`;
            }

            // 3. 完了承認ボタン (SIGNEDかつ作成者)
            if (c.status === "SIGNED" && isCreator) {
                actionButtons += `<button class="btn btn-success btn-sm me-1" onclick="completeContract(${c.id})">履行完了を承認(送金)</button>`;
            }

            // 4. レビュー投稿ボタン (COMPLETEDかつ当事者かつ未評価)
            if (c.status === "COMPLETED" && isParty && !hasMyReview) {
                actionButtons += `<button class="btn btn-outline-success btn-sm me-1" onclick="openReviewModal(${c.id})">★ 評価を投稿</button>`;
            }

            // 5. 国王の強制介入ボタン
            if (isKing && (c.status === "OPEN" || c.status === "SIGNED")) {
                actionButtons += `
                    <div class="dropdown d-inline-block ms-1">
                        <button class="btn btn-dark btn-sm dropdown-toggle" data-bs-toggle="dropdown">👑 国王裁定</button>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item text-success" href="#" onclick="kingOverride(${c.id}, 'force_complete')">強制完了（受注者へ送金）</a></li>
                            <li><a class="dropdown-item text-danger" href="#" onclick="kingOverride(${c.id}, 'force_cancel')">強制破棄（依頼主へ返金）</a></li>
                        </ul>
                    </div>
                `;
            }

            return `
                <div class="col-md-6 col-lg-4">
                    <div class="card contract-card status-${c.status} h-100 shadow-sm">
                        <div class="card-body">
                            <div class="d-flex justify-content-between align-items-start mb-2">
                                <h5 class="card-title mb-0">${c.title}</h5>
                                ${statusBadge}
                            </div>
                            <p class="card-text text-secondary small">${c.description}</p>
                            <div class="p-2 bg-light rounded mb-2">
                                <div class="fw-bold text-primary">報酬: ${c.amount} Gold</div>
                                <div class="small text-muted">依頼主: ${c.creator_nickname}</div>
                            </div>
                            ${reviewsHtml}
                            <div class="mt-3 text-end">
                                ${actionButtons}
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll("#marketTabs .nav-link").forEach(el => el.classList.remove("active"));
            event.target.classList.add("active");
            loadContracts();
        }

        // --- 契約作成 ---
        document.getElementById("createContractForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const body = {
                title: document.getElementById("cTitle").value,
                description: document.getElementById("cDesc").value,
                amount: parseInt(document.getElementById("cAmount").value),
                creator_wallet_id: document.getElementById("cWalletSelect").value
            };

            const res = await fetchAPI("/api/contracts", { method: "POST", body: JSON.stringify(body) });
            if (res && res.ok) {
                alert("契約を発行し、報酬をエスクローに預け入れました！");
                bootstrap.Modal.getInstance(document.getElementById("createContractModal")).hide();
                document.getElementById("createContractForm").reset();
                await loadWallets();
                await loadContracts();
            } else {
                const err = await res.json();
                alert(`エラー: ${err.detail}`);
            }
        });

        // --- 受注処理 ---
        function openAcceptModal(contractId) {
            document.getElementById("acceptContractId").value = contractId;
            new bootstrap.Modal(document.getElementById("acceptContractModal")).show();
        }

        document.getElementById("acceptContractForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const contractId = document.getElementById("acceptContractId").value;
            const body = { acceptor_wallet_id: document.getElementById("acceptWalletSelect").value };

            const res = await fetchAPI(`/api/contracts/${contractId}/accept`, { method: "POST", body: JSON.stringify(body) });
            if (res && res.ok) {
                alert("契約を正式に受注しました！");
                bootstrap.Modal.getInstance(document.getElementById("acceptContractModal")).hide();
                await loadContracts();
            } else {
                const err = await res.json();
                alert(`エラー: ${err.detail}`);
            }
        });

        // --- キャンセル処理 ---
        async function cancelContract(contractId) {
            if (!confirm("この契約を取り消しますか？預けた報酬は全額返金されます。")) return;
            const res = await fetchAPI(`/api/contracts/${contractId}/cancel`, { method: "POST" });
            if (res && res.ok) {
                alert("契約をキャンセルし、返金を受け取りました。");
                await loadWallets();
                await loadContracts();
            } else {
                const err = await res.json();
                alert(`エラー: ${err.detail}`);
            }
        }

        // --- 完了承認処理 ---
        async function completeContract(contractId) {
            if (!confirm("履行完了を承認し、エスクローから受注者へ送金しますか？")) return;
            const res = await fetchAPI(`/api/contracts/${contractId}/complete`, { method: "POST" });
            if (res && res.ok) {
                alert("承認が完了し、受注者へ報酬が支払われました！");
                await loadWallets();
                await loadContracts();
            } else {
                const err = await res.json();
                alert(`エラー: ${err.detail}`);
            }
        }

        // --- レビュー処理 ---
        function openReviewModal(contractId) {
            document.getElementById("reviewContractId").value = contractId;
            new bootstrap.Modal(document.getElementById("reviewModal")).show();
        }

        document.getElementById("reviewForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const contractId = document.getElementById("reviewContractId").value;
            const body = {
                rating: parseInt(document.getElementById("reviewRating").value),
                comment: document.getElementById("reviewComment").value
            };

            const res = await fetchAPI(`/api/contracts/${contractId}/review`, { method: "POST", body: JSON.stringify(body) });
            if (res && res.ok) {
                alert("評価を送信しました！");
                bootstrap.Modal.getInstance(document.getElementById("reviewModal")).hide();
                document.getElementById("reviewForm").reset();
                await loadContracts();
            } else {
                const err = await res.json();
                alert(`エラー: ${err.detail}`);
            }
        });

        // --- 国王強制介入 ---
        async function kingOverride(contractId, mode) {
            const actionName = mode === "force_complete" ? "【強制完了】" : "【強制破棄】";
            if (!confirm(`👑 国王権限を行使しますか？\n処理: ${actionName}`)) return;

            const res = await fetchAPI(`/api/contracts/${contractId}/king-override`, {
                method: "POST",
                body: JSON.stringify({ mode })
            });

            if (res && res.ok) {
                const data = await res.json();
                alert(data.message);
                await loadWallets();
                await loadContracts();
            } else {
                const err = await res.json();
                alert(`エラー: ${err.detail}`);
            }
        }

        // 初期化実行
        init();
    </script>
</body>
</html>
